; Boot manifest: OSRS revision 239 with the server embedded in this process.
;
;   ./run-live.sh manifest_osrs239.ini testc test
;
; At OldSchool revision >= 237 map (lX_Z) archives are stored plain — this cache
; ships no xteas.json. Before the identity gate, every loc square loaded as
; zero locs because the loader treated a missing key as failure.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
; The embedded server reads this same revision-239 cache; no separate socket
; server or cache profile is needed for this manifest.
dir=cache.osrs239
spawn=50,50

[net:boot]
rev=osrs239
transport=embed
; Kept for a structural diff with the TCP profile; the embedded transport does
; not bind or dial a port.
host=localhost
port=43595
client_version=239
; RSA public key matching the embedded mock server's private key.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[spawn:hotkeys]
; Whisperer 12204
npc=12204

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=161

; ---------------------------------------------------------------------------
; The root UI layout, inline
; ---------------------------------------------------------------------------
;
; There is one root-build path, and it is RevConfig. A cache gameframe is not a
; special case of it: `type=rs_iface` with no `componentno=` is a mount point
; for `interface_id` above, and the cache pack is baked as its CHILDREN.
;
; That containment is the whole point. Root sibling order is paint order, and
; the CS2 scripts rearrange the gameframe freely once it is up — reparenting
; panels, creating dynamic children, hiding layers. Because every one of those
; nodes is inside the `rs_iface` subtree, none of it can reorder the sibling
; list declared here. Whatever this file lists after the frame stays after it.
;
; Sections are prefixed `[revconfig:…]` because the two dialects overlap: bare
; `left`, `top`, `right`, `bottom`, `table`, `index`, `filename` and `format`
; are all meaningful RevConfig keys, and boot-manifest sections such as
; `[ui:gameframe]` use some of those spellings for something else. The prefix
; keeps each parser to its own sections. Everything after `revconfig:` is
; ordinary RevConfig, so a block here can be lifted into a standalone
; `revconfig_ui=` file (or the other way round) unchanged.
;
; Load order is `revconfig_ui=`, then `revconfig_cache=`, then these inline
; sections — so inline records append after a shared file's, never restate it.
;
; The `overlay` record below is the developer overlay (docs/debug_overlay.md):
; declared after the frame, so it paints after it. It is switched off until the
; P key, and switched off it draws nothing at all — which is why every lane can
; carry it without moving a pixel.
;
; A manifest that declares no `[revconfig:…]` at all still boots: the builder
; synthesises exactly the gameframe pair below from `interface_id`.
[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:layout:root]
c=gameframe
=
c=overlay

; Where the chat lines live.
;
; At this revision the chatbox is not a surface the client paints — it is
; interface 162 (`chatbox`), which ships 500 empty text components inside a
; scrolling layer and expects the client to fill them in. Background, filter
; tabs, Report button, scrollbar and fonts are all already in the cache; the
; client's whole contribution is the text. See src/game/rs_chat_widgets.h.
;
; The children are named in the content tree's interfaces/chatbox.compack:
;   57 input        the typed line, "name: text*"
;   58 scrollarea   the scrolling layer the lines sit in
;   59 line0        ... 558 line499
[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
; No chatbox_input= here on purpose. Child 57 (`chatbox:input`) is written by
; the cache's own clientscript 223 — it composes `<icon><name>: <typed>*`
; from %varcstring335, which the chatbox's onKey handler (script 73) edits.
; Declaring it here makes the client overwrite that every frame with a line
; built from an input buffer this era never fills. See rs_chat_widgets.h.
chatbox_line_height=14
