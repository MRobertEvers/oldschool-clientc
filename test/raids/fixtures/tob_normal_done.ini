; tob_normal_done: fresh_lumbridge.ini (this directory) plus ONE Theatre of
; Blood completion, so an account passes the door's Hard Mode check (raid
; seam19, tob_party_room_test_shape): tob_party.rs2 [oploc1,tob_surface_raid_entrance]
; and ~tob_choose_mode refuse Hard to `%varp6826_tob_completions < 1` ("You must
; complete the Theatre of Blood once before attempting Hard Mode."). A Hard room
; test gives each of its three raiders this fixture. Nothing else differs.
;
; ToriRSServer player save. Written by torirs_server_save.c; safe to hand-edit.
; A key this server does not know is skipped, and a missing one keeps
; whatever a fresh character would have -- so this save states only what a
; quest fixture actually needs: a tutorial-graduate account standing beside
; Hans (docs/WORKTREE_SETUP.md), with everything else (stats, inventory, worn,
; bank) left at the fresh-character default.
;
; Shape copied from saves/testc.ini; content trimmed to the quest set.

[player]
version = 1
name = tob_normal_done
; Beside Hans' patrol1 waypoint (0_50_50_7_33 = 3207,3233 --
; areas/lumbridge/configs/lumbridge.npc; patrol1 is his spawn tile, the tile
; ToriRSServer_CombatRespawnTick returns him to).
x = 3206
z = 3233
level = 0
run_energy = 10000
run_toggle = 1
client_layout_mode = 1

[varps]
; only varps whose .varp config says scope=perm -- exactly the quest set.
;
; tutorial (id 281): scope=perm, transmit=yes -- the client's own
; [proc,in_tutorial] treats anything below 1000 as "still in the tutorial"
; (server/scripts/tutorial/configs/tutorial.varp), so 1000 is the finished
; value, not a number this fixture chose.
;
; newplayer_design_done (id 7136, pack/varp.alloc:1443): scope=perm -- set so
; a headless login does not stop on the Character Creator modal, which
; nothing headless can click (docs/WORKTREE_SETUP.md).
281 = 1000
7136 = 1
;
; tob_completions (id 6826): scope=perm, transmit=no
; (minigames/minigame_tob/configs/tob.varp [varp6826_tob_completions]); 1 = one
; completion, the door's minimum for Hard.
6826 = 1
