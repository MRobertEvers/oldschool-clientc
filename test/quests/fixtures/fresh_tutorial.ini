; ToriRSServer player save. Written by torirs_server_save.c; safe to hand-edit.
; A key this server does not know is skipped, and a missing one keeps
; whatever a fresh character would have.
;
; A character on its first login: standing on the tutorial home tile (the
; RuneScape Guide's house, DEFAULT_TUTORIAL_HOME_* in torirs_server_boot.c)
; with no varps at all. %varp6973_newplayer_seeded is absent, so the login runs
; ~newplayer_setup, which finds the coord on the island (~in_tutorial_island)
; and starts the tutorial at step 0 rather than dealing the mainland kit;
; %varp7811_newplayer_design_done is absent, so the design panel opens.

[player]
version = 1
name = fresh_tutorial
x = 3094
z = 3106
level = 0
run_energy = 10000
run_toggle = 0
client_layout_mode = 1
