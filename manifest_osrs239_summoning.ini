; Self-contained OSRS revision 239 Summoning development lane.
;
;   ./src/torirs --manifest manifest_osrs239_summoning.ini
;
; This binds the client-visible cache overlay and embedded server's compiled
; script overlay. The pristine manifest_osrs239.ini remains unchanged.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239.summoning
spawn=50,50

[net:boot]
rev=osrs239
transport=embed
host=localhost
port=43595
client_version=239
scripts=OSRS-Content/osrs239-content/server/scripts/build_summoning
user=testc
pass=test
; Make the Summoning sidebar available on a fresh development account. This
; uses the ordinary persisted unlock path; it does not summon a familiar.
cheat=summoning_unlock
; RSA public key matching the embedded mock server's private key.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[client:args]
arg=--soft3d

[spawn:hotkeys]
; Whisperer 12204
npc=12204

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=161

; Keep the gameframe and developer overlay in separate root siblings. The
; Summoning UI itself is an overlay-owned cache interface mounted by CS2 inside
; wornitems:universe; it is not this developer overlay.
[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:layout:root]
c=gameframe
=
c=overlay

[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
chatbox_line_height=14

[features:boot]
era=osrs
ground_click_nearest=box10_rect
