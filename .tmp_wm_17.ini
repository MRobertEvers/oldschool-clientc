; Boot manifest: the world map interface (595) on its own, OSRS revision 230.
;
;   ./run-worldmap.sh manifest_osrs230_worldmap.ini
;   src/torirs --manifest manifest_osrs230_worldmap.ini
;
; The 239 twin (manifest_osrs239_worldmap.ini) documents the layout; the only
; differences here are the cache identity and that revision 230 predates the
; modern clientscript trailer, so 595's scripts decode with the legacy footer
; (RSCache_ClientScriptFlags picks per profile — see src/cache/rscache_io.h).
;
; Map (lX_Z) archives are still XTEA-encrypted at 230, but 595 has no world
; viewport component, so nothing here loads a map square.

[cache:boot]
epoch=dat2
game=oldschool
revision=230
quirks=none
dir=cache.osrs230

[ui:boot]
logic=cs2
chrome=cache
interface_id=161

[ui:gameframe]
17 = 595
