; Boot manifest: the world map interface (595) on its own, OSRS revision 239.
;
;   ./run-worldmap.sh manifest_osrs239_worldmap.ini    ; headless, dumps, exits
;   src/torirs --manifest manifest_osrs239_worldmap.ini ; windowed, runs until closed
;
; `interface_id=595` makes the world map the tree *root* — no gameframe, no
; sidebar, nothing else in the tree — which is what the implementation work
; wants: every component, bound and draw command in a dump belongs to 595.
; There is no [net:boot] section, so this manifest is offline by construction.
;
; Standalone means no gameframe is open, so IF_GETTOP answers 595 and the
; layout helper (script 900) has no enum for it — the onload takes its unknown-
; gameframe path. To exercise the *mounted* world map instead, boot the real
; gameframe and mount 595 into it:
;
;   [ui:boot]       interface_id=161
;   [ui:gameframe]  <component> = 595
;
; What it looks like today: the onload runs and builds the whole tree (~730
; components, the key list, the buttons), but the frame is near-flat grey. Two
; separate reasons, both open work:
;   - the map surface is clientCode 1400 (CONTENT_WORLDMAP) / 1401
;     (CONTENT_WORLDMAP_OVERVIEW), cache components with no builtin behind them,
;     so nothing draws a map (src/ui/uitree.h, src/game/rs_worldmap.h);
;   - the onload sizes its panels from host ops that still answer 0 here, so the
;     panels resolve to degenerate boxes — TORIRS_DUMP_BOUNDS=595 shows 595|6
;     collapsing to a few pixels instead of its 715x453 pack size.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239

[ui:boot]
logic=cs2
chrome=cache
interface_id=595
