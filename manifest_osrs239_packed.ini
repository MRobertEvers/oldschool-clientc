; Boot manifest: OSRS revision 239 booted from the cache PACKED FROM CONTENT.
;
; Identical to manifest_osrs239.ini but for `dir=`. That one boots
; `cache.osrs239`, the pristine dump; this boots `cache.osrs239_packed`, which
; is built from the content tree alone with no base cache to inherit from:
;
;   make -C src mock230-cache MOCK230_CACHE_DIR=$PWD/cache.osrs239_packed
;
; That difference is the point of this file: booting it is what proves the
; packed cache is a cache a client can read, rather than a directory with the
; right file names in it.
;
;   src/torirs.exe --manifest manifest_osrs239_packed.ini

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239_packed
spawn=50,50

[client:args]
arg=--offline

[action:spawn_whisperer]
t=spawn_npc
a=id=12204

[action:loc_editor_toggle]
t=loc_editor_toggle

[debug:hotkeys]
8=spawn_whisperer
9=loc_editor_toggle

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=161

; Root layout, inline. `type=rs_iface` with no `componentno=` mounts the
; `interface_id` above, and the cache pack is baked as its CHILDREN — so
; whatever this file lists after it stays after it, however the CS2 scripts
; rearrange the frame. manifest_osrs239.ini carries the long note.
;
; The `overlay` record is the developer overlay (docs/debug_overlay.md): off
; until the P key, and off it draws nothing at all.
[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:component:entity_overlay]
type=entity_overlay

[revconfig:component:cross]
type=cross
w=16
h=16

[revconfig:component:hovertext]
type=hovertext
font=496

[revconfig:component:minimenu]
type=minimenu
font=496

[revconfig:layout:root]
c=gameframe
=
c=overlay
=
c=entity_overlay
=
c=cross
=
c=hovertext
=
c=minimenu

; Where the chat lines live.
;
; At this revision the chatbox is not a surface the client paints — it is
; interface 162 (`chatbox`), which ships 500 empty text components inside a
; scrolling layer and expects the client to fill them in. Background, filter
; tabs, Report button, scrollbar and fonts are all already in the cache; the
; client's whole contribution is the text. See src/game/rs_chat_widgets.h.
;
; The children are named in the content tree's interfaces/chatbox.compack:
;   57 input        the typed line, "name: text*"
;   58 scrollarea   the scrolling layer the lines sit in
;   59 line0        ... 558 line499
[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
; No chatbox_input= here on purpose. Child 57 (`chatbox:input`) is written by
; the cache's own clientscript 223 — it composes `<icon><name>: <typed>*`
; from %varcstring335, which the chatbox's onKey handler (script 73) edits.
; Declaring it here makes the client overwrite that every frame with a line
; built from an input buffer this era never fills. See rs_chat_widgets.h.
chatbox_line_height=14
; The unfocused prompt, and how to undo it. Child 57 is the same line child
; `chatbox_input=` above deliberately does not claim: the client never composes
; it, it only paints "Press Enter to chat..." over the script's version while
; the chat line has no focus, and runs clientscript 223 on focus gain to put the
; script's version back. See rs_chat_widgets.h (`prompt_child`).
chatbox_prompt=57
chatbox_input_script=223

; ---------------------------------------------------------------------------
; Client-behaviour era
; ---------------------------------------------------------------------------
;
; This manifest states nothing here, so the era is derived from the cache
; identity above: dat2 + oldschool -> `osrs`. Every key is listed commented out
; at the value that derivation gives it, so uncommenting one as written changes
; nothing — each line is an edit point, not a change. Keep the value alone on
; the line: bm_parse_int rejects trailing text, so `painter_draw_distance=40 ;
; wider` is a parse error, not a value. Full descriptions in
; src/features/features.h.
[features:boot]
; lostcity | osrs | server_routed. Worth stating only when the *server*
; diverges from what the cache implies — xrsps paths server-side over a rev-233
; cache, so it needs server_routed; a cache-derived boot like this one does not.
;era=osrs
; Unreachable ground/minimap click: ring3 (Client-TS's 3x3 ring, lowest step
; count) | box10_rect (official OSRS, 21x21 ranked by squared distance to the
; target rect) | none. Under this server-authoritative era the *server* answers
; the click, so set the same model there too (MOCK230_GROUND_CLICK_NEAREST) —
; the two halves must not disagree.
;ground_click_nearest=box10_rect
; Painter radius in tiles, 25..90 (deob class112.method3959). The osrs table
; says 32; Client-TS is fixed at 25.
;painter_draw_distance=32
; Permissive extension, off in every era table on purpose: 1 = when the box
; above finds no reachable tile, walk to the flooded tile nearest the click
; anyway instead of doing nothing.
;ground_click_unbounded=0
; Permissive extension: 1 = a click that hit no ground triangle at all (sky,
; the void ringing an instance's floor, a plane the filter refused) resolves to
; the scene tile nearest the cursor instead of walking nowhere.
;ground_click_offmap=0
