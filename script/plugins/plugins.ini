; Which scripts the client loads, and in what order.
;
; This file is yours. plugin_prefs.ini beside the client is the host's -- it
; holds each plugin's settings and enable state, and is rewritten as they
; change. Author-side switches go here; user-side state goes there.
;
; source= resolves under script/, like every other scripted asset.

[plugin:tile-indicator-lua]
source=plugins/tile_indicator.lua

[plugin:entity-highlighter]
source=plugins/entity_highlighter.lua

; Off until asked for. A beam of light over every drop is a strong opinion to
; hold on someone's behalf on first launch; the plugin settings panel turns it
; on and remembers, or set enabled=1 here.
[plugin:loot-beam]
source=plugins/loot_beam.lua
enabled=1

; Off for the same reason the beam is, plus one of its own: this paints text
; into the world viewport, and the headless EXIT_BMP shots this tree verifies
; rendering with would then carry it. The settings panel turns it on and
; remembers, or set enabled=1 here.
[plugin:ground-items]
source=plugins/ground_items.lua
enabled=1

; On by default, unlike the two above: it paints nothing, costs nothing until
; something notable happens, and a client that quietly keeps a picture of your
; first 99 is the whole point of it being here. The moments it takes are
; individually switchable in the settings panel.
[plugin:screenshot]
source=plugins/screenshot.lua
enabled=1
