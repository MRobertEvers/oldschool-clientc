; Which scripts the client loads, and in what order.
;
; This file is yours. plugin_prefs.ini beside the client is the host's -- it
; holds each plugin's settings and enable state, and is rewritten as they
; change. Author-side switches go here; user-side state goes there.
;
; source= resolves under script/, like every other scripted asset.
;
; EVERY plugin ships OFF; the player turns on what they want in the plugin
; panel, and plugin_prefs.ini remembers it. `enabled=` here is the script's
; DEFAULT, declared the way a C plugin declares TORIRS_PLUGIN_DISABLED_BY_DEFAULT
; -- not a state applied over the player's choice. A missing `enabled=` means
; on (a probe manifest naming one script means "run it"), so every entry here
; says 0. The C plugins registered in code are off by default too, except the
; essential ones, which have no switch; this file is the Lua list.

[plugin:tile-indicator-lua]
source=plugins/tile_indicator.lua
enabled=0

[plugin:entity-highlighter]
source=plugins/entity_highlighter.lua
enabled=0

; RuneLite's NPC Indicators render styles, including the south-west tile an
; npc's coordinate actually names. Draws nothing until a name is listed.
[plugin:npc-indicators]
source=plugins/npc_indicators.lua
enabled=0

; A beam of light over every drop is a strong opinion to hold on someone's
; behalf, and this used to be off for that reason. It is on now; the settings
; panel is where someone who disagrees turns it back off, and it remembers.
[plugin:loot-beam]
source=plugins/loot_beam.lua
enabled=0

; Paints text into the world viewport, which means the headless EXIT_BMP shots
; this tree verifies rendering with carry it. That is a real cost of having it
; on, and the reason a rendering diff should be read with it in mind rather
; than a surprise.
[plugin:ground-items]
source=plugins/ground_items.lua
enabled=0

; Paints nothing and costs nothing until something notable happens, and a
; client that quietly keeps a picture of your first 99 is the whole point of it
; being here. The moments it takes are individually switchable in the settings
; panel.
[plugin:screenshot]
source=plugins/screenshot.lua
enabled=0

; Lightweight performance readout in the top-left of the world viewport.
; Its position, colours, refresh rate and individual values are configurable.
[plugin:performance-display]
source=plugins/performance_display.lua
enabled=0

; RuneLite's Visual Metronome: a box in the viewport that changes colour every
; server tick, plus optional tick numbers and a metronome-coloured true tile.
[plugin:visual-metronome]
source=plugins/visual_metronome.lua
enabled=0

[plugin:olm-cycle]
source=plugins/olm_cycle.lua
enabled=0
