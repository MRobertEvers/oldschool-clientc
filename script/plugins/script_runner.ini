; The watched client's Lua plugins: the everyday set, plus the quest driver and
; the Scripts tab. profiles/osrs239-scripts.ini points TORIRS_PLUGIN_MANIFEST
; here; no other profile or test reads this file.
;
; The first six entries are plugins.ini's, in its order and with its switches
; (screenshot excepted, below):
; a manifest has no include, so they are restated here. Keep the two in step --
; a plugin added to plugins.ini and not here is simply absent from a watched
; client, nothing worse. The native (C) plugins are registered in code and are
; not listed in either file; this profile does not set TORIRS_PLUGIN_ONLY, so
; the watched client has the same native set the everyday client has.
;
; A quest TEST never loads this file: tools/quest_gate/run.py writes its own
; manifest with the quest driver alone (quest_driver.ini says why).

[plugin:tile-indicator-lua]
source=plugins/tile_indicator.lua
enabled=1

[plugin:entity-highlighter]
source=plugins/entity_highlighter.lua
enabled=1

[plugin:loot-beam]
source=plugins/loot_beam.lua
enabled=1

[plugin:ground-items]
source=plugins/ground_items.lua
enabled=1

; OFF here, and only here: a script's setup is a run of `::setlevel <skill> 99`
; cheats, and every one of them is a level-up the screenshot plugin keeps a
; picture of (measured: five PNGs under plugin_assets/screenshot/<account>/Levels
; in the first five seconds of tob_maiden). A watched run's pictures are the
; driver's own t.shot frames in build/quest_gate/watch_<id>/shots/.
[plugin:screenshot]
source=plugins/screenshot.lua
enabled=0

[plugin:performance-display]
source=plugins/performance_display.lua
enabled=1

; The driver. Idle until something calls api.drive.start: in this profile that
; is the Scripts tab below, and TORIRS_DRIVE_ON_DEMAND=1 is what makes it idle
; rather than absent. The section NAME is what the C loader keys on
; (DRIVE_PLUGIN_NAME): it must stay `quest-driver`.
[plugin:quest-driver]
source=plugins/quest_driver.lua
enabled=1

; The Scripts tab (script_runner.lua). Its icon and its list are assets under
; plugins/assets/script-runner/; the list is a link to
; build/quest_gate/_scripts/index.tsv, written by tools/raid_gate/prepare_scripts.py.
[plugin:script-runner]
source=plugins/script_runner.lua
enabled=1
