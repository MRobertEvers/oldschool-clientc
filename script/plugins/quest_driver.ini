; The quest driver, alone. A quest test is a client process with exactly this
; manifest: no tile indicator, no ground items, no loot beams -- every one of
; them paints into the viewport, and a quest test's output is a screenshot.
; This manifest only governs LUA plugins; the native ones (item-stats, the
; trackers, minimap orbs, NXT highlights) are kept out by TORIRS_PLUGIN_ONLY=lua
; in tools/quest_gate/run.py and conformance.py -- the run book rule.
;
; The C loader (PluginDrive_ScriptPartCount, src/plugin/torirs_plugin_drive.c)
; prepends script/plugins/quest_driver/*.lua to the source below in a fixed
; order: the sandbox has no `require`, so the driver is one chunk assembled
; from eight files. The entry below is LAST and is the only one that returns.
;
; The plugin NAME is what the loader keys on. Renaming this section without
; renaming DRIVE_PLUGIN_NAME loses every verb and leaves a plugin that loads.
[plugin:quest-driver]
source=plugins/quest_driver.lua
enabled=1
