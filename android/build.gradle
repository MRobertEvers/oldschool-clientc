/*
 * The ToriRS Android client.
 *
 * THIS FILE DOES NOT BUILD C.
 *
 * There is deliberately no externalNativeBuild block. The native client is
 * built by the tree's own makefile -- `make -C src PLATFORM=android` -- which
 * is the single place that knows what a platform is (src/platform/platform.mk)
 * and the only place that gets to decide this lane's flags. A CMakeLists here
 * would be a SECOND description of the same program: it would have to restate
 * every source file, every -D and every include path, and the two would drift
 * silently, because a stale duplicate still compiles.
 *
 * So Gradle's job is exactly the APK: take the .so the makefile produced, add
 * the Java shell around it, sign it and install it. See android/README.md.
 */
plugins {
    id 'com.android.application' version '8.7.0'
}

android {
    namespace 'com.torirs.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.torirs.client"

        /*
         * minSdk 21 is a real target, not a formality: the device this lane was
         * brought up on is a Motorola XT1060 running Android 5.1 (API 22),
         * armeabi-v7a, and it is the reason the software rasterizer stays the
         * default and the GLES2 path is the opt-in.
         */
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            /*
             * Only what src/makefile actually produces. An abiFilter naming an
             * ABI with no .so does not fail the build -- it produces an APK
             * that installs and then dies with UnsatisfiedLinkError on a device
             * of that architecture, which is a much worse way to find out.
             *
             * Build them with:
             *   make -C src PLATFORM=android ANDROID_ABI=armeabi-v7a OPT=1 all
             *   make -C src PLATFORM=android ANDROID_ABI=arm64-v8a  OPT=1 all
             */
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    /*
     * The makefile writes straight into this tree, so a native rebuild is
     * immediately what the next assemble packages.
     */
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            /*
             * NO ASSETS.
             *
             * The client reads its cache, manifests and revconfig with ordinary
             * stdio (src/platform/platform_x_io.c), and an APK asset is not a
             * file -- it is a compressed range inside the .apk that only
             * AssetManager can open. Bundling the cache would therefore not
             * even work, quite apart from a rev-239 cache being 218 MB.
             *
             * Those trees are pushed to the device instead, in the repo's own
             * layout so that each manifest's relative paths resolve unchanged.
             * `tools/android_push_data.sh` does it; android/README.md explains
             * why the layout has to mirror the repo.
             */
            /* The only packaged assets are the application-owned canonical
             * plugin-chrome bundle copied below. Game/cache data remains
             * external exactly as documented. */
            assets.srcDirs = [layout.buildDirectory.dir('generated/pluginChromeAssets')]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    /*
     * The .so is already stripped-or-not by the makefile's own link line, and
     * it carries the DWARF the NDK's stack symbolizer needs. Letting Gradle
     * strip it again would leave `ndk-stack` unable to name a frame.
     */
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/libtorirs.so']
            /*
             * Store the .so uncompressed and page-aligned. On API 23+ the
             * loader then maps it straight out of the APK instead of extracting
             * a private copy at install time -- which for a 27 MB library is the
             * difference between a slow first launch and an instant one.
             */
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    ndkVersion '27.0.12077973'

    lint {
        // Nothing here ships to a store; a lint failure must not stand between
        // a native change and seeing it on the phone.
        abortOnError false
    }
}

/*
 * No dependencies at all -- not even AndroidX.
 *
 * The whole Java side is two Activities and a directory listing, written
 * against the framework classes that have existed since API 1. AndroidX would
 * add ~1.5 MB and a resolution step to an app whose entire UI is a list and a
 * countdown, and every one of its compatibility shims is for a problem this app
 * does not have.
 */
dependencies {
}

tasks.register('syncPluginChromeBundle', Sync) {
    from('../src/plugin_chrome') {
        include('legacy-ie8.html', 'legacy-ie8.css', 'codec-es3.js', 'runtime-ie8.js')
    }
    from('../res/plugin_chrome/skin') {
        into('skin')
    }
    from('../res/plugin_chrome/font') {
        into('font')
    }
    into(layout.buildDirectory.dir('generated/pluginChromeAssets/plugin_chrome'))
    doLast {
        def root = layout.buildDirectory.dir('generated/pluginChromeAssets/plugin_chrome').get().asFile
        ['legacy-ie8.html', 'legacy-ie8.css', 'codec-es3.js', 'runtime-ie8.js',
         'skin/PanelBody.png', 'skin/PluginIcon.png',
         'skin/ButtonLeft.png', 'skin/ButtonMid.png', 'skin/ButtonRight.png',
         'skin/CheckOn.png', 'skin/CheckOff.png',
         'skin/CheckBoxOn.png', 'skin/CheckBoxOff.png',
         'skin/DropdownBody.png', 'skin/CloseButton.png',
         'skin/ScrollUp.png', 'skin/ScrollDown.png', 'skin/ScrollTrack.png',
         'skin/ScrollGripTop.png', 'skin/ScrollGripMid.png',
         'skin/ScrollGripBottom.png',
         'skin/FrameTopLeft.png', 'skin/FrameTop.png',
         'skin/FrameTopRight.png', 'skin/FrameLeft.png',
         'skin/FrameRight.png', 'skin/FrameBottomLeft.png',
         'skin/FrameBottom.png', 'skin/FrameBottomRight.png'].each { relative ->
            if (!new File(root, relative).isFile())
                throw new GradleException("canonical plugin chrome is incomplete: ${relative}")
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncPluginChromeBundle'))
}
