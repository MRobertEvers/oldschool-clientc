pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

/*
 * A single-module build: this directory IS the app. The previous project
 * declared `include ':app'` while having no app/ directory, which Gradle
 * tolerates and which meant the module here was never actually configured.
 */
rootProject.name = "ToriRS"
