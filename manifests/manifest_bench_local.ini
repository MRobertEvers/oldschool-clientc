; ---------------------------------------------------------------------------
; What this world is DERIVED from
; ---------------------------------------------------------------------------
;
; The cache is shipped, and there is no script pack because there is no server.
; So this world prepares nothing, and `./launch bench` starts measuring as soon
; as the client is built.
[derived:cache]
pristine=yes
note=pristine rev-239 cache, shipped rather than baked
