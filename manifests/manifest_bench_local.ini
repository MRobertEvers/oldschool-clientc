; Boot manifest: OSRS revision 239, held still so a renderer can be measured.
;
;   ./launch bench osrs239-bench
;
; This is the osrs239 world with everything that MOVES taken out of it, plus a
; `[bench:*]` suite naming the scenes to measure. It is a separate world rather
; than a profile over manifest_osrs239.ini because it is a different world: no
; server, no login, no npc spawns, no debug hotkeys, and a camera that is pinned
; instead of driven. A profile cannot subtract a `[net:boot] transport=` or an
; `[action:*]`, and a benchmark that inherits them measures them.
;
; What is deliberately IDENTICAL to manifest_osrs239.ini: the cache, the
; revision, the RevConfig pair and the feature era. A renderer number is only
; worth comparing against the world people actually run, so the geometry,
; textures and draw distance this suite times are that client's.
;
; What is deliberately NOT: the gameframe. The UI here is one world viewport
; filling the canvas -- see `[revconfig:layout:root]` below for why.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
; The one cache every scene in this file is measured against. A benchmark that
; could name a second cache is a benchmark that can compare two caches while
; reporting a renderer change.
dir=../../../../cache.osrs239.sparse
; Only a fallback: every scene below names its own squares, and the runner
; passes them through TORIRS_WORLD_MAP.
spawn=50,50

; No `transport=` and no `host=`. --offline clears cfg.connect_target, so
; app.net is never constructed and the transport kind is never read (main.c
; ~4593) -- but omitting `host=` means bootmanifest never sets a connect target
; in the first place, so this world is offline by construction rather than by
; flag. `rev=` stays: it is the protocol table, and dropping it would change
; which revision's client behaviour is being timed.
[net:boot]
rev=osrs239
client_version=239

[ui:boot]
logic=cs2
chrome=revconfig
; No `interface_id=`. The root of this world is the `[revconfig:layout:root]`
; below -- one world viewport and nothing else -- so there is no cache
; gameframe group to mount under it. App_OpenRootInterface still runs the
; RevConfig build; -1 only means no interface pack is baked into it.
revconfig_cache=../revconfig/osrs239/osrs239_dat2_cache.ini
; Points, not device pixels -- so `canvas=` in a scene below means the same
; number of rasterised pixels on every machine that runs the suite. On a Retina
; display a HighDPI drawable would quadruple the raster work without changing a
; single line of this file, and the comparison would silently be against a
; different workload.
hidpi=0
; No plugin layer. A plugin is client code with its own opinion about the
; frame -- gameframe-layout relays the whole gameframe out from its own saved
; layout -- so a run that carries one is timing that opinion as if it were the
; renderer's. It is also the reason a profile run of this world visibly
; flickers: the base frame and the plugin's layout each mount, so the chrome is
; torn down and rebuilt on a cycle and one frame in ~18 comes out with the
; classic gameframe on it instead of the resizable one.
plugins=0
; The canvas IS the window, so `canvas=` in a scene below is the number of
; pixels the rasteriser actually writes. Under `fixed` the tree is laid out at
; the classic 765x503 and the finished frame is SCALED to the window, so a
; scene asking for 1440x900 would measure a 765x503 raster and a stretch.
windowmode=resizable

[chrome]
executor=buffer
borderless=1

; The whole UI: one world viewport, filling the canvas.
;
; This suite measures the software rasteriser, and every widget in the tree is
; a second thing being measured with it. The gameframe is ~1,000 components --
; sprites, text, the inventory grid, the minimap -- rebuilt and blitted every
; frame, and it is opaque: the panels and the chat box cover roughly a third of
; the canvas, so mounting it does not just ADD UI cost, it REMOVES world pixels
; and understates the 3D raster the run exists to time.
;
; A viewport component is also load-bearing rather than decorative: the offline
; world trigger is gated on `world_view_valid`, which a CONTENT_WORLD (1337)
; node is what sets. Without one the map never loads and every scene renders
; void. TORIRS_WORLD_NODE_DEBUG=1 reports whether the tree got one.
;
; Nothing else is here on purpose -- no cross, hovertext or minimenu (there is
; no mouse in a bench run), no debug_overlay or entity_overlay (they draw
; nothing until a keypress, but a suite that carries a component nobody can see
; is a suite where somebody eventually turns it on and wonders why the numbers
; moved). `./launch run osrs239-bench` shows the same bare viewport, which is
; the point: what you look at by hand is what was timed.
[revconfig:component:world]
type=world

; ---------------------------------------------------------------------------
; Touch feedback -- the inkwell
; ---------------------------------------------------------------------------
;
; This profile declares no cross, so there is nothing to override: the marker is
; declared outright, and `@mobile` keeps it off the desktop entirely -- where the
; pointer already shows the user that their click landed.
;
; It is shown for EVERY touch. That is the difference from the cross: the cross
; is drawn by the paths that DID something, so a tap on a widget, a tap that
; missed, or a tap during a modal draws nothing at all -- and on a touchscreen,
; with no pointer to prove the device saw it, a tap that draws nothing simply
; gets repeated.
;
;   style=          splash | blot | ripple
;   walk_color=     yellow | red
;   interact_color= yellow | red
[revconfig:component:touchmark@mobile]
type=inkwell
style=splash
walk_color=yellow
interact_color=red
; A box, because a 0x0 node is skipped by the emit walk. The marker draws
; itself centred on the touch, so this is a size and not a position.
w=64
h=64

[revconfig:layout:root]
c=world
=
c=touchmark

; Same era as the osrs239 lane: the revconfig `[features]` table decides, and
; this world does not diverge from its revision.
[features:boot]

; ---------------------------------------------------------------------------
; The scene benchmark suite
; ---------------------------------------------------------------------------
;
; `[bench]` and `[bench:<scene>]` are LAUNCHER sections. bm_section_of maps an
; unrecognised header to BM_SECTION_NONE, so the C loader walks past all of
; this exactly as it walks past `[derived:*]` -- the client boots from this file
; unchanged, whether or not it was launched by the bench runner.
;
; One scene is one fixed camera over a fixed set of map squares. The runner
; gives each its own client process (offline, --uncapped, TORIRS_MAX_FRAMES) and
; keeps the per-window rows of the perf CSV as its samples. Per-process, because
; the map and camera knobs are read once at world load -- and because a crash in
; one scene then costs that scene rather than the suite.
;
; Scene keys:
;
;   at=<worldx>,<worldz>   The absolute OSRS tile the eye stands over. Derives
;                          both the map square (tile/64) and, unless `eye=`
;                          overrides it, the camera position inside the scene.
;                          Write coordinates the way the wiki does.
;   map=<x>,<z>            A map square to mesh, repeatable. Default: just the
;                          square containing `at`. Name a block of four and the
;                          scene builds 128x128 tiles -- ONE square is 64x64,
;                          under half the 104x104 the live client keeps
;                          resident, so a single-square scene understates every
;                          distance-scaled cost the renderer has.
;   height=<y>             Eye height, negative is up. Default -2000.
;   look=<pitch>,<yaw>     2048 units to the turn. Default 450,0 -- the offline
;                          first-look angle, which is close to straight down.
;                          LOWERING it (280 say) tilts toward the horizon, and
;                          because the painter's draw distance is ~32 tiles that
;                          puts void above the far edge rather than more
;                          scenery: fewer painter commands over a smaller ground
;                          footprint, not a heavier frame. Measured: pitch 450
;                          over the GE gives 6867 commands, pitch 280 gives
;                          4564.
;   eye=<x>,<y>,<z>        Scene-LOCAL units, overriding what `at` derives.
;                          Paste a TORIRS_POS_DEBUG readout straight in.
;   canvas=WxH             Raster size. Overrides the [bench] default.
;   sample_frames=, samples=, warmup=   Per-scene overrides of the same.
;
; Camera MOTION keys. A scene with none of these is a still camera. With them,
; the eye follows a route that is a function of the frame number -- never of
; the clock, so a slow renderer and a fast one traverse it identically and the
; comparison stays a comparison.
;
;   via=<x>,<z>[,<pitch>,<yaw>[,<height>]]
;                          One waypoint, repeatable, in absolute OSRS tiles
;                          like `at`. Two numbers moves the eye and keeps the
;                          scene's `look`; four turn it as well; five change
;                          the height too. 2 to 32 of them.
;   orbit=<radius>,<steps> Instead of `via`: a ring of <steps> waypoints at
;                          <radius> tiles around `at`, each already yawed to
;                          face it. This is the route worth having by default
;                          -- a still camera measures whatever happens to lie
;                          along one bearing, and a renderer change that only
;                          helps that bearing reads as a win. Use
;                          `motion=spline` with it: linear legs cut the corners
;                          off the ring.
;   motion=linear|spline   Straight legs between waypoints, or a Catmull-Rom
;                          curve through them. Default linear.
;   wrap=loop|pingpong|hold
;                          loop joins the last waypoint back to the first,
;                          pingpong walks the route back the way it came, hold
;                          stops at the end. Default loop.
;   motion_frames=<n>      Frames for one traversal. The defaults put exactly
;                          one camera cycle in one sample: sample_frames for a
;                          loop, half of it for a pingpong (whose cycle is
;                          there AND back), and the whole warmup for a hold --
;                          which flies the camera in and then measures the
;                          settled view.
;
; A sample window must hold a WHOLE number of camera cycles, and the runner
; refuses the scene if it does not. Otherwise each window covers a different
; arc of the route -- one the dense north side, the next the empty south --
; and the four samples of a run stop being repeats of one measurement.
;
; Adding a scene: pick the tile, run
; `./launch bench osrs239-bench --scene <name> --shots`, and look at the BMP
; before trusting the number.

[bench]
; Which renderers to run each scene through, in order. `soft3d` is the software
; rasteriser this suite exists for; add `d3d9` when the question is what the GPU
; path would have cost on the same geometry. `soft3d-scanline` is the same
; binary with TORIDRAW_RASTER_SCANLINE=1 — the scanline raster family instead
; of the default kernels — so every scene holds a kernel A/B.
renderers=soft3d,soft3d-scanline
; One SAMPLE is this many consecutive frames, reported as that window's
; percentiles. 300 at ~10 ms/frame is ~3 s of steady state -- long enough that a
; single scheduler hiccup does not own the p95, short enough that four of them
; still show whether the run drifted.
sample_frames=300
samples=4
; Windows thrown away before the first sample. The first one is not the same
; workload: it holds the tail of cache load, the first-touch page faults, and
; every texture and model this scene will ever build. Discarding it is the same
; rule tools/perf/compare.py --drift applies to window 0.
warmup=1
; 765x503 is the fixed-mode client canvas -- the size the perf tables in
; docs/PERF_HARNESS.md were taken at.
canvas=765x503

