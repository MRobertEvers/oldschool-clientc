; ---------------------------------------------------------------------------
; Ground-level sweeps -- the player's camera, not the map's
; ---------------------------------------------------------------------------
;
; Every scene above looks DOWN. `look=450` is 79 degrees off the horizon, and
; the offline first-look angle is that steep because it is a map view: it is
; convenient for checking that a square meshed, and it is not what anybody
; plays. It also loads the rasteriser wrongly for its purpose. From overhead a
; building is its roof -- one large, flat, near-constant-colour quad -- so the
; frame is a small number of very long spans and the walls, which are where the
; texture and gouraud work actually is, are edge-on or hidden. The real client
; clamps pitch to 128..383 and sits nearer 200; at that angle the same building
; is walls, the near ones are large and the far ones overlap, and overdraw
; becomes a real term.
;
; So these four are the same four places at a playable angle, orbited rather
; than held still. `pitch=200` is 35 degrees; `height=-900` is chosen against
; the 10-tile radius so the ring actually points at the middle of the scene
; (1280 units out * tan 35 ~= 900) instead of at the sky or at the ground by
; the camera's feet. Orbit rather than still for the reason grand-exchange-orbit
; already gives -- a still measures whichever wall happens to be near -- and at
; this pitch that bias is far stronger than it is from above, because the near
; wall now fills the frame.
;
; They are ADDED rather than substituted. The overhead stills are what every
; number in docs/PERF_HARNESS.md was taken at, and silently redefining them
; would invalidate that table rather than extend it. Run
; `--scene <name> --shots` and look before trusting a new one.

[bench:grand-exchange-ground]
description=The GE at eye level, circled at 10 tiles. Walls and stalls rather
description=than roofs: the angle the rasteriser is actually asked to draw.
map=49,54
map=50,54
map=49,55
map=50,55
at=3164,3486
look=200,0
height=-900
orbit=10,8
motion=spline
wrap=loop

