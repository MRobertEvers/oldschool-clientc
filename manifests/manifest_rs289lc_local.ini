; Boot manifest: the LostCity rev-289 world, from a LOCAL COPY of its cache.
;
; The world a LostCity_Server checkout on branch 289 is serving right now. Nothing about this
; boot is on this machine: the cache comes off the server over the 2004-era
; on-demand protocol, and the login checksums come from the same server in the
; same breath.
;
;   ./launch run rs289lc
;   ./src/torirs --manifest manifests/manifest_rs289lc.ini --user asdf --pass a
;
; Start the server first (LostCity_Server: `node start.js` -> Start Server, or
; `npm start` in its engine/). Nothing here starts one -- see profiles/rs289lc.ini,
; which declares no services for exactly that reason.
;
; ## Why there is no cache directory
;
; A LostCity server repacks `engine/data/pack` whenever its content changes, and
; recomputes the nine jag checksums from what it packed. A copy of that cache on
; this machine is stale the moment the server rebuilds, and the symptom is not
; "the cache looks old" -- it is login reply 6, "client out of date", which says
; nothing about the cache at all.
;
; This variant accepts that risk deliberately, in exchange for not paying a
; blocking network round trip per dat1 read. Re-copy ../cache.rs289lc from the
; server's engine/data/pack whenever it repacks; reply 6 at login is the sign
; you have not. Use manifest_rs289lc.ini instead to be rid of the question.
;
; What that costs is that every dat1 read is a blocking network round trip
; (src/platform/platform_x_io_ondemand.h explains why it is synchronous). On
; localhost that is invisible. Against a remote server it will stutter.

[cache:boot]
epoch=dat1
game=rs2
; Cache CODEC identity, not the protocol revision — though for this world the
; two agree. The dat1 decoders are pinned by (game, epoch, revision), and 289
; resolves to its own registry row (rev_dat1_lc289.c), format-identical to
; 254's: the 2004-2005 config formats did not move between the builds. What
; the *server* build is goes in `client_version` below, which is a login-block
; field and nothing else.
revision=289
quirks=none
; disk = read cache_dir. ondemand = read the server named in [net:boot].
;
; This variant is the DISK one, which is the whole difference between it and
; manifest_rs289lc.ini next door. Both keys are stated: `source` alone would
; leave the directory unnamed, and `dir` alone would be read by a client that
; still defaulted to streaming, which is the confusing half-configured state
; this file was in before -- it carried a dir= under a comment insisting there
; was no local cache.
source=disk
dir=../cache.rs289lc

[net:boot]
; The 289 opcode tables (src/net/rev/lc289). Payload layouts, the login block
; and the ISAAC keying are 254's; every wire opcode is renumbered.
rev=lc289
transport=tcp
host=localhost
port=43594
; The server's web port: where the nine jag archives (/title, /config, ...) and
; the login checksums (/crc) live. LostCity puts its WebSocket on the same port,
; which is why the key is spelled ws_port. TORIRS_WS_PORT overrides it, and the
; on-demand cache source honours the same override -- a server started on 8888
; needs saying once, not twice.
ws_host=localhost
ws_port=80
; The build the server announces itself as (`engine.revision` in its
; data/config/world.json). It is checked exactly, and a mismatch is reply 6.
; Values above 254 go out as the two-byte escape form; see net/loginproto.c.
; The lc289 table already carries 289; stated here so the two cannot drift
; apart silently when the server is moved to another branch.
client_version=289
; The dev server auto-creates the account. --user / --pass still win.
user=matt7
pass=zuk
; Login-block RSA key (hex), matching the server's data/config/public.pem.
rsa_exp=81f390b2cf8ca7039ee507975951d5a0b15a87bf8b3f99c966834118c50fd94d
rsa_mod=88c38748a58228f7261cdc340b5691d7d0975dee0ecdb717609e6bf971eb3fe723ef9d130e4686813739768ad9472eb46d8bfcc042c1a5fcb05e931f632eea5d
; No jag_crc. An on-demand boot reads /crc from the server it is already
; reading the cache from, so there is no stated value to go stale. State one
; here only to deliberately claim a different server's cache.

[ui:boot]
logic=cs1
chrome=revconfig
; The two halves come from different places on purpose. The LAYOUT is 254's --
; 289 did not move the gameframe -- while the CACHE side needs its own file
; because 289 renamed the four fonts in the title archive (p11 -> p11_full).
; Everything a revconfig names is addressed by section id, so the layout file
; is unaware that the stems moved underneath it.
revconfig_ui=../revconfig/rs245_2lc/rs245_2lc_dat1_ui.ini
revconfig_cache=../revconfig/rs289lc/rs289lc_dat1_cache.ini

; ---------------------------------------------------------------------------
; The plugin window, and the button that opens it.
; ---------------------------------------------------------------------------
;
; `sdl` is a second, real OS window, drawn by the same software rasteriser and
; laid out by the same ToriRSChrome model as the in-canvas panel -- it IS the
; in-canvas panel, in a window of its own.
;
; It is stated here rather than left to default because the default cannot
; serve this world. An unconfigured client draws the panel in canvas, floating
; over a 765x503 frame that has no room for it. A window of its own is the only
; presentation this frame has room for, and the executor is brought up lazily --
; a session that never presses the button never opens a second window.
;
; The BUTTON that opens it is not here: it is a control on the gameframe, so it
; is authored where the rest of the gameframe is -- rs245_2lc_dat1_ui.ini, the
; layout file this world already borrows.
[chrome]
executor=sdl

; Nothing to say. The era, and this frame's camera, are stated by the revision
; profile this world borrows -- `[features]` and `[camera]` in
; revconfig/rs245_2lc/rs245_2lc_dat1_ui.ini, which 254, 289 and 377 all read.
; This block is only for a world that diverges from its revision.
[features:boot]

; ---------------------------------------------------------------------------
; Derived artifacts: none. Both blocks are declared anyway.
; ---------------------------------------------------------------------------
;
; Declaring even one `[derived:*]` block opts this world out of run-live.sh's
; preparation, which is the point. That preparation exists to keep THIS repo's
; server in step with its content -- it bakes a composed cache and compiles the
; ~15k-script server pack -- and none of it is in this world at any freshness:
;
;   * the cache is a copy of the LostCity server's (dir=../cache.rs289lc);
;   * the content and the scripts are that server's too -- it compiles its own
;     RuneScript from its `content/` checkout and never hears about ours.
;
; Without these blocks `./launch run rs289lc` compiled the whole server script
; pack before starting a client that cannot load it.
;
; `pristine=yes` is the existing way to say "shipped, not built", and saying it
; is worth two blocks: an absent declaration reads exactly like a forgotten one,
; and tools/launcher/staleness.py's coverage check cannot tell those apart
; without being told.

[derived:cache]
pristine=yes
note=the LostCity server's own cache, read over the wire — nothing here builds it

[derived:scripts]
pristine=yes
note=the LostCity server compiles and loads its own content; this repo's pack is not in this world
