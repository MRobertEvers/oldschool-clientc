; Boot manifest: OSRS revision 239 with the server embedded in this process.
;
;   ./run-live.sh manifests/manifest_osrs239.ini testc test
;
; At OldSchool revision >= 237 map (lX_Z) archives are stored plain — this cache
; ships no xteas.json. Before the identity gate, every loc square loaded as
; zero locs because the loader treated a missing key as failure.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
; The embedded server reads this same revision-239 cache; no separate socket
; server or cache profile is needed for this manifest.
dir=../../../../cache.osrs239.sparse
; Offline only, like `interface_id` below: the region load this names is the one
; in Task_AppBoot, and that is gated on there being no server. A networked boot
; gets its square from the world's REBUILD_NORMAL instead, which is the only
; source that agrees with where the entities are.
spawn=50,50

[net:boot]
rev=osrs239
transport=none
; Kept for a structural diff with the TCP profile; the embedded transport does
; not bind or dial a port.
host=localhost
port=43595
client_version=239
; RSA public key matching the embedded mock server's private key.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[action:spawn_whisperer]
t=spawn_npc
a=id=12204

[action:loc_editor_toggle]
t=loc_editor_toggle

[debug:hotkeys]
8=spawn_whisperer
9=loc_editor_toggle

[ui:boot]
logic=cs2
chrome=revconfig
; The root interface group -- an OFFLINE-boot answer only.
;
; A boot that has a server does not mount it. The world re-roots the tree at
; login (ToriRSServer_GameframeOpentop -> IF_OPENTOP), naming the group the
; player's own display mode wants, and that re-root clears the tree and bakes
; the new one; anything mounted here is loaded, laid out and then thrown away,
; having meanwhile shown a gameframe to a client that is not in a world yet.
; So main.c passes "no root" when net_enabled, and this key answers only the
; runs where nothing will ever send IF_OPENTOP: `--offline` on this manifest,
; and the offline worlds (manifest_osrs239_bench.ini and friends) that carry no
; `[net:boot] transport=` at all. Keep it -- it is what `--offline` boots into.
interface_id=161

; Cache-side RevConfig for this revision: the sprites the client draws itself,
; the fonts it sets its own text in, and the script/varbit/seq/interface ids it
; drives by number. Shared by every osrs239 lane -- the layout above is what
; differs between them, not the cache's ids.
revconfig_cache=../revconfig/osrs239/osrs239_dat2_cache.ini

; Render at WINDOW POINTS, not device pixels. On a Retina display the drawable
; is twice the window in each axis, and the canvas follows the drawable, so the
; whole client -- world viewport and interface alike -- lays out at 1:1 physical
; pixels and comes out half the size it used to be. Declining the HighDPI
; drawable puts the canvas back on points and lets the existing letterbox
; magnify the finished frame, which is the size this manifest is authored for.
; TORIRS_HIDPI=1 overrides this for a sharper (and smaller) frame.
hidpi=0

; Which presentation the plugin window uses: buffer (in-canvas), sdl (its own OS
; window), web (DOM controls) or gdi (a Win32 tool window).
;
; Omit the key and it is buffer, which is also what a build with no native
; executor gets. A name this build has no executor for falls back to buffer
; with a message; a name that is not an executor at all is a load-time error.
; TORIRS_CHROME_EXECUTOR overrides this file.
[chrome]
executor=buffer
borderless=1

; ---------------------------------------------------------------------------
; The root UI layout, inline
; ---------------------------------------------------------------------------
;
; There is one root-build path, and it is RevConfig. A cache gameframe is not a
; special case of it: `type=rs_iface` with no `componentno=` is a mount point
; for `interface_id` above, and the cache pack is baked as its CHILDREN.
;
; That containment is the whole point. Root sibling order is paint order, and
; the CS2 scripts rearrange the gameframe freely once it is up — reparenting
; panels, creating dynamic children, hiding layers. Because every one of those
; nodes is inside the `rs_iface` subtree, none of it can reorder the sibling
; list declared here. Whatever this file lists after the frame stays after it.
;
; Sections are prefixed `[revconfig:…]` because the two dialects overlap: bare
; `left`, `top`, `right`, `bottom`, `table`, `index`, `filename` and `format`
; are all meaningful RevConfig keys, and boot-manifest sections such as
; `[ui:gameframe]` use some of those spellings for something else. The prefix
; keeps each parser to its own sections. Everything after `revconfig:` is
; ordinary RevConfig, so a block here can be lifted into a standalone
; `revconfig_ui=` file (or the other way round) unchanged.
;
; Load order is `revconfig_ui=`, then `revconfig_cache=`, then these inline
; sections — so inline records append after a shared file's, never restate it.
;
; The `overlay` record below is the developer overlay (docs/debug_overlay.md):
; declared after the frame, so it paints after it. It is switched off until the
; P key, and switched off it draws nothing at all — which is why every lane can
; carry it without moving a pixel.
;
; A manifest that declares no `[revconfig:…]` at all still boots: the builder
; synthesises only the gameframe mount from `interface_id`. The visual overlays
; below exist because this revision explicitly declares them.
[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:component:entity_overlay]
type=entity_overlay

[revconfig:component:cross]
type=cross
w=16
h=16

; ---------------------------------------------------------------------------
; Touch feedback -- the inkwell
; ---------------------------------------------------------------------------
;
; `@mobile` loads only on the touch lane and OVERRIDES the section above it, so
; the desktop keeps its cross and a phone gets the inkwell without either
; needing its own copy of this file. The suffix is stripped before the name is
; stored, which is what makes this an override and not a second component.
;
; The difference that matters is not the artwork. The cross is shown by the
; paths that DID something, so a tap on a widget, a tap that missed, or a tap
; during a modal draws nothing at all. On a touchscreen there is no pointer to
; prove the device saw it, and a tap that draws nothing simply gets repeated.
; The inkwell is shown for EVERY touch.
;
;   style=          splash | blot | ripple
;   walk_color=     yellow | red    (a plain touch, and a walk)
;   interact_color= yellow | red    (the touch resolved to an interaction)
;
; The colours are stated rather than compiled in because "yellow walks, red
; interacts" is this revision's convention, not a law -- a world that wants one
; colour for every touch says so here.
;
; Look at the styles on a desktop without a device:
;   TORIRS_REVCONFIG_PLATFORM=mobile ./src/torirs --manifest <this file>
[revconfig:component:cross@mobile]
type=inkwell
style=splash
walk_color=yellow
interact_color=red

[revconfig:component:hovertext]
type=hovertext
font=496

[revconfig:component:minimenu]
type=minimenu
font=496

[revconfig:layout:root]
c=gameframe
=
c=overlay
=
c=entity_overlay
=
c=cross
=
c=hovertext
=
c=minimenu

; Client-behaviour era, and the per-item overrides on top of it.
;
; `ground_click_nearest` is the "you clicked somewhere you cannot stand" rule
; (enum ToriRS_NearestModel, docs/OSRS_PATHING_LOS.md §2.1.1):
;
;   box10_rect  official OSRS. 21x21 box around the click, ranked by squared
;               distance to the target, ties on the shorter flood. What makes a
;               click across a river walk you to the bank instead of doing
;               nothing. The era default, and what the profile states.
;   ring3       the 2004 client's 3x3 ring, lowest step count wins.
;   none        no fallback at all.
;
; The client only routes for itself under a client-BFS era; at rev 239 the
; *server* answers the click, so set the same model there too —
; `TORIRSSERVER_GROUND_CLICK_NEAREST=ring3 src/build/torirsserver ...`. TORIRS_GROUND_CLICK_NEAREST
; overrides this key.
; Both live in revconfig/osrs239/osrs239_dat2_cache.ini now, under `[features]`
; -- they are facts about the REVISION, and every rev-239 world in this tree
; reads that file. This block is what overrides them for THIS world; it is
; empty because this world does not diverge from its revision.
[features:boot]
;era=osrs
;ground_click_nearest=box10_rect
;
; The rest of the table this manifest does not state, commented out at the
; value the era already gives it — uncommenting one as written changes nothing,
; so each line is an edit point rather than a change. Keep the value alone on
; the line: bm_parse_int rejects trailing text, so `painter_draw_distance=40 ;
; wider` is a parse error, not a value. Full descriptions in
; src/features/features.h.
;
; Painter radius in tiles, 25..90 (deob class112.method3959). The osrs table
; says 32; Client-TS is fixed at 25.
;painter_draw_distance=32
; Permissive extension, off in every era table on purpose: 1 = when the box
; above finds no reachable tile, walk to the flooded tile nearest the click
; anyway instead of doing nothing.
;ground_click_unbounded=0
; Permissive extension: 1 = a click that hit no ground triangle at all (sky,
; the void ringing an instance's floor, a plane the filter refused) resolves to
; the scene tile nearest the cursor instead of walking nowhere.
;ground_click_offmap=0

; ---------------------------------------------------------------------------
; What this world is DERIVED from
; ---------------------------------------------------------------------------
;
; The artifacts a launcher must get right before booting: the cache this
; manifest's `dir=` names, and the script pack its `scripts=` names. Both are
; built from the content tree, and both are INVISIBLE when stale — an edited
; config that never reached the cache looks exactly like one never written.
;
; Stated here rather than known by the launcher, for the same reason
; [content:lanes] is: a launcher that keeps this as a table can only recognise
; worlds it has been taught, and a new one is not launchable until it learns.
;
; `{out}` expands to `out=` resolved against this file's directory. `check=`
; owns the policy and answers with an exit code: 1 means skip, ANYTHING else
; means rebuild — a predicate that cannot answer must never be read as "up to
; date". Blocks run in file order, so a base is stated before what stacks on it.

; The cache is SHIPPED, not built: cache.osrs239 is the pristine rev-239 cache,
; and nothing in this tree bakes it. Stated rather than omitted, because a
; missing block otherwise reads exactly like a forgotten one. A consequence
; worth knowing: this world will NOT show a content edit — boot the osrs239-net
; profile, which points at cache.osrs239.baked, for that.
[derived:cache]
pristine=yes
note=pristine rev-239 cache, shipped rather than baked

; The compiled server script pack. A world naming lanes gets exactly those.
[derived:scripts]
out=../OSRS-Content/osrs239-content/server/scripts/build
check=tools/server_scripts_stale.py --out {out}
target=torirsserver-scripts
