; Boot manifest: an RSProx recording played back as the server.
;
;   ./src/torirs --manifest manifests/manifest_osrs241_replay.ini --replay idx4377.bin.gz
;   ./src/torirs --manifest manifests/manifest_osrs241_replay.ini --replay rec.bin --unlocked
;
; `--replay` (src/platform/net_transport_replay.c) is the server here: it
; answers the login, then plays the recording's server packets at this client
; on the recording's own clock -- or, with --unlocked, as fast as the client
; runs, every gap kept in client cycles. Nothing is dialled, so `[net:boot]`
; names no host; the revision and the throwaway credentials come from
; --replay itself.
;
; The cache is the pristine rev-241 one, read whole from disk: a recording can
; walk anywhere, and there is no JS5 producer in a replay to hydrate a sparse
; cache from. In a browser the same manifest is booted by rsprox-index's
; replay view, which serves the groups over JS5 (js5_server) instead.

[cache:boot]
epoch=dat2
game=oldschool
revision=241
quirks=none
dir=../cache.osrs241
spawn=50,50

[net:boot]
rev=osrs241
client_version=241
; Read by nothing on this lane -- the replay transport never decrypts the
; login block, it reads the seed the client published -- but the login driver
; needs a key to encrypt with.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=161
revconfig_ui=../revconfig/osrs241/osrs241_ui.ini
revconfig_cache=../revconfig/osrs241/osrs241_dat2_cache.ini
hidpi=0

[chrome]

[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:component:entity_overlay]
type=entity_overlay

[revconfig:component:cross]
type=cross
w=16
h=16

[revconfig:component:cross@mobile]
type=inkwell
style=splash
walk_color=yellow
interact_color=red
w=64
h=64

[revconfig:component:hovertext]
type=hovertext
font=496

[revconfig:component:minimenu]
type=minimenu
font=496

[revconfig:layout:root]
c=gameframe
=
c=overlay
=
c=entity_overlay
=
c=cross
=
c=hovertext
=
c=minimenu

[features:boot]

[derived:cache]
pristine=yes
note=pristine rev-241 cache, shipped rather than baked
