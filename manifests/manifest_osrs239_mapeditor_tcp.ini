; Boot manifest: the world map editor against a ToriRSMapEd DAEMON.
;
; ===========================================================================
; Everything manifest_osrs239_mapeditor.ini says applies, with one deployment
; difference: the editing session runs against `torirsmaped` in its own
; process rather than a ToriRSMapEd embedded in this one.
; ===========================================================================
;
; Why you would want it: a daemon can hold SEVERAL client processes at once.
; The world viewer is one, a controller is another, a second viewer a third —
; and the server relays document facts to all of them, so every Client sees
; every edit. That is the deployment the multi-connection design exists for;
; `server=embed` can never have a second process because the server lives
; inside the first one.
;
;   1. Start the daemon (it owns the content tree and its lock):
;
;        make -C src torirsmaped
;        src/build_opt/torirsmaped 43610 \
;            --content-dir OSRS-Content/osrs239-content --repo-root .
;
;   2. Start the viewer. It prints the Client id it was granted:
;
;        src/torirs --manifest manifests/manifest_osrs239_mapeditor_tcp.ini
;        # app: map editor over maped://localhost:43610 (writable, client 1)
;
;   3. Attach a controller to THAT Client, from anywhere:
;
;        make -C src torirsmapedctl
;        src/build_opt/torirsmapedctl --client 1 watch
;
;      It follows the viewer's selection and tool changes, and can drive the
;      session back — undo, redo, save, select — holding no world of its own.
;
; `client=` below is the other half of step 3: state a Client id and THIS
; client joins that session's state relay instead of starting its own. Leave
; it out (as it is) to be granted a fresh Client.
;
; The daemon is the single writer, so its `--repo-root` decides whether the
; session can bake, and its content tree is the one being edited — the
; `content_dir` below only enables the editor and labels the session.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=../cache.osrs239
; Lumbridge. The editor opens here and loads the neighbours around it.
spawn=50,50

; ---------------------------------------------------------------------------
; The editor
; ---------------------------------------------------------------------------
;
; `content_dir` is what turns the editor on — it edits a content tree, so a
; tree is not one of its options, it is the thing it operates on.
;
; `repo_root` additionally allows baking. Baking is never a side effect of
; saving: saving writes the text sources and stops there, and the cache the
; game reads is rebuilt only when the user asks for it. Drop this line for a
; session that should not be able to bake at all.
[editor:boot]
content_dir=../OSRS-Content/osrs239-content
repo_root=..
; The daemon deployment. host/port default to localhost:43610 when absent;
; both are stated here because this file exists to name a server.
server=tcp
host=localhost
port=43610
; Join a Client another connection already started, so this viewer shares its
; selection with that session's controllers. Absent = a fresh Client.
;client=1
; Where the command panel is drawn: `inprocess` or `tab`. This is the one line
; that picks between the three modes at the top of this file — see there for
; what each one needs and why you would want it.
panel=inprocess

; The chrome sizes itself to the DISPLAY, not to this file: the shell reads the
; window's pixel density and picks the ToriRSChrome face baked for it (1x, 2x or
; 3x), so the editor's panels are the same physical size on a Retina screen as
; on an ordinary one -- drawn at native resolution rather than stretched up
; from a smaller buffer. Two env vars override it:
;
;   TORIRS_CHROME_SCALE=2   pin the chrome size (work on 2x chrome from a 1x
;                           display; also what a screenshot test wants)
;   TORIRS_HIDPI=0          give up the HighDPI drawable and render at window
;                           points, for a machine where the software rasteriser
;                           cannot afford four times the pixels
;
; The framebuffer underneath those faces is device pixels by default -- the
; shell takes the HighDPI drawable wherever the display offers one, with no key
; here to say so. Picking a baked 2x face is only half of it: the other half is
; a framebuffer with the pixels to draw it into. TORIRS_HIDPI=0 (or `hidpi=0`)
; gives that up and renders at window points, at which point the window server
; magnifies the finished frame -- chrome, world and all.

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=548
; The canvas TRACKS the window: resizing (fullscreen included) resizes the
; soft3d screen buffer itself, so nothing is stretched -- more window is more
; world. `fixed` instead pins the classic frame and scales it up.
windowmode=resizable
; ~500 POINTS of canvas per chrome step (not pixels -- on a 2x display the
; canvas is twice the points, and stepping off that would count the density
; twice and grow the panels for no reason), so a fullscreen window gets 2x/3x
; panels drawn at native size (the baked scaled faces -- never upscaled
; pixels). Also takes 1..4 to pin a size; TORIRS_CHROME_SCALE overrides either.
chrome_scale=dynamic

; A world viewport has to exist in the tree or the world never loads: the
; offline trigger is gated on `world_view_valid`, which a CONTENT_WORLD (1337)
; node is what sets. TORIRS_WORLD_NODE_DEBUG=1 reports whether one was found.
[revconfig:component:world]
type=world

[revconfig:component:overlay]
type=debug_overlay

; Where projected world primitives land: loc highlight outlines, health bars,
; hitsplats. Without this component the overlay pass has nowhere to draw and
; every highlight silently renders nothing — which looks exactly like a broken
; highlight rather than a missing surface.
[revconfig:component:entity_overlay]
type=entity_overlay

[revconfig:component:cross]
type=cross
w=16
h=16

[revconfig:component:hovertext]
type=hovertext
font=496

[revconfig:component:minimenu]
type=minimenu
font=496

[revconfig:layout:root]
c=world
=
c=overlay
=
c=entity_overlay
=
c=cross
=
c=hovertext
=
c=minimenu

; ---------------------------------------------------------------------------
; Editing controls
; ---------------------------------------------------------------------------
;
; The loc editor panel is the editor's selection UI — it already knows how to
; pick a loc, read its exact scene x/z/angle, nudge and rotate it. `9` opens it.
;
; The free camera is the other half: an editor that can only look where the
; follow camera points cannot inspect what it is editing. WASD/RF flight
; (app_world_camera_keys, app.c) works as soon as these bindings exist, in
; or out of lock; `camera_unlock` additionally frees the arrow-key rotate,
; which otherwise drives the (nonexistent, offline) follow camera.
[action:loc_editor_toggle]
t=loc_editor_toggle

[action:camera_unlock]
t=camera_unlock

[action:map_editor_toggle]
t=map_editor_toggle

[action:camera_forward]
t=camera_forward

[action:camera_back]
t=camera_back

[action:camera_left]
t=camera_left

[action:camera_right]
t=camera_right

[action:camera_up]
t=camera_up

[action:camera_down]
t=camera_down

[debug:hotkeys]
9=loc_editor_toggle
8=map_editor_toggle
u=camera_unlock
w=camera_forward
s=camera_back
a=camera_left
d=camera_right
r=camera_up
f=camera_down

; ---------------------------------------------------------------------------
; Client-behaviour era
; ---------------------------------------------------------------------------
;
; Derived from the cache identity above (dat2 + oldschool -> `osrs`). Stated
; here only as an edit point; uncommenting as written changes nothing.
[features:boot]
;era=osrs
