; RS2012 QBD/Tormented Demons client lane, paired with the embedded ToriRSServer.
;
;   make -C src torirsserver-cache-rs2012 torirsserver-scripts torirsserver-servpack
;   ./run-live.sh manifests/manifest_osrs239_rs2012.ini testc test
;
; This manifest is intentionally separate from the ordinary OSRS239 profiles:
; the imported npc/loc/model ids exist only in the composed cache below. The
; embed handoff in main.c gives ToriRSServer this same resolved cache path, so the
; world and client/JS5 cannot accidentally read different namespaces.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=../cache.osrs239.rs2012

[net:boot]
rev=osrs239
transport=embed
host=localhost
port=43595
client_version=239
scripts=../OSRS-Content/osrs239-content/server/scripts/build_rs2012
user=testc
pass=test
; Enter the release-profile private arena immediately after login.
cheat=rs2012qbdmanifest
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

; The lane is `default=off` in `ported/rs2012_qbd_td/lane.ini`: its objs, npcs
; and encounter scripts exist only here, and a pristine osrs239 build names none
; of them. So this profile has to ask for it -- the composed cache above and the
; script pack must carry the same namespace, or the world spawns npcs the
; scripts have never heard of.
[content:lanes]
lane=rs2012_qbd_td

[action:loc_editor_toggle]
t=loc_editor_toggle

[debug:hotkeys]
9=loc_editor_toggle

[ui:boot]
logic=cs2
chrome=revconfig
; The root interface group -- an OFFLINE-boot answer only.
;
; A boot that has a server does not mount it. The world re-roots the tree at
; login (ToriRSServer_GameframeOpentop -> IF_OPENTOP), naming the group the
; player's own display mode wants, and that re-root clears the tree and bakes
; the new one; anything mounted here is loaded, laid out and then thrown away,
; having meanwhile shown a gameframe to a client that is not in a world yet.
; So main.c passes "no root" when net_enabled, and this key answers only the
; runs where nothing will ever send IF_OPENTOP: `--offline` on this manifest,
; and the offline worlds (manifest_osrs239_bench.ini and friends) that carry no
; `[net:boot] transport=` at all. Keep it -- it is what `--offline` boots into.
interface_id=161

; Cache-side RevConfig for this revision: the sprites the client draws itself,
; the fonts it sets its own text in, and the script/varbit/seq/interface ids it
; drives by number. Shared by every osrs239 lane -- the layout above is what
; differs between them, not the cache's ids.
revconfig_cache=../revconfig/osrs239/osrs239_dat2_cache.ini

[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:component:entity_overlay]
type=entity_overlay

[revconfig:component:cross]
type=cross
w=16
h=16

; ---------------------------------------------------------------------------
; Touch feedback -- the inkwell
; ---------------------------------------------------------------------------
;
; `@mobile` loads only on the touch lane and OVERRIDES the section above it, so
; the desktop keeps its cross and a phone gets the inkwell without either
; needing its own copy of this file. The suffix is stripped before the name is
; stored, which is what makes this an override and not a second component.
;
; The difference that matters is not the artwork. The cross is shown by the
; paths that DID something, so a tap on a widget, a tap that missed, or a tap
; during a modal draws nothing at all. On a touchscreen there is no pointer to
; prove the device saw it, and a tap that draws nothing simply gets repeated.
; The inkwell is shown for EVERY touch.
;
;   style=          splash | blot | ripple
;   walk_color=     yellow | red    (a plain touch, and a walk)
;   interact_color= yellow | red    (the touch resolved to an interaction)
;
; The colours are stated rather than compiled in because "yellow walks, red
; interacts" is this revision's convention, not a law -- a world that wants one
; colour for every touch says so here.
;
; Look at the styles on a desktop without a device:
;   TORIRS_REVCONFIG_PLATFORM=mobile ./src/torirs --manifest <this file>
[revconfig:component:cross@mobile]
type=inkwell
style=splash
walk_color=yellow
interact_color=red
; A box, because a 0x0 node is skipped by the emit walk. The marker draws
; itself centred on the touch, so this is a size and not a position.
w=32
h=32

[revconfig:component:hovertext]
type=hovertext
font=496

[revconfig:component:minimenu]
type=minimenu
font=496

[revconfig:layout:root]
c=gameframe
=
c=overlay
=
c=entity_overlay
=
c=cross
=
c=hovertext
=
c=minimenu

; Both live in revconfig/osrs239/osrs239_dat2_cache.ini now, under `[features]`
; -- they are facts about the REVISION, and every rev-239 world in this tree
; reads that file. This block is what overrides them for THIS world; it is
; empty because this world does not diverge from its revision.
[features:boot]
;era=osrs
;ground_click_nearest=box10_rect
;
; The rest of the table this manifest does not state, commented out at the
; value the era already gives it — uncommenting one as written changes nothing,
; so each line is an edit point rather than a change. Keep the value alone on
; the line: bm_parse_int rejects trailing text, so `painter_draw_distance=40 ;
; wider` is a parse error, not a value. Full descriptions in
; src/features/features.h.
;
; Painter radius in tiles, 25..90 (deob class112.method3959). The osrs table
; says 32; Client-TS is fixed at 25.
;painter_draw_distance=32
; Permissive extension, off in every era table on purpose: 1 = when the box
; above finds no reachable tile, walk to the flooded tile nearest the click
; anyway instead of doing nothing.
;ground_click_unbounded=0
; Permissive extension: 1 = a click that hit no ground triangle at all (sky,
; the void ringing an instance's floor, a plane the filter refused) resolves to
; the scene tile nearest the cursor instead of walking nowhere.
;ground_click_offmap=0

; ---------------------------------------------------------------------------
; What this world is DERIVED from
; ---------------------------------------------------------------------------
;
; The artifacts a launcher must get right before booting: the cache this
; manifest's `dir=` names, and the script pack its `scripts=` names. Both are
; built from the content tree, and both are INVISIBLE when stale — an edited
; config that never reached the cache looks exactly like one never written.
;
; Stated here rather than known by the launcher, for the same reason
; [content:lanes] is: a launcher that keeps this as a table can only recognise
; worlds it has been taught, and a new one is not launchable until it learns.
;
; `{out}` expands to `out=` resolved against this file's directory. `check=`
; owns the policy and answers with an exit code: 1 means skip, ANYTHING else
; means rebuild — a predicate that cannot answer must never be read as "up to
; date". Blocks run in file order, so a base is stated before what stacks on it.

; NO layer-0 bake here, and that is deliberate. This lineage is composed on the
; PRISTINE cache.osrs239 (RS2012_CACHE_BASE), so ordinary content cannot enter
; it at any freshness — there is no bake reachable from here that would carry
; it. Rebasing the chain is a deliberate act, not a launch-time side effect.
[derived:cache]
out=../cache.osrs239.rs2012
check=tools/cache_overlay_stale.py --cache {out} --lane rs2012_qbd_td --base cache.osrs239 --input tools/stage_rs2012_overlay.py --input src/makefile --input 3rd/rscache/tools/cachepack
target=torirsserver-cache-rs2012

; The compiled server script pack. A world naming lanes gets exactly those.
[derived:scripts]
out=../OSRS-Content/osrs239-content/server/scripts/build
check=tools/server_scripts_stale.py --out {out}
target=torirsserver-scripts
