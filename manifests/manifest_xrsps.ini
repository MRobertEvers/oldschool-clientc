; Boot manifest: modern-gen xrsps (OSRS rev 233) over WebSocket, plaintext.
;
; The xrsps server is a Node `ws` WebSocket server speaking a custom
; length-prefixed binary opcode protocol: no RSA, no ISAAC, no JS5. See
; docs/MULTI_GENERATIONAL_PARITY.md.
;
;   ./src/torirs --manifest manifests/manifest_xrsps.ini --user x --pass y
;   ./src/torirs --manifest manifests/manifest_xrsps.ini --offline   (cache-only boot)
;
; Map (lX_Z) archives are still XTEA-encrypted at OldSchool 233 (the gate is
; revision >= 237). The cache ships a keys.json XTEA table for offline map loads.

[cache:boot]
epoch=dat2
game=oldschool
revision=233
quirks=none
; The rev-233 dat2 cache shipped with the xrsps checkout (dat2 + idx0..14 +
; keys.json). Absolute so it works from any cwd; adjust if your xrsps checkout
; lives elsewhere.
dir=/Users/matthewevers/Documents/git_repos/xrsps-typescript/caches/osrs-233_2025-10-01

[net:boot]
rev=xrsps233
transport=ws
host=localhost
port=43594
; Sent in the login(204) packet. Must equal the server's cache revision or the
; server rejects with error code 6.
client_version=233
; No rsa_exp / rsa_mod / jag_crc: xrsps has no RSA / ISAAC / CRC handshake.

[features:boot]
; xrsps paths server-side: the client sends LOC_INTERACT / INTERACT / WALK with
; the target only and never a route, so the era cannot be derived from the
; rev-233 cache (which otherwise implies the OSRS waypoint-packet client).
era=server_routed
;
; The rest of the table this manifest does not state, commented out at the
; value the server_routed era already gives it — uncommenting one as written
; changes nothing, so each line is an edit point rather than a change. Keep the
; value alone on the line: bm_parse_int rejects trailing text, so
; `painter_draw_distance=40 ; wider` is a parse error, not a value. Full
; descriptions in src/features/features.h.
;
; Unreachable ground/minimap click: ring3 (Client-TS's 3x3 ring, lowest step
; count) | box10_rect (the 21x21 search ranked by squared distance to the
; target rect) | none. server_routed runs box10_rect, because xrsps runs the
; same alternative-route search for every request — and it is the *server's*
; copy that decides here, so change both halves together or neither.
;ground_click_nearest=box10_rect
; Painter radius in tiles, 25..90 (deob class112.method3959). The server_routed
; table leaves this unset, which resolves to Client-TS's 25.
;painter_draw_distance=25
; Permissive extension, off in every era table on purpose: 1 = when the box
; above finds no reachable tile, walk to the flooded tile nearest the click
; anyway instead of doing nothing.
;ground_click_unbounded=0
; Permissive extension: 1 = a click that hit no ground triangle at all (sky,
; the void ringing an instance's floor, a plane the filter refused) resolves to
; the scene tile nearest the cursor instead of walking nowhere.
;ground_click_offmap=0

[ui:boot]
logic=cs2
chrome=revconfig
; Fixed-mode root interface group. Used directly for offline boots; a live
; server re-roots the UI via WIDGET_SET_ROOT after login.
interface_id=161

[action:loc_editor_toggle]
t=loc_editor_toggle

[debug:hotkeys]
9=loc_editor_toggle

; Root layout, inline. `type=rs_iface` with no `componentno=` mounts the
; `interface_id` above, and the cache pack is baked as its CHILDREN — so
; whatever this file lists after it stays after it, however the CS2 scripts
; rearrange the frame. That holds across a re-root too: the rebuild runs this
; same layout with the new group. manifests/manifest_osrs239.ini carries the long note.
;
; The `overlay` record is the developer overlay (docs/debug_overlay.md): off
; until the P key, and off it draws nothing at all.
[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:component:entity_overlay]
type=entity_overlay

[revconfig:component:cross]
type=cross
w=16
h=16

[revconfig:component:hovertext]
type=hovertext
font=496

[revconfig:component:minimenu]
type=minimenu
font=496

[revconfig:layout:root]
c=gameframe
=
c=overlay
=
c=entity_overlay
=
c=cross
=
c=hovertext
=
c=minimenu
