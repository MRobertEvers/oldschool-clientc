<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entity viewer — osrs239</title>
<style>
  :root {
    --bg: #0d1016;
    --panel: #141821;
    --panel-2: #1b2130;
    --line: #262d3d;
    --text: #dfe4ee;
    --dim: #8b93a7;
    --accent: #6ea8fe;
    --rig: #7ee081;
    --maybe: #e0c07e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 300px 1fr 340px; height: 100vh;
  }
  .col { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; border-left: 1px solid var(--line); }

  /*
     The left column's chrome: bounded, and scrolling within its bound.

     `max-height` is what stops an open panel from pushing the subject list off
     the bottom — the failure this replaces, where opening the cache registry
     hid the very list it selects into. `flex-shrink` lets it give way first
     when the window is short, and the list below keeps a floor of its own so
     the two cannot squeeze each other to nothing.
  */
  .chrome { flex: 0 1 auto; min-height: 0; max-height: 45%; overflow-y: auto;
            border-bottom: 1px solid var(--line); }
  /* Floors, so the two scrollers cannot squeeze each other to nothing when the
     window is short: the chrome gives way first (flex-shrink above), and the
     list keeps enough rows to be a list. */
  #npcList { min-height: 120px; }
  h2 { margin: 0; padding: 10px 12px; font-size: 11px; letter-spacing: .09em;
       text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); }
  .scroll { overflow-y: auto; flex: 1; min-height: 0; }
  input[type=search] {
    width: calc(100% - 20px); margin: 10px; padding: 7px 9px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); font: inherit;
  }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  .row {
    padding: 6px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.03);
    display: flex; gap: 8px; align-items: baseline;
  }
  .row:hover { background: var(--panel); }
  .row.sel { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }

  /* The cache registry. Collapsed by default: it is a thing you set up once and
     then forget, and it must not push the npc list off the screen. */
  .cachebox { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  /* Two collapsible boxes stacked need a gutter, or their borders read as one
     box with a line through it. */
  .chrome > .cachebox { margin: 6px 8px; }
  .cachebox summary { cursor: pointer; user-select: none; font-size: 12px; }
  .cachebox summary .meta { border: 0; padding: 0 0 0 6px; }
  .cachelist { max-height: 190px; margin: 6px 0; }
  /* Two lines on purpose: name, revision and the drop button on the first, the
     counts on the second. All four on one line at 300px wide wrapped mid-phrase
     and made every row a different height. */
  .cachelist .row { display: flex; align-items: center; flex-wrap: wrap;
                    gap: 2px 6px; padding: 3px 6px; }
  .cachelist .cname { flex: 0 1 auto; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; }
  .cachelist .meta { border: 0; padding: 0; flex-basis: 100%;
                     font-size: 11px; opacity: .7; }
  /* The revision reads as editable because it is a guess, not a fact. */
  .cachelist .crev { font-size: 11px; opacity: .8; border-bottom: 1px dotted currentColor; cursor: text; }
  .cachelist .crev:hover { opacity: 1; }
  .cacheactive { color: var(--accent); }
  .cachelist .x { background: none; border: 0; color: var(--fg); opacity: .35;
                  cursor: pointer; margin-left: auto; }
  .cachelist .x:hover { opacity: 1; }
  /* Wraps rather than crushing the path field to nothing: a cache path is long
     and the column is 300px. */
  .cacheadd { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
  /* The path gets a row of its own — it is the only field here that is ever
     long, and sharing a row with three controls left it 60px wide. */
  .cacheadd input#cachePath { flex: 1 1 100%; min-width: 0; }
  .cacheadd input#cacheRev { flex: 1 1 60px; min-width: 0; }
  /* These were the browser's default white boxes in a dark panel: nothing
     styled a bare text input, because every other one in the page is a
     search or lives in .fx. */
  .cacheadd input[type=text] {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
    color: var(--text); font: inherit; padding: 4px 7px;
  }
  .cacheadd input[type=text]:focus { outline: none; border-color: var(--accent); }
  .row .id { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; min-width: 44px; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .gv { color: var(--dim); font-size: 11px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .row .badge { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center;
           background: var(--panel); min-height: 0; }
  canvas { image-rendering: pixelated; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 10px 12px;
         border-top: 1px solid var(--line); flex-wrap: wrap; }
  button { background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
           border-radius: 6px; padding: 5px 11px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; border-color: var(--line); }
  input[type=range] { flex: 1; min-width: 100px; accent-color: var(--accent); }
  .meta { padding: 8px 12px; color: var(--dim); font-size: 11px;
          border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .tag.rig { background: var(--rig); }
  .tag.maybe { background: var(--maybe); }
  .grouphead { padding: 8px 12px; font-size: 11px; color: var(--dim);
               background: var(--panel); border-bottom: 1px solid var(--line);
               position: sticky; top: 0; display: flex; gap: 8px; align-items: center; }
  .note { padding: 10px 12px; color: var(--dim); font-size: 11px; }
  .corroborated { color: var(--rig); }

  /* Mode switch and the player half's controls. */
  .modes { display: flex; gap: 6px; padding: 10px 12px 0; }
  .modes button { flex: 1; }
  .hdfile { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .hdfile button { flex: 1; }
  .hdfile .meta { flex-basis: 100%; }
  .hdopt { flex-basis: 100%; display: flex; align-items: center; gap: 6px;
           font-size: 12px; color: var(--muted); }
  .hdstats { white-space: pre; font-family: ui-monospace, Menlo, monospace; line-height: 1.45; }
  .modes button.on { border-color: var(--accent); color: var(--accent); }
  .worn { padding: 8px 12px; border-bottom: 1px solid var(--line);
          display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
          padding: 2px 9px; font-size: 11px; cursor: pointer; }
  .chip:hover { border-color: #c46; }
  .chip .x { color: var(--dim); margin-left: 5px; }
  /* A worn chip's hover means "take this off" and is red; a part chip's means
     "draw this one instead", so it borrows the selection colour. */
  #partBar .chip:hover { border-color: var(--accent); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip .sub { color: var(--dim); margin-left: 6px; font-size: 10px; }
  .fx { display: flex; gap: 10px; align-items: center; padding: 8px 12px;
        border-top: 1px solid var(--line); flex-wrap: wrap; font-size: 11px; }
  .fx label { color: var(--dim); }
  .fx input[type=number] { width: 62px; background: var(--panel-2); color: var(--text);
        border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; font: inherit; }
  .fx input[type=text] { width: 210px; background: var(--panel-2); color: var(--text);
        border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; font: inherit; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="col">
    <!--
      The two setup panels, in one bounded scroller.

      Both grow with what is in them — sixteen caches, a fourteen-line routing
      readout — and the column they share is a fixed height. Unbounded, opening
      the cache registry pushed the list it selects INTO off the bottom of the
      window, which is the one thing the left column must never do: the picker
      is the point of the panel and this is what surrounds it.

      Only these two are in here. The mode buttons and the part chips are not,
      because they are used constantly and every scroll position must show them;
      the search box and the count are not, because they are how a 62,000-row
      list is used at all.
    -->
    <div class="chrome">
    <!--
      The cache registry, first because it governs everything below it: the npc
      list, the animations and the models are all this cache's. Collapsed by
      default — the summary names the active cache, so "which cache am I looking
      at" is answered without opening it, and the list of sixteen is only wanted
      when switching.

      The revision is a detected GUESS and stays editable. Detection separates
      the families confidently, but cannot tell osrs184 from osrs239 — and the
      wrong profile does not fail loudly, it decodes at the wrong field widths
      and produces plausible nonsense.
    -->
    <details class="cachebox" id="cacheBox">
      <summary>Cache: <span class="cacheactive" id="cacheActive">—</span></summary>
      <div class="scroll cachelist" id="cacheList"></div>
      <div class="cacheadd">
        <input type="text" id="cachePath" placeholder="path to a cache directory">
        <input type="text" id="cacheRev" placeholder="rev" size="6">
        <button id="cacheAdd">Add</button>
        <button id="cacheScan" title="scan the repo root for cache directories">Scan</button>
      </div>
      <div class="meta" id="cacheInfo"></div>
      <!-- The rig walk over the active cache, which is what the animation
           lists are made of. It runs in the background on every switch, so a
           cache with no prebuilt catalog still lists animations - and while it
           is running the panels are honestly incomplete rather than silently
           empty. -->
      <div class="meta" id="rigStatus"></div>
    </details>

    <!--
      A model file off disk, drawn through the HD path.

      Separate from the npc/player pickers because it is a different question:
      those ask "what does this entity look like", this asks "what does this
      FILE contain, and how does the HD router treat it". The readout is the
      point as much as the image — a mis-routed face still draws.

      Collapsed, because it is the largest block in the column and the rarest
      one wanted: three buttons, three toggles and a fourteen-line readout, all
      for a question nobody asks while browsing a cache. It opens itself when a
      file is loaded, so the readout is never hidden at the moment it matters.
      The render toggles inside apply to every subject, not only to a file.
    -->
    <details class="cachebox" id="hdBox">
      <summary>Model file <span class="meta">· render options</span></summary>
      <div class="hdfile">
      <button id="hdPick">Select model file…</button>
      <button id="hdAnimPick">Select animation…</button>
      <button id="hdClear" disabled>Clear</button>
      <input type="file" id="hdInput" hidden>
      <input type="file" id="hdAnimInput" accept=".eva" hidden>
      <label class="hdopt"><input type="checkbox" id="hdPlaceholder"> placeholder texture</label>
      <!--
        Face priorities off. The painter's sort ranks priority ahead of depth,
        so a model whose priorities are wrong draws faces in front of things
        they sit behind — which looks exactly like a broken depth sort. This
        separates the two, and is how to check whether the HD models' priorities
        mean draw order at all.
      -->
      <label class="hdopt" title="draw as if the model carried no face priorities"><input type="checkbox" id="noPriorities"> ignore priorities</label>
      <!--
        No face sort at all: the depth-tested kernels resolve the model per
        pixel, in whatever order its faces are stored. "ignore priorities" still
        sorts by depth and can still get an interpenetrating model wrong; this
        cannot, because nothing is ranked. A model that still looks wrong here
        is wrong about geometry or depth, not about draw order.
      -->
      <label class="hdopt" title="depth-test per pixel and skip the face sort entirely"><input type="checkbox" id="zbufKernels"> zbuffered kernels</label>
      <div class="meta" id="hdInfo">no file loaded</div>
      <div class="meta hdstats hidden" id="hdStats"></div>
      </div>
    </details>
    </div><!-- .chrome -->

    <h2 id="subjectHead">Subject</h2>
    <div class="modes">
      <button id="modeNpc" class="on">NPC</button>
      <button id="modeObj">Obj</button>
      <button id="modeLoc">Loc</button>
      <button id="modePlayer">Player</button>
    </div>
    <div class="worn hidden" id="wornBar"></div>
    <!--
      Which of the subject's meshes to draw.

      An npc is one config with one model list; an obj and a loc are not. An obj
      record carries the inventory/ground model, the male and female wear models
      and two chatheads, and a loc carries one mesh per SHAPE — a wall, its
      corner, its diagonal — chosen in the game by the map square rather than by
      the record. Only the ones the record actually names appear here, so an
      empty-looking choice is never offered.
    -->
    <div class="worn hidden" id="partBar"></div>



    <input type="search" id="npcSearch" placeholder="name, gameval or id" autocomplete="off">
    <div class="scroll" id="npcList"></div>
    <div class="meta" id="npcCount">loading…</div>
  </div>

  <div class="col">
    <h2 id="stageTitle">Entity viewer</h2>
    <div class="stage"><canvas id="view" width="512" height="512"></canvas></div>
    <div class="bar">
      <button id="playBtn">Pause</button>
      <button id="bindBtn">Bind pose</button>
      <button id="topBtn" title="look straight down">Top-down</button>
      <button id="recenterBtn" title="undo any flying and panning, and re-frame the model (X)">Re-centre</button>
      <input type="range" id="frameSlider" min="0" max="0" value="0">
      <span class="meta" style="border:0;padding:0" id="frameLabel">—</span>
    </div>
    <!--
      The graphic bar. `spotanim_pl`'s own two arguments and nothing else,
      because those are the only two the server can express: the client applies
      a height and a delay to a player-attached graphic and no rotation or
      lateral offset at all.
    -->
    <div class="fx hidden" id="fxBar">
      <label for="fxPick">graphic</label>
      <input type="text" id="fxPick" list="fxList" placeholder="name or id" autocomplete="off">
      <datalist id="fxList"></datalist>
      <label for="fxHeight">height</label><input type="number" id="fxHeight" value="100" step="10">
      <label for="fxDelay">delay</label><input type="number" id="fxDelay" value="16" step="1">
      <!-- Rotation is not a spotanim_pl argument: it is the spotanim RECORD's
           own angle opcode, applied when the model is built. It is here so a
           quarter-turn can be judged before any config is edited. -->
      <label for="fxOrient">turn</label>
      <select id="fxOrient" style="background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px">
        <option value="-1">record</option><option value="0">0°</option>
        <option value="1">90°</option><option value="2">180°</option>
        <option value="3">270°</option>
      </select>
      <button id="fxClear">none</button>
      <span id="fxState" style="color:var(--dim)"></span>
    </div>
    <div class="meta" id="stageMeta">drag or arrows to orbit · wheel to zoom</div>
  </div>

  <div class="col">
    <h2>Animations</h2>
    <input type="search" id="animSearch" placeholder="name, id, or skeletal/classic"
           autocomplete="off">
    <div class="scroll" id="animList">
      <div class="note">Pick an npc.</div>
    </div>
    <div class="meta" id="animCount"></div>
  </div>

  <!-- ?san on the page URL loads the AddressSanitizer/UBSan module built by
       `make wasm-san` instead of the plain one. Same exports and same
       EXPORT_NAME, so ev.js below is unchanged either way; it is a separate
       file only because web/ev_wasm.js is tracked and the instrumented build
       must not be committed over it. Reports land in the devtools console.

       document.write rather than appending a <script>: the tag has to be
       fetched and executed before ev.js, which calls EVModule() at top level,
       and only document.write keeps that ordering guarantee. -->
  <script>
    document.write('<script src="' +
      (/[?&]san\b/.test(location.search) ? 'ev_wasm_san.js' : 'ev_wasm.js') +
      '"><\/script>');
  </script>
  <script src="ev.js"></script>
</body>
</html>
