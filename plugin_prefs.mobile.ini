; torirs plugin settings
;
; A numeric value is an integer expression, as in a revconfig profile:
;   12   0x1F   1Fh   0b1010   #FF8000   1 << 4   (1088 << 16) | 255
;   rgb(255, 128, 0)   rgba(0, 0, 0, 128)   hsl16(hue, sat, lum)
; Colours are read as 0xRRGGBB; hsl16() packs the client's own palette
; index (hue 0..63, saturation 0..7, lightness 0..127).

[plugin:feature-flags]
camera_zoom=Mouse wheel
camera_mmb=On
camera_zoom_band=Unlocked

; The C twin of script/plugins/tile_indicator.lua -- same events, same
; api, same output. The Lua one is the live one (plugins.ini ships it
; enabled); both on at once draws every marker twice. Off here is the
; same choice the desktop plugin_prefs.ini makes, not a plugin nobody
; has thought about.
[plugin:tile-indicator-c]
enabled=0
true_color=#0FF9EF
dest_color=#F9F60F
hover_color=#FEFEFD

[plugin:minimap-orbs]
enabled=1

[plugin:xp-drop-orbs]
enabled=1

[plugin:mobile-gameframe]
enabled=1

[plugin:item-stats]
enabled=1

[plugin:entity-highlighter]
enabled=1
tags=3029,3105,3106,3108

[plugin:loot-beam]
enabled=1
low_value=100
high_value=100000
insane_value=100000
low_color=#65B2FB
medium_color=#99FC9B
high_color=#F9950F
insane_color=#FB65B6

[plugin:ground-items]
enabled=1
hidden_items=Vial, Ashes, Coins, Bucket, Jug, Seaweed
default_color=#FEFEFD
highlighted_color=#AE0EF6
hidden_color=#87807B
low_color=#65B2FB
medium_color=#99FC9B
high_color=#F9950F
insane_color=#FB65B6

; gameframe-layout is off by default and must STAY off on this host:
; it and mobile-gameframe both own the whole frame, and two layout
; owners means the chrome is torn down and rebuilt on a cycle.
[plugin:gameframe-layout]
enabled=0

[plugin:screenshot]
camera=report-button
