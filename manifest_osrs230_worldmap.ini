; Boot manifest: the world map interface (595) on its own, OSRS revision 239.
;
;   ./run-worldmap.sh manifest_osrs230_worldmap.ini    ; headless, dumps, exits
;   src/torirs --manifest manifest_osrs230_worldmap.ini ; windowed, runs until closed
;
; `interface_id=595` makes the world map the tree *root* — no gameframe, no
; sidebar, nothing else in the tree — which is what the implementation work
; wants: every component, bound and draw command in a dump belongs to 595.
; There is no [net:boot] section, so this manifest is offline by construction.
;
; Standalone means no gameframe is open, so IF_GETTOP answers 595 and the
; layout helper (script 900) has no enum for it — the onload takes its unknown-
; gameframe path. To exercise the *mounted* world map instead, boot the real
; gameframe and mount 595 into it.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=595

; Root layout, inline. `type=rs_iface` with no `componentno=` mounts the
; `interface_id` above — here that is the world map itself, not a gameframe,
; which is the point: the root is whatever this file says it is.
; manifest_osrs239.ini carries the long note.
[revconfig:component:worldmap]
type=rs_iface

[revconfig:layout:root]
c=worldmap

; Where the chat lines live.
;
; At this revision the chatbox is not a surface the client paints — it is
; interface 162 (`chatbox`), which ships 500 empty text components inside a
; scrolling layer and expects the client to fill them in. Background, filter
; tabs, Report button, scrollbar and fonts are all already in the cache; the
; client's whole contribution is the text. See src/game/rs_chat_widgets.h.
;
; The children are named in the content tree's interfaces/chatbox.compack:
;   57 input        the typed line, "name: text*"
;   58 scrollarea   the scrolling layer the lines sit in
;   59 line0        ... 558 line499
[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
; No chatbox_input= here on purpose. Child 57 (`chatbox:input`) is written by
; the cache's own clientscript 223 — it composes `<icon><name>: <typed>*`
; from %varcstring335, which the chatbox's onKey handler (script 73) edits.
; Declaring it here makes the client overwrite that every frame with a line
; built from an input buffer this era never fills. See rs_chat_widgets.h.
chatbox_line_height=14
