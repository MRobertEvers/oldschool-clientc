; Boot manifest: RuneScape 643 (the RS2 branch), Lumbridge, world render only.
;
;   src/torirs --manifest manifest_rs643.ini --offline
;
; Spawns at map square 50,50 — Lumbridge — which is the client's default when
; TORIRS_WORLD_MAP is unset. Override to go elsewhere:
;
;   TORIRS_WORLD_MAP=48,48 src/torirs --manifest manifest_rs643.ini --offline
;
; ---------------------------------------------------------------------------
; STATUS: this manifest is correct, but the world does not render yet.
; ---------------------------------------------------------------------------
;
; Models now decode — header byte 4 is a bitmask (face-render-types in bit 0,
; then particles / billboards / a preceding version byte), and a complex texture
; face is 15 bytes rather than 19. Before that fix 1795 of 3000 sampled 643
; models laid out past the end of their own file; all 65,014 now round-trip
; byte-exactly. Derived from rs-map-viewer's ModelData.decodeV1.
;
; Three further gaps stop a 643 world loading, none of them about models:
;
;   1. Several types are their own TOP-LEVEL TABLE in 643, not config groups.
;      Per void's Index.kt: loc -> table 16, enum -> 17, npc -> 18, obj -> 19,
;      sequence -> 20, spotanim -> 21, varbit -> 22. So the archives that looked
;      "missing" from table 2 had simply moved out of it. This also makes TABLE
;      IDS era-dependent, which the library treats as universal — our
;      TABLE_WORLDMAP is 19, but 643's 19 is items. The table enum has to become
;      a per-profile mapping, which is the real reason 643 is not a small job.
;
;      Kinds that stayed in table 2 mostly kept their ids (underlay 1,
;      identkit 3, overlay 4, inv 5, params 11, varc strings 15, varp 16,
;      varc 19); four moved: structs 34->26, hitsplat 32->46, healthbar 33->72,
;      varbit 14->69.
;
;   2. Overlay (flo) decode aborts — RSCache_Dat2ConfigOverlayDecodeInplace hits
;      its assert(false), a hard abort. 643 overlay has nine opcodes OSRS lacks
;      (3 = u16 texture, 9 = scale, 10..14, 16 = water colour/scale/intensity),
;      and underlay opcode 2 is a u16 there where ours reads a byte. Full tables
;      are transcribed in B12 of 3rd/rscache/EXCEPTIONS.md, from void's
;      OverlayDecoder.kt / UnderlayDecoder.kt.
;
;      Sequenced after (1): the flo decode is not reachable until the loc table
;      can be found.
;
;   3. Table 5 (maps) archives fail to decompress because 643 uses LZMA. The
;      container compression byte has a fourth value we do not implement:
;      0=none, 1=bzip2, 2=gzip, 3=LZMA (plus our own 5 = non-OSRS packed).
;      archive.c handles 0/1/2/5 then asserts, which is the failure. Not a 643
;      format difference at all — a missing compressor. Needs an LZMA decoder
;      vendored, the only part of 643 support that is not purely code.
;      Independent of (1) and (2); can be done at any point.
;
; Reference: ~/Documents/git_repos/void — a 643-era server with clean named
; decoders (cache/.../config/decoder/*.kt, Index.kt, Config.kt). Far more usable
; than the two client deobs, whose bodies are JODE output.
;
; ---------------------------------------------------------------------------
; Note on client_version
; ---------------------------------------------------------------------------
;
; Deliberately unset. The 643 revision profile declares
; `version = RSCACHE_REVISION_UNKNOWN` on purpose, because 643 is not on the
; OldSchool revision line and comparing across the two lineages is exactly the
; bug D16 in 3rd/rscache/EXCEPTIONS.md records. So a lookup by revision cannot
; find it: RSCache_ProfileForContainerRevision(DAT2, 643) would miss and fall
; back to the nearest *OSRS* profile, which is worse than no profile at all.
;
; With client_version unset the lookup matches on 0 == RSCACHE_REVISION_UNKNOWN
; and the right profile is selected — container=dat2 epoch=2(643) — but that is
; a coincidence of two zeros, not a mechanism. The proper fix is a cache-side
; `rev=` key resolving through RSCache_ProfileByName("643"), the same vocabulary
; [net:boot] already uses.

[cache:boot]
kind=dat2
; 643 ships its own xteas.json, so encrypted map squares can decrypt from the
; cache once gap (3) above is resolved.
dir=cache.643

[ui:boot]
logic=cs2
chrome=cache
; 643's gameframe root, unverified for this era. The world render does not
; depend on it, and 643's interface era is itself not wired up — see "643 era
; never wired up" in 3rd/rscache/EXCEPTIONS.md.
interface_id=548
