; Boot manifest: OSRS revision 239 wire against the local mock server.
;
;   make -C src mock230 && src/build/mock230 43596 --rev osrs239 &
;   src/torirs --manifest manifest_osrs239_net.ini --user testc --pass test
;
; This is the pair that proves the 239 handshake: the client's login driver
; (src/net/loginproto_osrs239.c) and the server's block reader
; (mock230_session.c step_login) are written from ONE statement of the layout,
; src/net/rev/osrs239/loginblock.h, and this is what checks that they agree.
;
; What it does NOT prove is a world. The client's 239 parse deliberately refuses
; the packets whose layout moved (PLAYER_INFO, NPC_INFO, REBUILD_NORMAL,
; IF_SETEVENTS, IF_SETMODEL, CAM_MOVETO/LOOKAT) rather than decoding them with
; the 230 layout, and the server refuses to send the ones it has not
; transcribed. So a successful run here is a handshake plus a stream that frames
; cleanly, and the screen stays empty. See docs/RSPROT_OSRS239_PORT.md §6.
;
; Port 43596 rather than 43595 so this can run beside a rev-230 server.
[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239.baked

[net:boot]
rev=osrs239
transport=tcp
host=localhost
port=43596
client_version=239
; RSA public key matching the mock server's private key (mock decrypts the
; login block). E=10001; N is the mock's 1024-bit modulus.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[ui:boot]
logic=cs2
chrome=cache
interface_id=161

; Where the chat lines live.
;
; At this revision the chatbox is not a surface the client paints — it is
; interface 162 (`chatbox`), which ships 500 empty text components inside a
; scrolling layer and expects the client to fill them in. Background, filter
; tabs, Report button, scrollbar and fonts are all already in the cache; the
; client's whole contribution is the text. See src/game/rs_chat_widgets.h.
;
; The children are named in the content tree's interfaces/chatbox.compack:
;   57 input        the typed line, "name: text*"
;   58 scrollarea   the scrolling layer the lines sit in
;   59 line0        ... 558 line499
[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
; No chatbox_input= here on purpose. Child 57 (`chatbox:input`) is written by
; the cache's own clientscript 223 — it composes `<icon><name>: <typed>*`
; from %varcstring335, which the chatbox's onKey handler (script 73) edits.
; Declaring it here makes the client overwrite that every frame with a line
; built from an input buffer this era never fills. See rs_chat_widgets.h.
chatbox_line_height=14
