; Ancient Curses asset import — rev558 -> osrs239.
;
; Consumed by:
;   3rd/rscache/tools/cachepack/cachepack import --manifest docs/rs558_ancient_curses/curses_558.ini [--apply]
;
; Paths are relative to THIS FILE, not the repo root.
;
; Two deliberate choices, both of which bite silently if got wrong:
;
;   * the section is NOT named [import:scape2009]. That literal name trips
;     `legacy_scape2009` in cp_import.c, which force-loads the 530->239 texture
;     map and switches model files to a different extension. This is a 558
;     import, not a 530 one.
;
;   * material_mode is stated explicitly. Omitting it selects `mapped_texture`,
;     which is what made the first ported Summoning familiars invisible
;     (docs/summoning_port/TEXTURE_REVIEW.md). Curse gfx are flat-shaded
;     particle art, so face colour is the correct reading.
;
; Id bases sit above every Summoning high-water mark, so the two lanes cannot
; overlap (cp_names.c refuses overlapping ported allocs, but a clash should not
; get that far):
;
;   namespace   summoning hi   curses base
;   spotanim         20078        21000
;   seq              25624        26000
;   animsets         25596        26000
;   framemaps        12596        13000
;   models          124175       130000
;   synth            20007        21000
;   obj              47537        48000

[import:rs558_curses]
from_rev=rs558
from_cache=../../cache.rs558_20091209_ancientcurses
to_rev=osrs239
to_tree=../../OSRS-Content/osrs239-content
lane=ported/rs558_ancient_curses
ledger=port/curses_558.map
prefix=curses
spotanim_base=21000
seq_base=26000
animset_base=26000
framemap_base=13000
model_base=130000
synth_base=21000
obj_base=48000
material_mode=face_colour
npc_sounds=no

