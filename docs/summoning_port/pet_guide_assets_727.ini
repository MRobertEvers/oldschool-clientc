# Rev-727 Summoning skill-guide pet icons.  Most of the early entries are
# purpose-built, optionless display objects (12184..12203); later pets use the
# matching inventory object from the same guide revision.
[import:rs727]
from_rev=rs727
from_cache=../../cache.rs727_preeoc
to_rev=osrs239
to_tree=../../OSRS-Content/osrs239-content
lane=ported/scape2009_summoning
ledger=port/summoning_guide_pets_727.map
prefix=summoning_guide_pet
# Rev-727 material ids are not stable in the OSRS cache.  Preserve textured
# faces as flat-shaded geometry using each source material's authored average
# colour so inventory icons render without cross-revision texture aliases.
material_mode=average_hsl
obj_base=47468
model_base=124063

