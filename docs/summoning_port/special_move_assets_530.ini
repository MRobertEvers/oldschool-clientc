# Steel titan auto-attack visuals, named per the observed roster (2026-08-14):
#
#   1444 / 8191  ranged  attack initialisation, spawned on the titan
#   1445 / 8192  ranged  flying projectile (metallic orb)
#   1448 / 8194  ranged  target impact
#   1446 / 8193  magic   projectile / spawn (beam of light from the ground)
#   1447 / 8193  magic   target impact (red beam with rocks) - 1446 recoloured
#   1449 / 8195  special Steel of Legends cage
#
# 8191 and 8192 share model 31421 and framemap 1781, which splits into two
# disjoint label sets (vertex 0-3 / face 0-2, and 4-8 / 3-7); each sequence
# drives one set and scales the other to zero every frame, and their frame files
# partition anim archive 2056 exactly (8192 takes 7,15,1,13; 8191 the other 13).
# They are a pair, but NOT two interchangeable bolts, and a cache-wide sweep
# confirms these two are the ONLY sequences driving framemap 1781. Measured
# against the rig: 8192 parks its shape on the model origin (y ~ -6) for all
# four frames with no blank frames, i.e. a flight loop; 8191 opens and closes on
# blank frames and plays both of its shapes ~220-235 units up, about titan hand
# height, i.e. a caster-anchored spawn. Fire 8191 as a projectile and it both
# floats above the flight path and strobes.
#
# NOTE this whole set diverges from the local 2009scape class, which is why only
# 1445 was imported originally. SteelTitanNPC.java declares
# `Projectile.create(..., 1445, 60, 36, 41, 46)` for RANGE and MAGIC alike and
# never references 1444/1446/1447/1448 at all, so it is lossy here; it has one
# bolt and no spawn or impact graphics. The cache and in-client observation are
# the authority.
8191=steel_titan_ranged_spawn_seq
8192=steel_titan_ranged_projectile_seq
8193=steel_titan_magic_seq
8194=steel_titan_ranged_impact_seq
8195=steel_titan_steel_of_legends_seq
