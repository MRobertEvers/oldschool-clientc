# Shared familiar special-move visualization from 2009scape Familiar.java.
# Every active familiar uses player sequence 7660 and spotanim 1316 after its
# scroll-specific action succeeds.  Import the shared closure once; individual
# familiars continue to use their already-admitted world models/animations.
[import:scape2009]
from_rev=rs530
from_cache=../../../2009scape/Server/data/cache
to_rev=osrs239
to_tree=../../OSRS-Content/osrs239-content
lane=ported/scape2009_summoning
ledger=port/summoning_special_moves_530.map
prefix=summoning_special_move
model_base=124100
seq_base=25500
animset_base=25500
framemap_base=12500
spotanim_base=20003
# The Summoning lane already owns 40000..47500 (pouches, guide items, and
# roster records). cachepack's ledger-only allocator cannot see a lane's
# existing .alloc IDs on the first new object import, so reserve this range.
obj_base=47501
material_mode=face_colour

