# Steel titan projectile: ONE model (31421) carrying TWO complete graphics on
# one rig, selected by sequence. Framemap 1781 splits into two disjoint label
# sets — vertex labels 0-3 / face labels 0-2 for the first, 4-8 / 3-7 for the
# second — and each sequence drives one set while scaling the other to zero in
# every frame. Their frame files partition anim archive 2056 exactly: 8192
# takes 4 of the 17 (files 7,15,1,13), 8191 takes the other 13.
#
# So the pair is authored to be used as a pair, and the styles are what pick
# between them: 8192/spotanim 1445 is the magic shot (already imported below as
# `steel_titan_projectile`), 8191/spotanim 1444 is the ranged one.
#
# NOTE this is a deliberate divergence from the local 2009scape class, which is
# the reason 8191 was not imported originally. SteelTitanNPC.java declares
# `Projectile.create(..., 1445, 60, 36, 41, 46)` for RANGE and MAGIC alike and
# never references 1444 at all, so the checked-in Java cannot be the authority
# here; it is lossy. The cache data above and in-client observation are, and
# both say two graphics. Verified in-game 2026-08-14 at the user's direction.
8191=steel_titan_ranged_projectile_seq
6261=spirit_scorpion_venom_shot
