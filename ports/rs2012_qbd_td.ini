[import:rs727]
from_rev=rs727
from_cache=../cache.rs727_preeoc
to_rev=osrs239
to_tree=../OSRS-Content/osrs239-content
lane=ported/rs2012_qbd_td
ledger=port/rs2012_qbd_td.map
prefix=rs2012
; The per-client NPC_INFO index is 16 bits, but an initial add type is 14 bits.
; For npc_base=25000, set the add update flag and send same-packet mask 0x1's
; transformed unsigned 16-bit p2Alt3/UShortLEAdd replacement (not a 16-bit add type).
npc_base=25000
obj_base=45000
loc_base=63000
spotanim_base=10000
model_base=110000
seq_base=22000
animset_base=22000
framemap_base=9000
synth_base=16000
sample_base=17000
sample_identity_min=14000
; Rev-727 packed tracks and patches carry archive ids internally. Preserve
; those collision-free ids (OSRS239 ends at song 884, patch 298, sample 581)
; and keep the foreign Vorbis setup beside them rather than replacing native
; index-14 archive 0.
preserve_audio_ids=yes
sample_setup_dest=16000

