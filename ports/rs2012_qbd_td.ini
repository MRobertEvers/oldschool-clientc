; Loc footprints the import states rather than copies, as
; `<source id> = width,length,offsetx,offsety,offsetz`.
;
; A loc's model is placed at `tile * 128 + 64 * size` per axis, so the two tile
; sizes pick where the picture lands as well as which tiles the loc claims.
; Both arena stages below needed one more tile of claimed ground than the
; rev-727 record declares, and each offset is the half-tile that size bump
; costs, paid back so the platform does not slide out from under the fight.
; Verified against their script-placed twins 70837 / 70840, which draw the same
; two models at the same world position from the unshifted anchors:
;
;   70836 at map tile (21,24): 21*128 + 13*64 + 64  = 3584 = 22*128 + 12*64
;   70839 at map tile (33,24): 33*128 + 12*64 + 128 = 5120 = 34*128 + 12*64
;                              24*128 + 19*64 - 64  = 4224 = 24*128 + 18*64
;
; These lived as hand edits in the generated `rs2012.loc` from 2026-08-12 until
; 2026-08-15, and a re-import silently reverted them every time (once on
; 2026-08-15, caught only because the platforms visibly moved). A property a
; regeneration step can revert has to live in the regeneration step.
;
; Each arena half has three states authored in ONE frame — intact (70836/70839),
; intact with the seams lit (70837/70840), and the stairwell hole (70838/70841)
; — and rev-727 gives all six the same 12x18. They are the same picture at three
; moments, so the correction has to reach all six or the completion swap shifts
; the floor a tile as it changes state. Sizes per LARGE_LOCS_PAINTER.md §16's
; measured overhang, which is not uniform across the six: 70838 pokes 95 west
; and 36 north, 70841 64 west and 65 north, so those two need the length as well
; as the width. Overhang is always west/south — the far side of a footprint is
; the side an authored size can always reach.
[footprint:loc]
70836=13,18,64,0,0
70837=13,18,64,0,0
70838=13,19,64,0,-64
70839=12,19,128,0,-64
70840=12,19,128,0,-64
70841=12,19,128,0,-64

