; MOVE_GAMECLICK_RS, MOVE_OPCLICK_RS

[packet]
prot = MOVE_GAMECLICK_RS
dir = in
summary = MOVE_GAMECLICK / MOVE_OPCLICK, LostCity: the start tile, then up to 24 waypoint deltas.
source = LostCity
source_path = the 2004 client's writer (src/net/net_out.c's classic branches), seeded from LostCity_Server
bind = MOVE_GAMECLICK_RS
bind = MOVE_OPCLICK_RS

[struct:MsgMoveClickRs]
field = int32_t key_combination
field = int32_t route_x
field = int32_t route_z
field = int32_t route_dx[24]
field = int32_t route_dz[24]
field = int32_t route_count

[layout]
revs = rs245.2, rs254, rs289
U1 = key_combination
U2_12 = route_x
U2_12 = route_z
code = for (int32_t rs_i = 0; RSPROT_MORE(x, m->route_count, rs_i, 24); rs_i++) {
code =     RSPROT_I1(x, m->route_dx[rs_i]);
code =     RSPROT_I1(x, m->route_dz[rs_i]);
code = }
