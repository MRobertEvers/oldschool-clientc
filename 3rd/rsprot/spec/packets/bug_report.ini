; BUG_REPORT

[packet]
prot = BUG_REPORT
dir = in
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/misc/user/BugReportDecoder.kt

[struct:MsgBugReport]
field = int32_t type
field = const char *description
field = const char *instructions

; v1
[layout]
revs = osrs221
U1 = type
JSTR = description
JSTR = instructions

; v2
[layout]
revs = osrs222-239
JSTR = description
U1_SUB128 = type
JSTR = instructions

; v3
[layout]
revs = osrs240
JSTR = description
JSTR = instructions
U1_SUB128 = type

; v4
[layout]
revs = osrs241
JSTR = instructions
U1_NEG = type
JSTR = description

; android 241.4 (client opcode 42)
[layout]
revs = osrsm241
JSTR = description
U1 = type
JSTR = instructions
