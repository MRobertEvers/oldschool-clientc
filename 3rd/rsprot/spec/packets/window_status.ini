; WINDOW_STATUS

[packet]
prot = WINDOW_STATUS
dir = in
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/misc/client/WindowStatusDecoder.kt

[struct:MsgWindowStatus]
field = int32_t window_mode
field = int32_t frame_width
field = int32_t frame_height

; v1
[layout]
revs = osrs221-241
U1 = window_mode
U2_12 = frame_width
U2_12 = frame_height

; android 241.4 (client opcode 10)
[layout]
revs = osrsm241
U1 = window_mode
U2_12 = frame_width
U2_12 = frame_height
