; UPDATE_INV_FULL

[packet]
prot = UPDATE_INV_FULL
dir = out
summary = A whole container, slot by slot.
doc = The slot ORDER and each field's transform change by revision; the slot
doc = idioms do not: a count clamped to one byte with an escape (255, then the
doc = real count), and an id sent + 1.
doc =
doc = ## The empty slot is not a special layout
doc =
doc = RSProt writes `if (obj == InventoryObject.NULL) { <count 0>; <id 0>; continue }`,
doc = which reads like a second layout and is not one: the general path for
doc = `count = 0, id = -1` emits exactly those bytes (the clamp of 0 is 0, no
doc = escape follows, and the id + 1 offset turns -1 into 0). So each layout has
doc = ONE path.
doc =
doc = The offset direction is the trap: get it backwards and every item in the
doc = container shifts by one, which renders perfectly and is wrong everywhere.
source = RSProt and RSProx
source_path = RSProt's encoder for 221-239, RSProx's decoder for 240-241

[struct:MsgUpdateInvFullSlot]
doc = /** One slot. `id` is -1 for an empty slot; `count_lo` is the derived one-byte
doc =  *  count the wire carries, and is meaningful only next to `count`. */
field = int32_t count_lo
field = int32_t count
field = int32_t id

[struct:MsgUpdateInvFull]
field = int32_t combined_id
field = int32_t inventory_id
field_doc = /** Slot count, ON the wire -- unlike UPDATE_INV_PARTIAL's, which is not. */
field = int32_t capacity
field = MsgUpdateInvFullSlot *slots

[define:MSG_UPDATE_INV_FULL_MAX_SLOTS]
doc = /** Caller-supplied `slots` capacity. The wire's own field is two bytes, so a
doc =  *  malformed packet can ask for up to 65535; the codec fails past this. */
value = 4096

; v1
[layout]
revs = 221
COM_1234 = combined_id
U2_12 = inventory_id
code = RSPROT_COUNT2(x, m->capacity, MSG_UPDATE_INV_FULL_MAX_SLOTS);
code = for (int32_t i = 0; i < m->capacity; i++) {
code =     MsgUpdateInvFullSlot *slot = &m->slots[i];
code =     /* One byte, saturating at 255; at 255 the real count follows. */
code =     RSPROT_CLAMP(x, U1_ADD128, slot->count_lo, slot->count, 255);
code =     if (RSPROT_BRANCH(x, slot->count_lo) == 255)
code =         RSPROT_U4_3412(x, slot->count);
code =     /* The wire carries id + 1: 0 is an empty slot, id -1 here. */
code =     RSPROT_XFORM(x, U2_21_ADD128, slot->id, 1);
code = }

