; UPDATE_INV_FULL_RS

[packet]
prot = UPDATE_INV_FULL_RS
dir = out
summary = UPDATE_INV_FULL, LostCity: the component, the capacity, then every slot (obj + 1, 0 empty).
source = LostCity
source_path = the 2004 client's reader (src/net/rev/gameproto_parse.c), seeded from LostCity_Server

[define:MSG_UPDATE_INV_FULL_RS_MAX_SLOTS]
value = 2048

[struct:Rsprot_MsgUpdateInvFullRs_slotsElem]
field = int32_t id
field = int32_t count
field = int32_t count_lo

[struct:MsgUpdateInvFullRs]
field = int32_t combined_id
field = int32_t capacity
field = Rsprot_MsgUpdateInvFullRs_slotsElem *slots

[layout]
revs = rs245.2, rs254, rs289
U2_12 = combined_id
code = RSPROT_COUNT2(x, m->capacity, MSG_UPDATE_INV_FULL_RS_MAX_SLOTS);
code = for (int32_t rs_i = 0; rs_i < m->capacity; rs_i++) {
code =     Rsprot_MsgUpdateInvFullRs_slotsElem *slot = &m->slots[rs_i];
code =     RSPROT_XFORM(x, U2_12, slot->id, 1);
code =     /* One byte, saturating at 255; at 255 the real count follows. */
code =     RSPROT_CLAMP(x, U1, slot->count_lo, slot->count, 255);
code =     if (RSPROT_BRANCH(x, slot->count_lo) == 255)
code =         RSPROT_U4_1234(x, slot->count);
code = }
