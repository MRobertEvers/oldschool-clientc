; OPNPC3

[packet]
prot = OPNPC3
dir = in
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/npcs/OpNpc3Decoder.kt

[struct:MsgOpNpc3]
