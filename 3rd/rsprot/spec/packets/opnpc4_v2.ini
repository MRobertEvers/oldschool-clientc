; OPNPC4_V2

[packet]
prot = OPNPC4_V2
dir = in
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/npcs/OpNpc4V2Decoder.kt

[struct:MsgOpNpc4V2]
field = int32_t subop
field = int32_t index
field = int32_t control_key

; v1
[layout]
revs = osrs237
U1_NEG = subop
U2_21 = index
U1_NEG = control_key

; v2
[layout]
revs = osrs238
U1_NEG = control_key
U2_21_ADD128 = index
U1_ADD128 = subop

; v3
[layout]
revs = osrs239
U1_ADD128 = subop
U2_12 = index
U1_NEG = control_key

; v4
[layout]
revs = osrs240
U1_SUB128 = control_key
U1 = subop
U2_12_ADD128 = index

; v5
[layout]
revs = osrs241
U1_SUB128 = control_key
U1_SUB128 = subop
U2_21 = index

; osrs242
[layout]
revs = osrs242
U1_SUB128 = control_key
U1_SUB128 = subop
U2_12 = index

; android 241.4 (client opcode 33)
[layout]
revs = osrsm241
U1_ADD128 = subop
U1_SUB128 = control_key
U2_21_ADD128 = index

; android 242.3
[layout]
revs = osrsm242
U2_21 = index
U1_NEG = subop
U1_ADD128 = control_key
