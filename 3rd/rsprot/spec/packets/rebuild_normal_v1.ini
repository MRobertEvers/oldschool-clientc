; REBUILD_NORMAL_V1

[packet]
prot = REBUILD_NORMAL_V1
dir = out
source = RSProx
source_path = protocol/osrs-<N>/src/main/kotlin/net/rsprox/protocol/v<N>/game/outgoing/decoder/codec/map/StaticRebuildV1Decoder.kt
include = ../include/rsprot_tails.h

[struct:MsgRebuildNormalV1]
field = int32_t world_area
note = signed
field = int32_t zone_x
field = int32_t zone_z
field = int32_t xtea_count
field = int32_t keys[169][4]
field_doc = /** The login form's GPI init block (RSPROT_GPI_INIT_BYTES), or length 0. */
field = const uint8_t *gpi_init
field = int32_t gpi_init_length

; v1
[layout]
revs = 237
code = /* RSProx derives, after the reads:
code =  *   (caller) the login variant's player-info init block precedes this
code =  */
code = rsprot_tail_gpi_init(x, &m->gpi_init, &m->gpi_init_length, 8);
U2_21_ADD128 = world_area
U2_21 = zone_x
U2_12_ADD128 = zone_z
code = RSPROT_COUNT2(x, m->xtea_count, 169);
code = for (int32_t i = 0; i < m->xtea_count; i++) {
code =     RSPROT_U4_1234(x, m->keys[i][0]);
code =     RSPROT_U4_1234(x, m->keys[i][1]);
code =     RSPROT_U4_1234(x, m->keys[i][2]);
code =     RSPROT_U4_1234(x, m->keys[i][3]);
code = }
