; CAM_SMOOTHRESET

[packet]
prot = CAM_SMOOTHRESET
dir = out
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/outgoing/codec/camera/CamSmoothResetEncoder.kt

[struct:MsgCamSmoothReset]
field = int32_t camera_move_constant_speed
field = int32_t camera_move_proportional_speed
field = int32_t camera_look_constant_speed
field = int32_t camera_look_proportional_speed

; v1
[layout]
revs = 221-241
U1 = camera_move_constant_speed
U1 = camera_move_proportional_speed
U1 = camera_look_constant_speed
U1 = camera_look_proportional_speed
