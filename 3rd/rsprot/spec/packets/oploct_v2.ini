; OPLOCT_V2

[packet]
prot = OPLOCT_V2
dir = in
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/locs/OpLocTV2Decoder.kt

[struct:MsgOpLocTV2]
field = int32_t selected_obj
field = int32_t x
field = int32_t z
field = int32_t selected_combined_id
field = int32_t id
field = int32_t control_key
field = int32_t selected_sub

; v1
[layout]
revs = osrs242
U2_21 = x
COM_3412 = selected_combined_id
U2_21 = z
U1 = control_key
U2_21_ADD128 = selected_obj
U3_132 = id
U2_12_ADD128 = selected_sub

; android 242.3
[layout]
revs = osrsm242
COM_2143 = selected_combined_id
U2_21 = selected_sub
U2_12_ADD128 = z
U2_21_ADD128 = x
U2_21_ADD128 = selected_obj
U3_213 = id
U1 = control_key
