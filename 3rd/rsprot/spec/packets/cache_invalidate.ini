; CACHE_INVALIDATE -- ToriRS's own prot, in no Jagex revision.
;
; The live reload (docs/MAPED_DESIGN.html #run): the editor rebuilt the client
; cache, the game server tells every logged-in client which archives of one
; cache index changed, and the client forgets them -- its sparse dat2 and its
; IndexedDB copy, the decoded records -- re-primes that index's reference
; table and re-resolves what is on screen. Jagex ships caches at logout and has
; no such packet, so it lives at an opcode no table here uses (237 = 0xED, the
; byte the control link that asks for it is selected by). A client that does
; not know it frames it by its VARU16 length and drops it, and sees the change
; at its next login.

[packet]
prot = CACHE_INVALIDATE
dir = out
summary = forget changed archives of one cache index (the live reload)
source = ToriRS
source_path = docs/MAPED_IMPLEMENTATION.md section 4, docs/MAPED_DESIGN.html #run

[define:CACHE_INVALIDATE_ARCHIVES_MAX]
doc = /** Archives one packet names (the size of MsgCacheInvalidate.archives); the server splits a longer list. */
value = 4096

[struct:MsgCacheInvalidate]
field_doc = /** The cache index (2 configs, 3 interfaces, 5 maps, 12 clientscripts, ...). */
field = int32_t index
field = int32_t archive_count
field_doc = /** Archive ids within `index`, as the server sent them. */
field = int32_t archives[4096]

; v1
[layout]
revs = osrs239-241, osrsm241
U1 = index
code = RSPROT_COUNT2(x, m->archive_count, CACHE_INVALIDATE_ARCHIVES_MAX);
code = for (int32_t i = 0; i < m->archive_count; i++)
code =     RSPROT_U4_1234(x, m->archives[i]);
