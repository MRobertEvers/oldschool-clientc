; SYNTH_SOUND

[packet]
prot = SYNTH_SOUND
dir = out
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/outgoing/codec/sound/SynthSoundEncoder.kt

[struct:MsgSynthSound]
field = int32_t id
field = int32_t loops
field = int32_t delay

; v1
[layout]
revs = osrs221-241
U2_12 = id
U1 = loops
U2_12 = delay

; LostCity
[layout]
revs = rs245.2, rs254, rs289
U2_12 = id
U1 = loops
U2_12 = delay
