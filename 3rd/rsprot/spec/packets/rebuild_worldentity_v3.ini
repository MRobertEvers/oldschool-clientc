; REBUILD_WORLDENTITY_V3

[packet]
prot = REBUILD_WORLDENTITY_V3
dir = out
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/outgoing/codec/map/RebuildWorldEntityV3Encoder.kt
include = ../include/rsprot_tails.h

[struct:MsgRebuildWorldEntityV3]
field = int32_t base_x
field = int32_t base_z
field = int32_t xtea_count
field_doc = /** Level-major, then x, then z; -1 where the grid has no zone. */
field = int32_t zones[RSPROT_REGION_ZONES]
field = int32_t keys[RSPROT_REGION_KEYS_MAX * 4]
field_doc = /** In: the rebuilt world entity's size in zones (WORLDENTITY_INFO), which
field_doc =  *  the grid's length depends on. 0 when unknown: the grid is then carried
field_doc =  *  unread in grid_raw. */
field = int32_t size_x_zones
field = int32_t size_z_zones
field = const uint8_t *grid_raw
field = int32_t grid_raw_length

; v1
[layout]
revs = osrs229-236
U2_12 = base_x
U2_12 = base_z
code = RSPROT_COUNT2(x, m->xtea_count, RSPROT_REGION_KEYS_MAX);
code = if (m->size_x_zones > 0 && m->size_z_zones > 0 &&
code =     rsprot_within(x, 4 * m->size_x_zones * m->size_z_zones, RSPROT_REGION_ZONES + 1)) {
code =     rsprot_tail_zone_grid(x, m->zones, 4 * m->size_x_zones * m->size_z_zones);
code =     rsprot_tail_xtea_keys(x, m->keys, m->xtea_count);
code = } else {
code =     RSPROT_REST(x, m->grid_raw, m->grid_raw_length);
code = }

; v2
[layout]
revs = osrs237
U2_12 = base_x
U2_12 = base_z
code = RSPROT_COUNT2(x, m->xtea_count, RSPROT_REGION_KEYS_MAX);
code = if (m->size_x_zones > 0 && m->size_z_zones > 0 &&
code =     rsprot_within(x, 4 * m->size_x_zones * m->size_z_zones, RSPROT_REGION_ZONES + 1)) {
code =     rsprot_tail_zone_grid(x, m->zones, 4 * m->size_x_zones * m->size_z_zones);
code =     rsprot_tail_xtea_keys(x, m->keys, m->xtea_count);
code = } else {
code =     RSPROT_REST(x, m->grid_raw, m->grid_raw_length);
code = }
