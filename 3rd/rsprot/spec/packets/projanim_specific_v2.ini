; PROJANIM_SPECIFIC_V2

[packet]
prot = PROJANIM_SPECIFIC_V2
dir = out
source = RSProx
source_path = protocol/osrs-<N>/src/main/kotlin/net/rsprox/protocol/v<N>/game/outgoing/decoder/codec/specific/ProjAnimSpecificV2Decoder.kt

[struct:MsgProjanimSpecificV2]
field = int32_t angle
field = int32_t target_index
note = signed
field = int32_t delta_z
note = signed
field = int32_t end_time
field = int32_t end_height
field = int32_t delta_x
note = signed
field = int32_t start_height
field = int32_t id
field = int32_t progress
field = int32_t start_time
field = int32_t coord_in_build_area
note = RSProx: CoordInBuildArea(<g3>)

; v1
[layout]
revs = osrs223
U1 = angle
U3_132 = target_index
U1_ADD128 = delta_z
U2_21 = end_time
U1_NEG = end_height
U1_SUB128 = delta_x
U1_SUB128 = start_height
U2_21 = id
U2_21_ADD128 = progress
U2_12_ADD128 = start_time
U3_123 = coord_in_build_area

; v2
[layout]
revs = osrs224
U1_NEG = start_height
I1 = delta_x
U2_21 = progress
U1_ADD128 = angle
U1_SUB128 = end_height
U2_12_ADD128 = end_time
U2_12 = id
U3_123 = target_index
U3_321 = coord_in_build_area
U1_SUB128 = delta_z
U2_12_ADD128 = start_time
