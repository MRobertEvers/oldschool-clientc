; EVENT_MOUSE_CLICK

[packet]
prot = EVENT_MOUSE_CLICK
dir = in
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/events/EventMouseClickDecoder.kt

[struct:MsgEventMouseClick]
field = int32_t packed
field = int32_t x
field = int32_t y
field = int32_t last_transmitted_mouse_click
field = int32_t right_click

; v1
[layout]
revs = 221-231
U2_12 = packed
code = int32_t right_click = (m->packed & (0x1 != 0));
code = int32_t last_transmitted_mouse_click = ((int32_t)((uint32_t)(m->packed) >> (1)));
U2_12 = x
U2_12 = y
code = m->last_transmitted_mouse_click = last_transmitted_mouse_click;
code = m->right_click = right_click;
