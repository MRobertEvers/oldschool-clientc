source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/locs/OpLoc4V3Decoder.kt

[struct:MsgOpLoc4V3]
