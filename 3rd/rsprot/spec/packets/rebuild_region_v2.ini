; REBUILD_REGION_V2

[packet]
prot = REBUILD_REGION_V2
dir = out
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/outgoing/codec/map/RebuildRegionV2Encoder.kt
include = ../include/rsprot_tails.h

[struct:MsgRebuildRegionV2]
field = int32_t reload
field = int32_t zone_x
field = int32_t zone_z
field_doc = /** Distinct source mapsquares: a loading hint, no keys follow. */
field = int32_t distinct_mapsquare_count
field_doc = /** Level-major, then x, then z; -1 where the grid has no zone. */
field = int32_t zones[RSPROT_REGION_ZONES]

; v1
[layout]
revs = 237
U1_ALT1 = reload
U2 = zone_x
U2_ALT3 = zone_z
U2 = distinct_mapsquare_count
code = rsprot_tail_zone_grid(x, m->zones, RSPROT_REGION_ZONES);

; v2
[layout]
revs = 238
BOOL = reload
U2 = zone_x
U2_ALT2 = zone_z
U2 = distinct_mapsquare_count
code = rsprot_tail_zone_grid(x, m->zones, RSPROT_REGION_ZONES);

; v3
[layout]
revs = 239
U2 = zone_z
U2 = zone_x
U1_ALT1 = reload
U2 = distinct_mapsquare_count
code = rsprot_tail_zone_grid(x, m->zones, RSPROT_REGION_ZONES);

; v4
[layout]
revs = 240
U2_ALT2 = zone_z
U2_ALT1 = zone_x
U1_ALT1 = reload
U2 = distinct_mapsquare_count
code = rsprot_tail_zone_grid(x, m->zones, RSPROT_REGION_ZONES);

; v5
[layout]
revs = 241
U2 = zone_x
U1_ALT2 = reload
U2_ALT1 = zone_z
U2 = distinct_mapsquare_count
code = rsprot_tail_zone_grid(x, m->zones, RSPROT_REGION_ZONES);
