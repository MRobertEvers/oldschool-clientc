; MESSAGE_GAME

[packet]
prot = MESSAGE_GAME
dir = out
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/outgoing/codec/misc/player/MessageGameEncoder.kt

[struct:MsgMessageGame]
field = int32_t type
field = int32_t name_present
field = const char *name
field = const char *message

; v1
[layout]
revs = osrs221-241
SMART = type
U1 = name_present
code = if (RSPROT_BRANCH(x, m->name_present)) {
code =     RSPROT_JSTR(x, m->name);
code = }
JSTR = message
