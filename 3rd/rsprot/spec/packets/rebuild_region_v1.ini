; REBUILD_REGION_V1

[packet]
prot = REBUILD_REGION_V1
dir = out
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/outgoing/codec/map/RebuildRegionV1Encoder.kt
include = ../include/rsprot_tails.h

[struct:MsgRebuildRegionV1]
field = int32_t zone_z
field = int32_t zone_x
field = int32_t reload
field = int32_t xtea_count
field_doc = /** Level-major, then x, then z; -1 where the grid has no zone. */
field = int32_t zones[RSPROT_REGION_ZONES]
field = int32_t keys[RSPROT_REGION_KEYS_MAX * 4]

; v1
[layout]
revs = 237
U2_21 = zone_z
U2_21_ADD128 = zone_x
BOOL = reload
code = RSPROT_COUNT2(x, m->xtea_count, RSPROT_REGION_KEYS_MAX);
code = rsprot_tail_zone_grid(x, m->zones, RSPROT_REGION_ZONES);
code = rsprot_tail_xtea_keys(x, m->keys, m->xtea_count);
