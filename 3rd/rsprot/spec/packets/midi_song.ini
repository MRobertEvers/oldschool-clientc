; MIDI_SONG

[packet]
prot = MIDI_SONG
dir = out
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/outgoing/codec/sound/MidiSongEncoder.kt

[struct:MsgMidiSong]
field = int32_t fade_out_delay
field = int32_t fade_out_speed
field = int32_t id
field = int32_t fade_in_delay
field = int32_t fade_in_speed

; v1
[layout]
revs = 221
U2_ALT1 = fade_out_delay
U2_ALT3 = fade_out_speed
U2_ALT2 = id
U2_ALT1 = fade_in_delay
U2_ALT1 = fade_in_speed

; v2
[layout]
revs = 222
U2_ALT2 = fade_out_delay
U2 = fade_out_speed
U2 = fade_in_speed
U2_ALT1 = id
U2_ALT3 = fade_in_delay

; v3
[layout]
revs = 223
U2_ALT1 = id
U2 = fade_in_delay
U2_ALT1 = fade_out_delay
U2_ALT3 = fade_out_speed
U2_ALT3 = fade_in_speed

; v4
[layout]
revs = 224
U2_ALT2 = fade_out_delay
U2 = fade_out_speed
U2_ALT1 = fade_in_speed
U2_ALT2 = fade_in_delay
U2_ALT1 = id

; v5
[layout]
revs = 225
U2_ALT2 = fade_out_delay
U2_ALT3 = fade_out_speed
U2_ALT1 = fade_in_delay
U2_ALT3 = id
U2_ALT2 = fade_in_speed
