prot = OPLOC3_V3
dir = in
source = RSProt
source_path = protocol/osrs-<N>/osrs-<N>-desktop/src/main/kotlin/net/rsprot/protocol/game/incoming/codec/locs/OpLoc3V3Decoder.kt

[struct:MsgOpLoc3V3]
field = int32_t z
field = int32_t subop
field = int32_t id
field = int32_t control_key
field = int32_t x

