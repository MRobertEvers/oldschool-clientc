; Revision rs289: LostCity's 289 protocol (the 2004 client's), opcodes and sizes.
;
; Seeded from the client's hand-written table (src/net/rev/lc289/packetin.h,
; packetout.h), which is the authoritative LostCity_Server build's. A row whose
; message differs from the OSRS prot of the same name names its own version
; (<PROT>_RS). LostCity tags an enclosed zone sub-packet by its top-level
; opcode, not by an ordinal: zone_index = opcode.
; Client prots the client never writes (the anticheat and mouse/camera event
; packets): the client's table states no size for them. 254's rows take the
; 254 server's (Engine-TS ClientGameProt.ts); no source states 245.2's or
; 289's, so those tables have no row for them.

[table]
source = src/net/rev/lc289/packetin.h + packetout.h (LostCity_Server)
zone_index = opcode

