; Scythe of Vitur (OSRS obj 22325) -> LostCity rev 254.
;
; Run from the 3draster root:
;   ./3rd/rscache/tools/port_lostcity/port_lostcity \
;     --manifest 3rd/rscache/tools/port_lostcity/scythe_of_vitur.ini --apply
;
; Method is docs/BOSS_ASSETS.md "How to find this sort of thing yourself" for
; the assets and RIGGING_OSRS_RS2.md for the retarget. Both animations below
; were found by NAME, not guessed:
;
;   find_named --rev osrs230 cache.osrs230 --name scythe --type seq
;
; osrs239 itself carries no seq debug names (`--name ... --type seq` returns
; nothing there), which is why the *names* come from cache.osrs230 while the
; export reads osrs239. That is only safe because the ids were then verified
; identical in osrs239 rather than assumed: `find_named --rev osrs239
; cache.osrs239 --seq 8056/8057` returns byte-identical frame lists and
; durations to osrs230's. Never copy an id between caches without that check.

[port:lostcity]
rev = osrs239
cache = ../../../../cache.osrs239
content = ../../../../../LostCity_Server/content
; Scope the rig map to the player rig. Both sequences here are player
; animations on framemap 0, so this is the only framemap that must be
; renumbered — and scoping matters even so, because an export carries other
; framemaps and running a player correspondence over one of those renumbers
; its joints into player joints its model does not have.
rig_framemaps = 0
rig_inert = 254
area = skill_combat
prefix = vitur

[export:obj]
; Wield models 35371 (male) / 32906 (female), inventory model 35742 — all
; three come off the one obj id.
22325 = scythe_of_vitur

[export:seq]
; The item's own two animations, ported rather than substituted. An earlier
; version of this manifest reused rev-254's 2004 scythe anims
; (human_scythe_sweep and friends) as stand-ins; they are the wrong weapon's
; motion and are no longer referenced.
;
; 22 frames, 77 client cycles = 2.57 server ticks. `stretches` is true and
; forced_priority is 6 in the source record; both travel with the seq.
8056 = scythe_of_vitur_attack
; The idle/stand. 12 frames at 20 cycles each = 240 cycles (8.00 server
; ticks), reply_mode 0 — a loop, which is what an idle has to be. This is the
; animation whose absence left the character standing in the one-handed
; default while holding a two-handed weapon.
8057 = scythe_of_vitur_ready
; The animation that rigs the four tile graphics below. Pulled in by the
; spotanims, listed explicitly for the same reason dragon_claws.ini lists
; 7513: an asset nothing in the manifest names outright is easy to lose in a
; later edit. It is on its OWN framemap, not the player's, so `rig_framemaps
; = 0` above is what keeps [export:rig_map] off it — retargeting a spotanim's
; self-consistent rig into player joints its 24-vertex model does not have is
; the documented way to make a graphic fly apart (RIGGING_OSRS_RS2.md).
1204 = sp_d_halberd_glow

[export:spotanim]
; The sweep drawn on the target's tile. It is FOUR assets, one per compass
; direction, which is the whole reason it "varies" — the client is not
; choosing at random, the swing direction picks the graphic. `player_melee.rs2`
; selects between them off the same dx/dz the cleave already computes.
;
; Kept under their source names rather than renamed to something scythe-ish.
; They genuinely are the dragon halberd special's graphics, reused by this
; weapon in the source game; renaming would hide that and would collide the
; day someone ports the halberd and re-exports the same four models.
506  = dragon_halberd_special_north_red
478  = dragon_halberd_special_south_red
1172 = dragon_halberd_special_east_red
1231 = dragon_halberd_special_west_red

[export:label_map]
; The wield model carries exactly one vertex label, uniformly 50 (measured
; with `find_named --model <id>`; the `vertex labels` line is this session's
; addition to that tool). 50 is OSRS's equipment-grip label, not a body joint,
; so RIGGING_OSRS_RS2.md's identikit correspondence table does not cover it —
; that table comes from the bare body, which has no vertices there.
;
; It maps to rev 254's **66**, that era's own held-weapon joint, and the
; evidence is structural rather than by analogy. In OSRS framemap 0, label 50
; has its own dedicated pivot (`[87] origin labels: 50`) and rides the same
; wrist/forearm transforms — `[47]`, `[48]`, `[34]`, `[35]` — that in rev
; 254's `anim_80.anim` drive 66 and only 66. Two rigs, same role, same place
; in the transform list.
;
; This must agree with `50 = 66` in [export:rig_map] below, and the pair is
; what makes both eras' animations work on one model: the ported OSRS
; sequences move the weapon because their label-50 transforms are renumbered
; to 66, and rev 254's own native walk/run/idle move it because they already
; drive 66.
;
; Two rejected alternatives, both of which half-work and are worth recording:
;   - 17 (the left hand, which is what dragon_claws.ini uses for this same
;     source label). The weapon follows the hand, but the source animation's
;     own weapon motion — everything transform [87] exists to pivot — is
;     thrown away, and rev 254's native sword anims stop addressing it
;     directly.
;   - 66 in [export:label_map] but NOT in [export:rig_map] (the state this
;     port was in before the animations were ported). Native anims move it;
;     the ported ones do not touch it at all, so the weapon hangs motionless
;     in mid-air through its own attack.
50 = 66

[extra:scythe_of_vitur]
; Combat bonuses are cache.osrs239's own (`find_named --obj 22325`), hand
; authored because that revision's param ids are not rev 254's.
;
; The three attack slots all take the one ported animation: the source cache
; has a single attack animation for this weapon, and `weapon_scythe`'s style
; table rolls stab/slash/crush off the same swing.
category = weapon_scythe
param = stabattack,70
param = slashattack,125
param = crushattack,30
param = stabdefence,-2
param = slashdefence,8
param = crushdefence,10
param = magicattack,-6
param = strengthbonus,75
param = attackrate,5
param = ready_baseanim,scythe_of_vitur_ready
param = stabattack_anim,scythe_of_vitur_attack
param = slashattack_anim,scythe_of_vitur_attack
param = crushattack_anim,scythe_of_vitur_attack
; Native, not ported: the source cache has no defend animation for this item
; (only _attack and _ready exist under its name). human_scythe_block is rev
; 254's own scythe block and is the closest real match. NOT human_scythe_spin
; — that is the defensive attack *style's* swing, which combat.rs2's existing
; `weapon_scythe` case already plays on its own; using it here put an attack
; where a hit-reaction belongs.
param = defend_anim,human_scythe_block
param = stab_sound,scythe_stab
param = slash_sound,scythe_slash
param = crush_sound,scythe_double

; ---- rig retarget --------------------------------------------------------
; Verbatim the correspondence measured in RIGGING_OSRS_RS2.md and first used by
; dragon_claws.ini — same source rig (OSRS framemap 0) and same destination
; (rev 254's 71-transform player rig), so it is the same map, not a new
; derivation. 245 transforms addressing labels to 217 against 71 addressing
; labels to 72: without this the ported animation bends the wrong parts and
; pivots on nothing. Labels with no counterpart are parked on 254, which no
; rev-254 model uses; leaving them alone would be worse than dropping them,
; because OSRS label 50 is not rev-254 joint 50.
;
; `27 = 17` is the entry that carries the weapon: the wield model's own
; vertices are retagged to 17 by [export:label_map] above, and OSRS's left
; hand (27) is what drives rev-254's 17, so the weapon follows the hand
; through both the ported animation and rev 254's own native walk/idle.
