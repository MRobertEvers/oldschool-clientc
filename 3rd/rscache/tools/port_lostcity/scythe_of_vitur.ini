; Scythe of Vitur (OSRS obj 22325) -> LostCity rev 254.
;
; Run from the 3draster root:
;   ./3rd/rscache/tools/port_lostcity/port_lostcity \
;     --manifest 3rd/rscache/tools/port_lostcity/scythe_of_vitur.ini --apply
;
; No seq/spotanim export, unlike dragon_claws: the source cache carries no
; per-item attack anim params for this obj at all (`configs/all.obj`'s
; [scythe_of_vitur] block has no slashattack_anim/stabattack_anim/defend_anim
; rows), so the live client resolves its swing off the weapon's *category*
; interface rather than a per-item animation. rev 254 already has that same
; shape for this category — `weapon_scythe`/`weapon_scythe_table` and the
; defensive-spin special case in skill_combat/scripts/combat.rs2 predate this
; item by fifteen years but are exactly "if it's content there, it's content
; here": the extras below wire this item into that existing table rather than
; inventing a new one.
;
; The combat bonuses, category and swing/defend anims are NOT exported for the
; same reason dragon_claws.ini gives: an OSRS item's bonuses live in a params
; table keyed by ids this revision does not share. They are hand-authored in
; the [extra:scythe_of_vitur] block below; see the companion README.

[port:lostcity]
rev = osrs239
cache = ../../../../cache.osrs239
content = ../../../../../LostCity_Server/content
; Only the player rig — this is a rigid one-piece wield model with a single
; vertex label (50) over every vertex, not an animated multi-part model like
; the claws, so there is no per-frame framemap to scope here. Declared anyway
; for the same reason dragon_claws.ini declares it: it is what tells
; port_lostcity the [export:label_map] below is a *player-rig* retag and not
; something to apply to an unrelated framemap.
rig_framemaps = 0
rig_inert = 254
area = skill_combat
prefix = vitur

[export:obj]
; Wield models 35371 (male) / 32906 (female), inventory model 35742 — all three
; come off this one obj id; cachepack's own obj record is what supplies them.
22325 = scythe_of_vitur

[export:label_map]
; The wield model (both genders) is 390 vertices, one label, uniformly 50 —
; measured with `find_named --model 35371` (this tree's own extension to
; find_named; see its `vertex labels` line). 50 is not in
; RIGGING_OSRS_RS2.md's identikit correspondence table at all, and that table
; turns out not to apply here regardless: it is derived from the *bare body*
; identikit models, and a wield model's grip label lives in a completely
; separate, equipment-only part of the same framemap-0 label space that the
; identikit carries no vertices for.
;
; Settled by checking what a real, shipping rev-254 item actually uses rather
; than guessing from that table. This item is two-handed
; (wearpos=righthand+lefthand, same as a spear/halberd), and rev 254's own
; `spear` — `manwear=model_540_obj_wear` in
; skill_combat/configs/melee/spears.obj, the closest native analogue by grip
; shape — is 100% label 17. `find_named --dat1-anim models/anim_80.anim`
; confirms 17 is live: transforms [33]/[34]/[35] pivot a weapon-carrying
; rotation on it, and it also appears in the big shoulder sweep at [29]/[30].
; No live LostCity client was available this session to confirm visually in
; motion — see the README's verification section for exactly what was and was
; not checked.
50 = 17

[extra:scythe_of_vitur]
; Everything below is hand-authored: cache.osrs239's param ids are not shared
; with rev 254 (CONTENT_ARCHITECTURE.md-equivalent reasoning as dragon_claws).
; Values are cache.osrs239's own (`find_named --obj 22325`, `configs/all.obj`
; in the 3draster osrs239-content tree) except the anims, which the cache does
; not state for this item (see the header) and which reuse the category's
; own existing rev-254 anims instead of porting new ones.
category = weapon_scythe
param = stabattack,70
param = slashattack,125
param = crushattack,30
param = stabdefence,-2
param = slashdefence,8
param = crushdefence,10
param = magicattack,-6
param = strengthbonus,75
param = attackrate,5
param = stabattack_anim,human_scythe_sweep
param = slashattack_anim,human_scythe_sweep
param = crushattack_anim,human_scythe_sweep
param = defend_anim,human_scythe_spin
param = stab_sound,staff_stab
param = slash_sound,staff_hit
param = crush_sound,staff_hit
