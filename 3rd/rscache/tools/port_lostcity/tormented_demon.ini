; Tormented Demons (OSRS, Desert Treasure II) -> LostCity rev 254.
;
; The whole set is authored under the `luc2_undead_demon_` prefix in the source
; cache, which is what made it findable at all: nothing outside the npc record
; names these assets, so they were reached by scanning sequence and spotanim
; debug names rather than by walking ids.
;
;   find_named --rev osrs230 cache.osrs230 --name undead_demon
;
; Run from the 3draster root:
;   ./3rd/rscache/tools/port_lostcity/port_lostcity \
;     --manifest 3rd/rscache/tools/port_lostcity/tormented_demon.ini --apply

[port:lostcity]
rev = osrs230
cache = ../../../../cache.osrs230
content = ../../../../../LostCity_Server/content
area = areas/area_tormented_demons
prefix = td

[export:npc]
; Two body models alternate across the eight source ids: 53287 and 53285. They
; are the shielded and unshielded forms — the fire shield is geometry on the
; model, not an overlay, so dropping it is an npc_changetype rather than a
; spotanim. 13603-13606 are the 2008 RS2 demons on the old model 6318 and are
; not ported.
13599 = td_demon
13600 = td_demon_unshielded

[export:seq]
; Body animations. All nine share framemap 2278.
11391 = td_ready
11390 = td_walk
11392 = td_melee
11389 = td_spare_ribs
11388 = td_firey_balls
11387 = td_explosion_fire
11393 = td_defend
11394 = td_death
11395 = td_summon

; Effect animations. These rig the spotanim models, not the demon, so they sit
; on their own framemaps and are pulled in by the spotanims below — named here
; so they land with readable names instead of generated ones.
11398 = td_swipe_spot
11399 = td_shield_spot
11400 = td_explosion_fire_spot
11401 = td_shield_restore_spot
11402 = td_summon_spot
11403 = td_death_spot
11405 = td_fireball_large_proj_seq

[export:spotanim]
; Projectiles and impacts.
2853 = td_fireball_proj
2854 = td_fireball_impact
2855 = td_fireball_large_proj
2856 = td_fireball_large_impact
2846 = td_fireball_impact_spot
; Body effects.
2851 = td_melee_gfx
2849 = td_shield_gfx
2850 = td_shield_restore_gfx
2852 = td_explosion_fire_gfx
2847 = td_summon_gfx
2848 = td_death_gfx
