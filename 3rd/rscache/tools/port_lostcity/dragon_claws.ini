; Dragon claws (OSRS) -> LostCity rev 254.
;
; Run from the 3draster root:
;   ./3rd/rscache/tools/port_lostcity/port_lostcity \
;     --manifest 3rd/rscache/tools/port_lostcity/dragon_claws.ini --apply
;
; The combat bonuses, the weapon category and the spec params are NOT exported
; — an OSRS item keeps its bonuses in a params table keyed by param ids this
; revision does not share, so writing them through would emit lines naming
; nothing. They are hand-authored in dclaws.obj; see the README.

[port:lostcity]
rev = osrs239
cache = ../../../../cache.osrs239
content = ../../../../../LostCity_Server/content
area = skill_combat
prefix = dclaws

[export:obj]
; Inventory model 32784, wield model 29191 for both genders (offsets 0 and 6).
; Two-handed: wearpos righthand + lefthand, exactly like rune claws.
13652 = dragon_claws

[export:seq]
; "Slice and Dice". 42 frames, 80 client cycles — a shade under three server
; ticks, which is why the two delayed hitsplats land on the following tick.
7514 = dragon_claws_spec
; The seq that rigs the spec's spotanim model, pulled in by spotanim 1171.
7513 = dragon_claws_spec_spot_seq

[export:spotanim]
1171 = dragon_claws_spec_spot

[export:label_map]
; The rev-254 and OSRS player rigs number their joints differently, so a wield
; model ported straight across is tagged for a skeleton the destination client
; does not have. rev 254 tops out around label 72; OSRS framemap 0 has 245
; transforms addressing labels up to 217. Label 161 is simply not a joint here,
; and every vertex carrying it stays put while the arm it belongs to moves —
; which is what "the claws do not move when the player runs" was.
;
; Which claw is which was settled by geometry, not by guesswork. Per-label
; centroids, native rune claws beside the ported dragon claws:
;
;   rune claws   label  16   x = +34.5      dragon claws   label  50   x = -35.3
;                label  17   x = -34.5                     label 161   x = +35.3
;
; Same sides, same heights (y -87.7 vs -80.0), so the pairing falls out.
161 = 16
50 = 17

[extra:dragon_claws]
; Everything below is hand-authored: the source record states none of it. An
; OSRS item keeps its bonuses in a params table keyed by param ids rev 254 does
; not share, and `category` is an id into a table that is not ported either.
;
; It lives in the manifest rather than in the emitted .obj because the exporter
; *owns* that file — appending to dclaws.obj and then re-running the export
; silently drops the lot, which is exactly how the combat tab broke: with no
; `category`, switch_category falls to `case default` and installs the unarmed
; interface, so the tab showed Punch/Kick/Block under the real weapon name.
category = weapon_claws
param = stabattack,41
param = slashattack,57
param = crushattack,-4
param = stabdefence,13
param = slashdefence,26
param = crushdefence,7
param = strengthbonus,56
param = attackrate,4
param = stabattack_anim,claws_punch
param = slashattack_anim,human_axe_chop
param = defend_anim,human_axe_block
param = stab_sound,stabsword_stab
param = slash_sound,stabsword_slash
param = specwep,^true
; "Slice and Dice" drains half the bar. The scale is 0..1000 (^sa_max_energy),
; so 50% is 500 — rune claws next door is 250.
param = sa_energy,500
