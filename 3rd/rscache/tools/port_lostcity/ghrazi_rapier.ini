; Ghrazi rapier (OSRS obj 22324) -> LostCity rev 254.
;
; Run from the 3draster root:
;   ./3rd/rscache/tools/port_lostcity/port_lostcity \
;     --manifest 3rd/rscache/tools/port_lostcity/ghrazi_rapier.ini --apply
;
; Method and the osrs230-names/osrs239-ids split are documented in
; scythe_of_vitur.ini; the same verification was done here
; (`find_named --rev osrs239 cache.osrs239 --seq 8145` matches osrs230's
; record byte for byte).
;
; ------------------------------------------------------------------
; Four animations, from three different places
; ------------------------------------------------------------------
;
; The weapon's full set, and only one of the four is a new export. Recording
; where each comes from because "port the animations" is not one operation
; here:
;
;   stance   809  human_ds_ready         NATIVE - already in rev 254
;   stab    8145  ghrazi_rapier_attack   PORTED - the item's own, osrs239 only
;   slash    390  human_sword_slash      NATIVE - already in rev 254
;   defence 4177  warguild_parry_defend  PORTED - Warriors' Guild, post-2004
;
; The two NATIVE ones are the interesting case: they exist in rev 254 under
; the same name *and* at the same id as in osrs239 (`grep human_ds_ready
; <content>/pack/seq.pack` -> `809=human_ds_ready`, and `find_named --rev
; osrs239 --seq 809` is the same animation). They are 2004-era animations that
; simply survived into OldSchool, so exporting them would mint a duplicate of
; an asset this tree already ships. Referencing them by name is the port.
;
; This corrects an earlier version of this manifest which concluded, from a
; name scan alone, that the cache had only ONE animation for this weapon and
; that its idle therefore had to fall back to rev 254's generic default. That
; was wrong, and wrong in an instructive way: `--name rapier/ghrazi --type
; seq` really does return exactly one record, because three of the four
; animations this weapon uses are not named after it. A name scan finds
; assets *authored for* an item; it cannot find the ones an item merely
; *uses*. Nothing in the cache links an obj to its animations — that mapping
; lives on the game's server, not in any config here — so for a weapon whose
; animations are shared, the ids have to come from outside the cache.

[port:lostcity]
rev = osrs239
cache = ../../../../cache.osrs239
content = ../../../../../LostCity_Server/content
rig_framemaps = 0
rig_inert = 254
area = skill_combat
prefix = ghrazi

[export:obj]
; Wield models 35374 (male) / 35369 (female), inventory model 35739, plus this
; item's own recolour (90->55774).
22324 = ghrazi_rapier

[export:seq]
; 16 frames, 58 client cycles = 1.93 server ticks, forced_priority 6. This is
; the STAB swing, which is three of the four style buttons for `weapon_stab`.
8145 = ghrazi_rapier_attack
; The defence/parry. 6 frames, 42 cycles = 1.40 ticks. Not present in rev 254
; under any name (`grep warguild <content>/pack/seq.pack` is empty), so unlike
; the stance and slash below it genuinely has to be ported.
4177 = warguild_parry_defend

[export:label_map]
; The wield model carries exactly one vertex label, uniformly 50 (measured
; with `find_named --model <id>`; the `vertex labels` line is this session's
; addition to that tool). 50 is OSRS's equipment-grip label, not a body joint,
; so RIGGING_OSRS_RS2.md's identikit correspondence table does not cover it —
; that table comes from the bare body, which has no vertices there.
;
; It maps to rev 254's **66**, that era's own held-weapon joint, and the
; evidence is structural rather than by analogy. In OSRS framemap 0, label 50
; has its own dedicated pivot (`[87] origin labels: 50`) and rides the same
; wrist/forearm transforms — `[47]`, `[48]`, `[34]`, `[35]` — that in rev
; 254's `anim_80.anim` drive 66 and only 66. Two rigs, same role, same place
; in the transform list.
;
; This must agree with `50 = 66` in [export:rig_map] below, and the pair is
; what makes both eras' animations work on one model: the ported OSRS
; sequences move the weapon because their label-50 transforms are renumbered
; to 66, and rev 254's own native walk/run/idle move it because they already
; drive 66.
;
; Two rejected alternatives, both of which half-work and are worth recording:
;   - 17 (the left hand, which is what dragon_claws.ini uses for this same
;     source label). The weapon follows the hand, but the source animation's
;     own weapon motion — everything transform [87] exists to pivot — is
;     thrown away, and rev 254's native sword anims stop addressing it
;     directly.
;   - 66 in [export:label_map] but NOT in [export:rig_map] (the state this
;     port was in before the animations were ported). Native anims move it;
;     the ported ones do not touch it at all, so the weapon hangs motionless
;     in mid-air through its own attack.
50 = 66

[extra:ghrazi_rapier]
; Bonuses are cache.osrs239's own (`find_named --obj 22324`).
;
; Both attack slots take the one ported animation. `weapon_stab`'s style table
; rolls stab on three of its four buttons and slash on the fourth, off the
; same swing.
category = weapon_stab
param = stabattack,100
param = slashattack,55
param = crushattack,0
param = strengthbonus,93
param = attackrate,4
; The stance and the slash are NOT ported: both already exist in rev 254 under
; the same name AND at the same id (`human_ds_ready` 809, `human_sword_slash`
; 390 in both `pack/seq.pack` and the osrs239 cache). Re-exporting them would
; have minted a second copy of an animation this tree already ships.
param = ready_baseanim,human_ds_ready
param = stabattack_anim,ghrazi_rapier_attack
param = slashattack_anim,human_sword_slash
param = defend_anim,warguild_parry_defend
param = stab_sound,stabsword_stab
param = slash_sound,stabsword_slash

