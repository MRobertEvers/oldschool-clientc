; Ghrazi rapier (OSRS obj 22324) -> LostCity rev 254.
;
; Run from the 3draster root:
;   ./3rd/rscache/tools/port_lostcity/port_lostcity \
;     --manifest 3rd/rscache/tools/port_lostcity/ghrazi_rapier.ini --apply
;
; Same shape as scythe_of_vitur.ini, and the same reasoning for what is not
; here: no seq/spotanim export (the cache states no per-item attack anim for
; this obj either — it reuses the stab-sword category's own rev-254 anims,
; already native), and the combat bonuses/category/anims are hand-authored in
; [extra:ghrazi_rapier] because an OSRS param table is not this revision's.

[port:lostcity]
rev = osrs239
cache = ../../../../cache.osrs239
content = ../../../../../LostCity_Server/content
rig_framemaps = 0
rig_inert = 254
area = skill_combat
prefix = ghrazi

[export:obj]
; Wield models 35374 (male) / 35369 (female), inventory model 35739, plus this
; item's own recolour (90->55774) — all off the one obj id.
22324 = ghrazi_rapier

[export:label_map]
; 51 vertices, one label, uniformly 50 — same as the scythe's wield model, and
; the same reason the identikit correspondence table does not apply: it is a
; separate, equipment-only label space (see scythe_of_vitur.ini for the full
; reasoning, not repeated twice in the README).
;
; This item is one-handed (wearpos=righthand only, no wearpos2), so the
; closest native analogue is a one-handed sword rather than the scythe's
; spear: rev 254's own `bronze_sword` — `manwear=model_519_obj_wear`,
; category `weapon_stab`, the same category this item uses below — is 100%
; label 66. `find_named --dat1-anim models/anim_80.anim` confirms 66 is live
; and specifically a *weapon* label, not a body one: transforms [47]/[48]
; rotate it alone, pivoted on label 17 (the hand), and it also rides along in
; the shoulder sweep at [29]-[35]. No live LostCity client was available this
; session to confirm visually in motion — see the README's verification
; section for exactly what was and was not checked.
50 = 66

[extra:ghrazi_rapier]
; Values are cache.osrs239's own (`find_named --obj 22324`). Category and
; anims reuse rev 254's existing stab-sword set
; (skill_combat/configs/melee/swords.obj) rather than porting anything new —
; the cache states no per-item anim for this obj, so there is nothing to port
; and a stab sword's own swing is the closest native match to a rapier's.
category = weapon_stab
param = stabattack,100
param = slashattack,55
param = crushattack,0
param = strengthbonus,93
param = attackrate,4
param = stabattack_anim,human_sword_stab
param = slashattack_anim,human_sword_slash
param = defend_anim,human_sword_def
param = stab_sound,stabsword_stab
param = slash_sound,stabsword_slash
