; torirs plugin settings
;
; A numeric value is an integer expression, as in a revconfig profile:
;   12   0x1F   1Fh   0b1010   #FF8000   1 << 4   (1088 << 16) | 255
;   rgb(255, 128, 0)   rgba(0, 0, 0, 128)   hsl16(hue, sat, lum)
; Colours are read as 0xRRGGBB; hsl16() packs the client's own palette
; index (hue 0..63, saturation 0..7, lightness 0..127).

[plugin:feature-flags]
camera_zoom=Mouse wheel
camera_mmb=On
camera_wheel_step=40
draw_distance=25

[plugin:tile-indicator-c]
enabled=0
true_color=#0FF9EF
dest_color=#F9F60F
hover_color=#FEFEFD

[plugin:minimap-orbs]
enabled=0

[plugin:gameframe-layout]
layout=Modern Fixed

[plugin:mobile-gameframe]
art=Classic
housing=Lizards

[plugin:entity-highlighter]
enabled=0

[plugin:loot-beam]
enabled=0
tier=low
low_value=1

[plugin:ground-items]
enabled=0

[plugin:performance-display]
enabled=0

[plugin:visual-metronome]
box=colour_and_number
tick_count=4
tick_color=#FEFEFD
tock_color=#87807B
number_color=#000000
cycle2_color=#0FF9EF
cycle3_color=#0FF9EF

[plugin:olm-cycle]
corner=bottom_left
highlight_color=#F9D10F
