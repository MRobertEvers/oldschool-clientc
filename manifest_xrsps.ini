; Boot manifest: modern-gen xrsps (OSRS rev 233) over WebSocket, plaintext.
;
; The xrsps server is a Node `ws` WebSocket server speaking a custom
; length-prefixed binary opcode protocol: no RSA, no ISAAC, no JS5. See
; docs/MULTI_GENERATIONAL_PARITY.md.
;
;   ./src/torirs --manifest manifest_xrsps.ini --user x --pass y
;   ./src/torirs --manifest manifest_xrsps.ini --offline   (cache-only boot)
;
; Map (lX_Z) archives are still XTEA-encrypted at OldSchool 233 (the gate is
; revision >= 237). The cache ships a keys.json XTEA table for offline map loads.

[cache:boot]
epoch=dat2
game=oldschool
revision=233
quirks=none
; The rev-233 dat2 cache shipped with the xrsps checkout (dat2 + idx0..14 +
; keys.json). Absolute so it works from any cwd; adjust if your xrsps checkout
; lives elsewhere.
dir=/Users/matthewevers/Documents/git_repos/xrsps-typescript/caches/osrs-233_2025-10-01

[net:boot]
rev=xrsps233
transport=ws
host=localhost
port=43594
; Sent in the login(204) packet. Must equal the server's cache revision or the
; server rejects with error code 6.
client_version=233
; No rsa_exp / rsa_mod / jag_crc: xrsps has no RSA / ISAAC / CRC handshake.

[features:boot]
; xrsps paths server-side: the client sends LOC_INTERACT / INTERACT / WALK with
; the target only and never a route, so the era cannot be derived from the
; rev-233 cache (which otherwise implies the OSRS waypoint-packet client).
era=server_routed

[ui:boot]
logic=cs2
chrome=cache
; Fixed-mode root interface group. Used directly for offline boots; a live
; server re-roots the UI via WIDGET_SET_ROOT after login.
interface_id=161
