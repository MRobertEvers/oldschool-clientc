; Boot manifest: OSRS revision 230 with the server running *in this process*.
;
; Identical to manifest_osrs230.ini but for `transport=embed`, which replaces
; the socket with a pair of byte queues (src/platform/net_transport_embed.c).
; There is no server to start and no port to pick — one process is the whole
; game. The wire is unchanged: the same login block, the same RSA, the same
; ISAAC ciphers, the same packets.
;
;   make -C src torirs EMBED_SERVER=1
;   src/torirs --manifest manifest_osrs230_embed.ini --user testc --pass test
;
; A build without EMBED_SERVER=1 fails loudly here rather than quietly dialling
; port 43595. See docs/osrs230_mockserver.md §3.13b.
;
; The wire is rev 230 and the cache is rev 239, which is deliberate: the mock
; server's content tree (OSRS-Content/osrs239-content) is an unpack of
; cache.osrs239, so its npc, obj and loc ids are that cache's. Booting this
; against cache.osrs230 would draw the wrong model for half of them.
;
; Map archives are unencrypted from OldSchool 237 on, so no xteas.json is needed
; here — the rev-230 cache did need one.

; The tree baked back into a cache — see manifest_osrs230.ini's note and
; `make -C src mock230-cache`. Booting the pristine cache means no content edit
; to a client-visible record ever reaches the client.
[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239.baked

[net:boot]
rev=osrs230
transport=embed
; Inert — kept so a diff against manifest_osrs230.ini is one line.
host=localhost
port=43595
client_version=230
; RSA public key matching the mock server's private key (mock decrypts the
; login block). E=10001; N is the mock's 1024-bit modulus.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[ui:boot]
logic=cs2
chrome=cache
interface_id=161

; Where the chat lines live.
;
; At this revision the chatbox is not a surface the client paints — it is
; interface 162 (`chatbox`), which ships 500 empty text components inside a
; scrolling layer and expects the client to fill them in. Background, filter
; tabs, Report button, scrollbar and fonts are all already in the cache; the
; client's whole contribution is the text. See src/game/rs_chat_widgets.h.
;
; The children are named in the content tree's interfaces/chatbox.compack:
;   57 input        the typed line, "name: text*"
;   58 scrollarea   the scrolling layer the lines sit in
;   59 line0        ... 558 line499
[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
; No chatbox_input= here on purpose. Child 57 (`chatbox:input`) is written by
; the cache's own clientscript 223 — it composes `<icon><name>: <typed>*`
; from %varcstring335, which the chatbox's onKey handler (script 73) edits.
; Declaring it here makes the client overwrite that every frame with a line
; built from an input buffer this era never fills. See rs_chat_widgets.h.
chatbox_line_height=14
