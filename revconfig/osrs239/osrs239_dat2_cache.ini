; ---------------------------------------------------------------------------
; The sidebar, named.
; ---------------------------------------------------------------------------
;
; `panel_<name>` is the interface MOUNTED behind a tab stone. On this frame the
; sidebar mounts come from the CS2 toplevel rather than from a profile, so they
; carry no tab numbering of their own -- `slot(sidebar, N)` answers nothing
; here, unlike on the 2004 frame -- and each panel is named by the interface it
; IS instead.
;
; Every id below was read off this cache rather than remembered: interface 218
; carries "Spell Filters", 541 "Prayer Filters", 239 "Playing:", 216 is the
; 62-graphic emote grid, 593 the combat tab's styles, 387 the 42-graphic
; equipment sheet, and 149 is the bare container the server fills with the
; inventory. They agree with revconfig/osrs_static's own tab table.
;
; Stated as `id(if(<iface>, 0))` and not through a `[iface:…]` section apiece,
; because nothing but the role wants these ids: `[iface:…]` exists for the ids
; C looks up BY NAME, and a role already is a name. `chat` and `logout` above
; have both because they are wanted twice.
;
; All server-mounted, so all absent until login -- and tab 8 shares interface
; 720 with tab 2, which is the cache's own doing.

