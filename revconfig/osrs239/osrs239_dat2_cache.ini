; -------------------------------------------------------------------------
; Semantic roles -- which NODE a name means on this revision.
;
; The sections above answer "which id is that interface"; these answer "which
; COMPONENT is that element", which is what a plugin asks and what no number
; compiled into C can be right about on more than one lane.
; @see ui/uitree_role.h.
;
; Nothing here binds a placeable region (`viewport`, `minimap`, `safe`, …):
; those are the layout vocabulary and resolve through it, on this frame via
; the clientCodes the cache's own toplevel carries (1337 world, 1338 minimap,
; 1339 compass -- read off the live tree with TORIRS_DUMP_CLIENTCODES).
;
; Both elements below live on SERVER-MOUNTED interfaces, so both are absent
; until login and answer "not here" before it. That is the contract, not a
; gap: a plugin asking early offers no verb rather than pressing a component
; that is not on screen yet.
; -------------------------------------------------------------------------

; Chat filter strip, the Report button: interface 162 component 31, the layer
