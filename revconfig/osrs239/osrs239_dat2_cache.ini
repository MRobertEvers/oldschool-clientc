; No [iface:welcome_screen] here, and that is the answer rather than an
; omission. The classic welcome panel is a dat1-era interface driven by
; clientCodes 650-655 and a LAST_LOGIN_INFO packet; OldSchool dropped both --
; this revision's packetin table has no such message -- and what a modern
; server opens after login is an ordinary server-driven interface that needs
; nothing declared here. Undeclared means absent, which is correct.
