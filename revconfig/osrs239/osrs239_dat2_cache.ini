; ---------------------------------------------------------------------------
; The frame REGIONS a plugin layout places, per toplevel.
;
; A 2004 profile spells these in its own tree (`type=chat`, `slot=side_modal`,
; a builtin per tab). A cache gameframe has no such vocabulary: the client
; recognises the world, the minimap and the compass by clientCode, and the
; rest -- the chat container, the fourteen side panels and the side-modal box,
; the main modal, the orb column -- are plain layers whose numbers differ on
; every one of the four toplevels. So the numbers live here, one rung per
; toplevel, and the frame binder (app_plugin_frame_bind) stamps whichever rung
; resolves. A toplevel this table does not know is a frame the plugin can
; place nothing on but the world and the map, which is visible immediately.
;
; The chat is the CONTAINER (`chat_container`, 519x165) and not the chatbox
; pack inside it: the pack draws its own backing, buttons and scrollbar, so a
; layout places the box and dresses none of it. The same is true of the side
; panels (190x261 each) and the orb pack (interface 160), which is why there
; are no chat-button rungs here -- on this lane those are the pack's.
;
; Indices are the component's position in the toplevel's own .if file
; (OSRS-Content/osrs239-content/interfaces/toplevel*.if), 548 fixed, 161
; resizable classic, 164 resizable modern, 601 mobile.
