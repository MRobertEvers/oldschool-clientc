; Cache-side revconfig for the OldSchool rev-239 world (dat2).
;
; Every cache id and asset name the CLIENT itself has to know, for this cache.
; Nothing here is layout: the rev-239 gameframe is the cache's own IF3 tree,
; mounted by manifest_osrs239.ini's `[revconfig:component:gameframe]`. What this
; file answers is the other half — the handful of things the client draws or
; drives on its own behalf, and which therefore have no interface record to
; carry their ids.
;
; Before this file those ids were C literals: a `static struct StaticSpriteDef`
; table with an archive name per slot, an `enum { APP_FONT_B12_CACHE_ID = 496 }`,
; and a run of `host->script_* = <number>` in RS_CS2Host_Init. Each was a silent
; wrong answer on every other cache — a name that resolves to nothing and an
; overlay that quietly stops drawing, or worse, a number that resolves to some
; UNRELATED script on a cache that renumbered.
;
; Undeclared means absent. A slot with no section here stays unbound and the
; thing that wanted it draws nothing; a `[script:…]` this file omits leaves its
; feature switched off. That is deliberate: the alternative is a built-in
; default, which is exactly the class of bug this file exists to remove.

; -------------------------------------------------------------------------
; Sprites the client draws itself (the reference's "graphic defaults").
;
; Dat2 addresses the sprites table by archive NAME, so a section here is
; `table=sprites` plus the archive name; no filename= (that key is what marks a
; dat1 jagfile member). The SECTION name is the one the client asks for --
; enum StaticSpriteSlot in engine/static_sprites.h -- and it need not match the
; archive name, so a pack that was renamed between eras still reaches its slot.
;
; Three dat1 slots have no rev-239 equivalent and are deliberately absent:
;   mapfunction   OldSchool moved minimap icons into mapfunction CONFIGS, read
;                 through the loc/npc tables rather than one sprite sheet.
;   headicons     split into the three headicons_* archives below. The prayer
;                 indices survived the split (0 melee, 1 missiles, 2 magic,
;                 3 retribution, 4 smite, 5 redemption), which is why the
;                 overhead pass can take headicons_prayer as a drop-in.
;   hitmarks      dat1 packs every splat into one archive and indexes it by
;                 damage type. OldSchool gives each type a CONFIG record naming
;                 an ordinary sprite (rev 239: damage is type 28 -> sprite 1359,
;                 block type 26 -> 1358), which app.c prefers and which
;                 CreateTask_Dat2HitsplatLoad loads at boot. The C table used to
;                 name a `hitmark` archive here that this cache does not have,
;                 so every interface open logged a lookup failure for a sprite
;                 nothing was going to draw.
; -------------------------------------------------------------------------

[sprite:compass]
table=sprites
archive=compass

[sprite:mapedge]
table=sprites
archive=mapedge

[sprite:mapscene]
table=sprites
archive=mapscene

[sprite:headicons_pk]
table=sprites
archive=headicons_pk

[sprite:headicons_prayer]
table=sprites
archive=headicons_prayer

[sprite:headicons_hint]
table=sprites
archive=headicons_hint

[sprite:mapmarker]
table=sprites
archive=mapmarker

[sprite:cross]
table=sprites
archive=cross

[sprite:mapdots]
table=sprites
archive=mapdots

[sprite:scrollbar]
table=sprites
archive=scrollbar

; Crown/mod icons beside a chat name. Dat1 has no such pack.
[sprite:mod_icons]
table=sprites
archive=mod_icons

; -------------------------------------------------------------------------
; Fonts the client sets its own text in.
;
; Interface text carries its font as a fonts-table archive id and resolves
; itself; these three are the ones C names, because nothing in the cache asks
; for them on its behalf: minimenu and hovertext (b12), hitsplat numbers (p11),
; the scene-rebuild overlay (p12).
;
; cache_font_id is deliberately unset. That is the dat1 scene slot, and on dat2
; the archive id IS the scene slot -- stating a second number here would invent
; a mapping this era does not have.
; -------------------------------------------------------------------------

[font:p11]
table=fonts
archive_id=494

[font:p12]
table=fonts
archive_id=495

[font:b12]
table=fonts
archive_id=496

; -------------------------------------------------------------------------
; Clientscripts the CLIENT calls, as opposed to ones the cache calls itself.
;
; Each is a script whose trigger this client owns: it happens outside the
; cache's own event model, so nobody else is going to run it.
; -------------------------------------------------------------------------

; The three tile-highlight triggers (trigger_48 / trigger_49 / trigger_47).
; Fired on hover-tile change, route change, and destination change respectively.
; The `[clientscript]` apply forms beside them (5198 / 5204 / 5210) are the
; cache's to run and are deliberately NOT listed: this client fires the trigger
; and lets the cache do the rest.
