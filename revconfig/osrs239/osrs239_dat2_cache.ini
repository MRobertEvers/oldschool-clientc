; ---------------------------------------------------------------------------
; The sidebar tabs, named by NUMBER.
; ---------------------------------------------------------------------------
;
; `sidetab_<n>` is the node whose state answers "has the server given this
; player tab n" -- the question the client's own chrome asks before it draws a
; tab icon, and the one a plugin gameframe that replaced that chrome has to ask
; too (ToriRS_PluginApi::tab_enabled).
;
; Numbered rather than named, alone among the roles in this file, because it is
; the one role a plugin looks up by ARITHMETIC: it holds a tabno and needs the
; node, and `panel_<name>` cannot be reached from a number. The numbering is
; side0..side13's, the cache's own -- 0 combat, 3 inventory, 13 music -- which
; `player/configs/gameframe.enum` states on the server side and every profile
; in this tree has carried since long before roles existed.
;
; The ICON and not the mount, and the difference is the whole point. `sideN` is
; `hidden=yes` in the cache and unhidden for the SELECTED tab, so its hide
; means "you are not looking at this one"; `iconN` is hidden for a tab the
; player has not GOT, which is the tutorial handing the fourteen out one at a
; time. A verb reading the mount would call thirteen tabs out of fourteen
; hidden at every moment.
;
; Three rungs apiece, one per toplevel this revision can be wearing --
; `if_opentop` swaps the whole root between Classic (161), Fixed (548) and
; Modern (164), and only the live one is in the tree, so the chain resolves to
; whichever is up. The component numbers are each interface's own and are read
; off this cache's `toplevel*.compack` rather than remembered.
;
; The dat1 profiles state none of these and do not need to: their gameframe
; carries its own sidebar mounts, so IF_SETTAB answers there and the engine
; reads it directly. @see app_plugin_tab_enabled.

