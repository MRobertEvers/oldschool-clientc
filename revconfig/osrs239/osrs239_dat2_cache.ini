; -------------------------------------------------------------------------
; Buttons the minimap-orbs plugin presses.
;
; Interface 160 is this cache's own orbs, so these are the components its own
; orbs carry -- `runbutton` and `specbutton` in `orbs.compack`, addressed the
; dat2 way as `(interface << 16) | index`. The plugin is switched off on this
; lane by default (the gameframe already draws these orbs), so what they are
; for is the lane that turns it on to compare the two side by side.
; -------------------------------------------------------------------------

; interface 160 component 28, `runbutton`, op 1 "Toggle Run".
