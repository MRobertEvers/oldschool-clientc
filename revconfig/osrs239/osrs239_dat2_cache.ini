; -------------------------------------------------------------------------
; [chrome] -- where the CLIENT's own furniture mounts on this revision.
;
; The plugin window's "Manage Plugins" button. The button itself is the
; client's (no server knows about plugins), but every number describing WHERE
; it goes is a fact about interface 182 `logout` and belongs here rather than
; in torirs_plugin_panel.u.c, which is where all of it used to live.
;
; THE LOGOUT TAB, the same place the 2004 profiles author the identical button
; (revconfig/rs245_2lc, `[component:manage_plugins_*]`). It is the one tab
; whose panel is a centred block with room to spare under it, and a
; client-owned setting is what a player already expects to find among
; client-owned things. An inactive sidebar tab prunes its whole subtree
; (uitree_emit's SIDEBAR gate), so the button is visible exactly when the tab
; is and there is nothing to manage.
;
; `plugin_button_parent=0` is the interface's own root layer -- the plate hangs
; off the panel itself rather than off the block the cache lays its own
; controls out in, because that block is 190x170 and clips anything outside it.
;
; `plugin_button_anchor=logout_button` is where the box and the art come from:
; the panel's own "Click here to logout" plate, measured live. It used to be
; four numbers here -- x=23 y=205 144x36, the 2004 profile's box, on the
; grounds that the panel is the same 190x261 size -- and the numbers were
; wrong: the CS2 hook that lays this panel out puts its logout button at y=201
; on the fixed frame and on both resizable ones, so the client's plate was
; drawn straight over it. An anchor cannot be wrong about that; it IS the
; button's box.
;
; `align=top` + `margin=15` is the one thing the anchor does not say: which end
; of the tab the client's own control goes. The panel's block sits 67px down,
; so 15 from the top centres a 36-high plate in the space above the heading and
; clear of everything the cache draws.
;
; A revision that leaves this out builds no button -- which is what every dat1
; lane does, because its profile authors one of its own.
; -------------------------------------------------------------------------

; DISABLED for now, deliberately as a commented mount rather than by deleting
; anything: the rail's own Manage Plugins stone is the way in while the plugin
; chrome is being worked on, and two ways into one window is one too many to
; look at. Uncommenting these five keys is the whole of turning it back on --
; app_plugin_button_form reads a block with none of them as "this revision
; states no mount" and silently builds no plate, which is the same answer every
; dat1 lane already gets.
[chrome]
;plugin_button_iface=logout
;plugin_button_parent=0
;plugin_button_anchor=logout_button
;plugin_button_align=top
;plugin_button_margin=15
;plugin_button_op=Manage Plugins

; ---------------------------------------------------------------------------
; Title screen art.
;
; OldSchool addresses these by archive NAME in the sprites table, and keeps the
; backdrop in the BINARY table instead -- which is the one place the modern
; lane differs from the old one, since the half-and-mirror composite behind
; `format=jpeg_panel` is shared by both.
;
; group=title keeps them out of the gameframe's bake, and the gameframe's atlas
; out of the title's.
; ---------------------------------------------------------------------------

[sprite:title_background]
table=binary
archive=title.jpg
format=jpeg_panel
group=title

[sprite:titlebox]
table=sprites
archive=titlebox
group=title

[sprite:titlebutton]
table=sprites
archive=titlebutton
group=title

[sprite:logo]
table=sprites
archive=logo
group=title

; Twelve rune masks, stamped into the flame cooling map one at a time.
[sprite:runes]
table=sprites
archive=runes
group=title

; The login form's two checkboxes, off and on: a plain plate and the same
; plate wearing a tick. Addressed by archive id rather than by name because
; neither archive carries one -- this cache's sprites table has a name for
; `titlebox` and `logo` and nothing for these (spritebake --probe finds no
; hash), so the id IS the address. Both are 17x17 and are a matched pair
; (697/699, with 698's cross between them).
[sprite:login_toggle_off]
table=sprites
archive_id=697
group=title

[sprite:login_toggle_on]
table=sprites
archive_id=699
group=title

