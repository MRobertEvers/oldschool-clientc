; -------------------------------------------------------------------------
; [chrome] -- where the CLIENT's own furniture mounts on this revision.
;
; The plugin window's launcher button. The button itself is the client's (no
; server knows about plugins), but every number describing WHERE it goes is a
; fact about interface 728 `popout` and belongs here rather than in
; torirs_plugin_panel.u.c, which is where all of it used to live.
;
; Read off the live strip: `popout:buttons` (child 6) holds the shipped icons
; -- XP Tracker, Loot Tools, Hiscores at slots 0..2 -- as 30x30 graphics on a
; 36px pitch, so the plugin button is slot 3. `popout:container` (child 9) is
; the one panel slot the strip shows at a time, and the panel mounts into it.
;
; A revision that leaves this out has no strip: no button is built and the
; plugin window opens in the canvas instead.
; -------------------------------------------------------------------------

[chrome]
plugin_button_iface=plugin_popout
plugin_button_parent=6
plugin_panel_parent=9
plugin_button_slot=3
plugin_button_size=30
plugin_button_pitch=36
plugin_button_op=Show Plugin Settings
plugin_layout_script=plugin_popout_layout
