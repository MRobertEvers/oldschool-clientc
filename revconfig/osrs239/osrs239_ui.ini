; ===========================================================================
; The loading screen's own work list.
;
; A different SHAPE of boot, not a renamed one. Where the 2004 client fetches
; nine archives in sequence and names each as it goes, OldSchool 239 opens
; eight cache indices at once and watches them complete (the deob's
; Statics.method4490), so its bar is a weighted sum rather than a position in a
; queue. That is `weight` below, and it is why every index shares one percent
; and one sentence: the deob has exactly one caption for the whole span,
; "Checking for updates - N%".
;
; The weights are the deob's own, and they total 100. Sound effects are 53 of
; that on their own, which is worth knowing before wondering why a bar sits
; still on a fast connection.
; ===========================================================================

[preload:soundeffects]
order=10
kind=index
archive=soundeffects
id=4
percent=30
weight=53
say=checking_updates
render=yes

