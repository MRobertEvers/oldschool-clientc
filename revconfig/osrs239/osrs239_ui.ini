; ===========================================================================
; What a login rejection means, in words. OldSchool 239's own (the deob's
; Statics.method13624), which answers in THREE lines where the 2004 client
; answers in two -- which is why this table is the profile's and not the
; client's.
;
; `screen` is the behavioural half. This lane has one error page (the deob's
; loginIndex 9) and a dedicated one for a bad password (loginIndex 3); both
; land on RS_TitleScreen 3 here, since the two say the same thing in this
; client's vocabulary.
; ===========================================================================

[login_reply:-3]
