; ===========================================================================
; OldSchool 239 -- the title screen.
;
; The UI half of this revision's profile. It carries only [layout:title]:
; the gameframe is the cache's own IF3 tree, mounted by the cache half, and
; nothing here restates it.
;
; The panel is a fixed 765x503 centred in whatever window the client has --
; the deob recomputes `titleX = (canvasW - 765)/2` every frame. That is a
; layout rule rather than a coordinate, so the root row says `xalign=center`
; and every number below is relative to the panel, which is exactly what the
; deob's `titleX + n` means.
;
; Geometry is Statics.method8166's own: the box at (202,171), message lines at
; y 201/216/231, "Login: " at centre-110 and the password at centre-108, the
; buttons at y 291 (menu) and 321 (form), and the loading bar's 304x34 track
; at y 233.
; ===========================================================================

[component:title_root]
type=rs_layer
w=765
h=503

[component:title_backdrop]
type=sprite
sprite=title_background
w=765
h=503

[component:title_logo]
type=sprite
sprite=logo

; The two braziers. Same simulation as the old lane; this revision keeps its
; flame palettes in the cache, and until those are read the built-in reference
; gradients stand in.
[component:title_flames_left]
type=title_flames
field=left
; The deob blends its braziers onto the frame at titleX-22 and titleX+659.
; This client's sprite blit is a straight copy, so the column has to sit
; where its wall was cut from and the 22 is expressed as a lean instead.
flame_bias=-22
flame_sway=-1
flame_run=128
flame_row=8
w=128
h=265

[component:title_flames_right]
type=title_flames
field=right
; The deob blends its braziers onto the frame at titleX-22 and titleX+659.
; This client's sprite blit is a straight copy, so the column has to sit
; where its wall was cut from and the 22 is expressed as a lean instead.
