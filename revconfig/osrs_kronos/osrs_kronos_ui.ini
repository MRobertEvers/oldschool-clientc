[component:invback]
type=sprite
sprite=invback

; The map HOUSING: a plate with the map's and the compass's holes cut out of
; it, which is why it is declared after both and paints over them.
;
; `minimap_edge` names that fact. A readout hung off the map -- the orb column
; the minimap-orbs plugin draws -- has to be attached to the last piece of the
; assembly rather than to the map surface, or it is painted into the gap
; between the two and comes out behind this plate. `minimap` says where the
; map is; this says what anything drawn beside it has to sit on top of.
[component:mapback]
type=sprite
sprite=mapback
role=minimap_edge

