

; Touch devices: the near end of the zoom band, closer than the desktop's
; 40%-of-rest floor -- a phone's viewport is a few inches across and the
; player is small on it at 240. An override of the band only; `zoom=` above
; (or the default it stands for) still says where the camera rests and how
; it projects. 150 is a quarter of the 600 rest.
[camera@mobile]
zoom_closest=150
