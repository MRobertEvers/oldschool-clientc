

; ---------------------------------------------------------------------------
; The camera's pitch behaviour, stated rather than inherited.
;
; The eye sits `pitch * pitch_distance + <live zoom>` behind the player, so
; these three say how the camera behaves as it TIPS, which is a fact about
; the rev-217 client and belongs beside it:
;
;   pitch_distance=3     the reference's coefficient (Client-TS camFollow's
;                        `pitch * 3 + 600`). Fine units of eye distance per
;                        angle unit, so the term runs 384 at the flattest
;                        angle to 1149 at the steepest -- overhead it is nine
;                        tenths of the whole distance.
;   pitch_flattest=128   how far the camera may tip, 2048 to a turn: 22.5 deg
;   pitch_steepest=383   above the horizontal, and 67.3 deg. The reference's
;                        own bounds, and the one statement of them -- the
;                        drag, the arrow keys, the boot angle and the terrain
;                        clamp all read these.
;
; The rest of the camera is this client's default (rest=600, the band derived
; around it, the viewport term on, both controls live), which is already this
; revision's, so restating it here would only be somewhere for it to drift.
; ---------------------------------------------------------------------------
[camera]
pitch_distance=3
pitch_flattest=128
pitch_steepest=383

; Touch devices. THREE keys, because "zoom in" is three different levers and a
; phone needs all of them -- each worth something at a different camera angle.
;
; The eye sits `pitch * pitch_distance + <live zoom>`, and the whole is then
; scaled. With the desktop's pitch_distance=3 the pitch term is 384 level and
; 1149 overhead, which is why a single lever could never answer both.
;
;   zoom_closest=60      the additive term's floor: a tenth of the 600 rest,
;                        and exactly one wheel_step, so the closest notch is a
;                        notch and not a clamp. Worth 29% level (624 -> 444
;                        against the desktop's 240 floor) and 13% overhead.
;
;   distance_scale=70    the whole distance, so the same 30% at every angle.
;                        70 is a phone at arm's length wanting about a third
;                        less room than a monitor at desk distance. It brings
;                        the RESTING view in by the same third -- deliberate,
;                        and why this is a device key and not a wider band:
;                        a band is where a gesture may travel, this is how
;                        much camera the screen wants.
;
;   pitch_distance=2     the pitch term alone, which is almost the whole of
;                        the overhead view and almost none of the level one.
;                        The reference's sweep needs a monitor's room; on a
;                        phone the top-down view is the one people play from.
;
; Composed -- all three, against the desktop's own closest notch, before the
; viewport term:
;
;                        closest notch          resting
;   pitch 128 (level)     444 -> 221 fine units   984 -> 599  (7.7 -> 4.7 tiles)
;   pitch 383 (overhead) 1209 -> 578             1749 -> 956 (13.7 -> 7.5 tiles)
;
; Everything else the section could state -- rest=, zoom_furthest=,
; wheel_step=, viewport_zoom=, pitch_flattest=, pitch_steepest=, controls= --
; is left to the `[camera]` above, because none of it differs on a touchscreen.
[camera@mobile]
zoom_closest=60
distance_scale=70
pitch_distance=2
