; ---------------------------------------------------------------------------
; Semantic roles -- which NODE a name means on this frame.
; ---------------------------------------------------------------------------
;
; `tab_<name>` is the STONE you click, stated on the [component:sideicon_…]
; sections as `role=` because this profile builds them. `panel_<name>` is the
; interface mounted behind it, found through the sidebar's own tab numbering --
; so "inventory is tab 3" is a fact this profile states once and no plugin has
; to learn. @see ui/uitree_role.h.
;
; The placeable regions (`viewport`, `minimap`, `safe`, …) need no binding:
; they are the layout vocabulary and resolve through it.
;
; The report button is NOT bound here. On this frame the chat filters are the
; chat interface's own widgets rather than client builtins, and which component
; that is has to be read off the live tree before it can be written down.

[role:panel_combat]
match=slot(sidebar, 0)

[role:panel_stats]
match=slot(sidebar, 1)

[role:panel_quests]
match=slot(sidebar, 2)

[role:panel_inventory]
match=slot(sidebar, 3)

[role:panel_equipment]
match=slot(sidebar, 4)

[role:panel_prayer]
match=slot(sidebar, 5)

[role:panel_magic]
match=slot(sidebar, 6)

[role:panel_clan]
match=slot(sidebar, 7)

[role:panel_account]
match=slot(sidebar, 8)

[role:panel_friends]
match=slot(sidebar, 9)

[role:panel_logout]
match=slot(sidebar, 10)

[role:panel_options]
match=slot(sidebar, 11)

[role:panel_emotes]
match=slot(sidebar, 12)

[role:panel_music]
match=slot(sidebar, 13)

; The logout panel under the name every lane's profile uses for it.
[role:logout_screen]
match=slot(sidebar, 10)
