; The backdrop. `format=jpeg_panel` is one more decoder behind format=, beside
; pix8 and pix32: the cache stores half a screen as a JPEG and the panel is
; that half plus its mirror, exactly as the reference builds it.
[sprite:title_background]
table=configs
archive=title
container=jagfile
index=index.dat
filename=title.dat
format=jpeg_panel
group=title
