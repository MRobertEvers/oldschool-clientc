# Cache-side revconfig for the LostCity rev-289 world (dat1).
#
# A copy of rs245_2lc/rs245_2lc_dat1_cache.ini with ONE class of change, so a
# diff against that file is the whole story:
#
#   font_name=p11  ->  p11_full        (and p12, b12, q8)
#
# The stem is not cosmetic: in this cache family it names the GLYPH LAYOUT.
# "p11" is 94 glyph records in CHARSET order; "p11_full" is 256 records indexed
# by character code. 289 ships the latter, and asking for the 254 stem is why
# an unmodified client either finds no font at all or draws the right glyphs
# against the wrong characters.
#
# The section ids ([font:p11] and friends) are untouched, because every UI
# reference is by section id -- so the layout file needs no 289 variant and the
# manifest keeps pointing at rs245_2lc's.
#
# Everything else here was verified against the running 289 server: the media
# archive's sprite names are unchanged, and all 35 load.

[sprite:invback]
table=configs
archive=media
container=jagfile
# jagfile = requires 'index' and 'filename'
index=index.dat
filename=invback.dat
# Format = load_sprite_pix8(filelist, "invback.dat", index_file_idx, 0);
format=pix8
atlas_index=0

