item=1333

; ---------------------------------------------------------------------------
; "Manage Plugins": the client's own control, in the logout tab.
; ---------------------------------------------------------------------------
;
; The plugin window has to be openable from somewhere, and on a MODERN
; gameframe it already is -- the client puts a wrench in the popout strip
; beside XP Tracker (app_plugin_button_sync). A 2004 frame has no strip and no
; interface anywhere in the cache that could hold one, so the launcher has to
; be authored, and this is where a profile authors things.
;
; The logout tab, because it is the one tab whose interface is a single centred
; button with room to spare under it, and because a client-owned setting is
; what a player already expects to find among client-owned things. An inactive
; sidebar tab prunes its whole subtree (uitree_emit's SIDEBAR gate), so the
; button is visible exactly when the tab is and there is no visibility for
; anything to manage.
;
; ## The art is the CHROME's, not this cache's
;
; `sprite=chrome:<slot>` names the baked chrome skin
; (engine/torirs_chrome_skin_baked.h) instead of a `[sprite:...]` section, and
; that is the whole point of the button existing at all: it opens the plugin
; window, which is the client's own furniture, so it cannot be drawn with art
; that only some caches contain. The three slots are the interfaces' own wide
; stone button -- two 36px caps and a 20px tile between them -- so it is the
; same button the logout interface's own rows are drawn with, on every
; revision, including the ones whose cache has no such sprite.
;
; Four components, because the button is four pieces of drawing: the OP lives
; on the container, which is the only one of them with the whole box.

; The container. It carries the menu row and nothing else -- the three graphics
; and the label under it are decoration and deliberately carry no ops, because
; two op-bearing nodes under one pointer is two rows saying the same thing.
;
; `option=` and not `op0=`: a numbered op is gated on the SERVER having armed
; it (IF_SETEVENTS) or on a local script hook, because an unarmed op string
; steals the default click from real controls underneath it. This component
; belongs to the client, no server will ever arm it, and `option=` is the
; ungated path the static owners already use.
[component:manage_plugins_button]
type=rs_layer
w=144
h=36
option=Manage Plugins
; The client's own action band. @see REVCONFIG_MINIMENU_PLUGIN_PANEL: it opens
; the plugin window in whatever presentation the boot manifest's
; `[chrome] executor=` bound.
option_action=PLUGIN_PANEL

[component:manage_plugins_cap_left]
type=rs_graphic
sprite=chrome:button_left
w=36
h=36

; The stretch between the caps. `tiled=` repeats the 20px tile across the box
; rather than blitting it once, which is how the cache's own button is authored
; (the logout interface's middle piece carries `tiled=yes`); without it the
; button is two caps with a hole in it.
[component:manage_plugins_cap_mid]
type=rs_graphic
sprite=chrome:button_mid
tiled=true
w=94
h=36

[component:manage_plugins_cap_right]
type=rs_graphic
sprite=chrome:button_right
w=36
h=36

; The interfaces' own button face, BOLD -- what every button in this frame sets
; its caption in, "Click here to logout" directly above this one included. The
; body face reads as a paragraph that happens to be sitting on a button.
;
; `chrome:bold` and not `b12`, for the same reason the plate above is
; `chrome:*`: this control opens the plugin window, so it has to be legible on
; a cache that carries no such font. It is the same face either way -- the
; chrome bakes the interfaces' own 496 -- but this one is compiled in.
[component:manage_plugins_label]
type=rs_text
w=144
h=36
text=Manage Plugins
font=chrome:bold
color=16249055
center=true
; Centred against the WHOLE plate, not against a hand-placed line box: ascent
; and descent differ per face, so a 13px box positioned by eye sits right in
; one font and low in the next. The cache's own captions are authored exactly
; this way -- full height, halign 1, valign 1.
valign=1
; Red under the pointer, which is what the logout button beside it does
; (`com_12`'s onmouseover writes 16711680 and its onmouseleave writes the
; colour above). Stated as a colour rather than as a pair of scripts because a
; client-owned control has no scripts to hang them on.
over_color=16711680
shadowed=true

