; ===========================================================================
; The loading screen's own work list.
; A step carries `percent=` only where THIS client performs it. The rest keep
; their order, kind, archive, words and weight -- the transcription is the
; point -- but they do not move the bar, because a step that never runs cannot
; own a position on it. Two lists describing the same span both claiming a
; percentage is what makes a loading bar jump backwards.
;
;
; Client-TS's boot, in its order and its words (Client.ts `load()`): nine jag
; archives pulled over HTTP one at a time, the on-demand prefetch, then the
; unpack passes that turn each archive into tables the game can use. The
; percentages and the sentences are its own -- `say` names a [string:] entry,
; so the wording stays this revision's.
;
; `render=yes` is the opt-in that makes the bar move. A step without it runs
; inside whatever frame is already being settled; a step with it publishes a
; frame BEFORE it runs, so a fetch that takes a second shows a second of
; progress instead of a frozen screen. It costs a frame, which is why it is
; stated per step rather than assumed for all of them.
; ===========================================================================

