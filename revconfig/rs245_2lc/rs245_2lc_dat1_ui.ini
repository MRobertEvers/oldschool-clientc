; ---------------------------------------------------------------------------
; Sidebar tab hotkeys.
;
; Each [hotkey:<key>] binds one key to one component + effect. The effect is
; hard-coded in C (enum UITreeHotkeyEffect) and the component must advertise it
; with a hotkey= line, so a key can only reach behaviour the widget opted into.
; Key names: LibToriRS_OsrsKeyFromName (f1..f12, 0..9, a..z, escape, ...).
;
; F1..F12 run down the sidebar in order, skipping the unused slot 7. The digit
; row repeats the first nine and gives music — the one tab with no F-key — the
; 0. Digits 4-9 and 0 are also the debug spawn keys (app_world_hotkeys); a
; binding wins, so delete the digit sections here to get those back.

[hotkey:f1]
c=sideicon_combat
e=select_tab

[hotkey:f2]
c=sideicon_stats
e=select_tab

[hotkey:f3]
c=sideicon_quests
e=select_tab

