; NAMED, unlike its thirteen siblings, so that a profile can hang something of
; its own inside the logout tab -- `p=sidebar_tab_10` in a layout record. An
; inactive sidebar tab prunes its whole subtree (uitree_emit's SIDEBAR gate),
; so a child here is visible exactly when the tab is, with nothing to switch.
n=sidebar_tab_10
p=fixed_shell
c=sidebar_tab_10
x=553
y=205
w=190
h=261
=
; The plugin launcher, inside the logout tab. AFTER the tab entry it hangs off,
; because a layout record resolves its parent by name against the records
; already read -- and after everything the cache mounts under that tab, so it
; draws on top of the logout interface rather than under it.
;
; Bottom of the 190x261 tab, clear of the centred logout panel above it; x
; centres the 144px button in the 190px tab.
n=manage_plugins_button
p=sidebar_tab_10
c=manage_plugins_button
x=23
y=205
w=144
h=36
