; Sidebar tab IFace mappings (LostCity_Server reference)
; Source: tabs.constant + login.rs2 initalltabs + interface.pack
; Tab 7 is unused (no server constant, no default if_settab).
;
; tabno | Name              | IFace (wire ID) | interface name
; ------|-------------------|-----------------|------------------
;     0 | Combat (unarmed)  | 5855            | combat_unarmed
;     1 | Stats             | 3917            | stats
;     2 | Quest journal     | 638             | questlist
;     3 | Inventory         | 3213            | inventory
;     4 | Equipment         | 1644            | wornitems
;     5 | Prayer            | 5608            | prayer
;     6 | Magic             | 1151            | magic
;     7 | (unused)          | -1              | —
;     8 | Friends           | 5065            | friends
;     9 | Ignore            | 5715            | ignore
;    10 | Logout            | 2449            | logout
;    11 | Options           | 904             | options
;    12 | Player controls   | 147             | controls
;    13 | Music             | 962             | music
;
; Tab 0 is dynamic by weapon at runtime (IF_SETTAB); static default is combat_unarmed.

; The gameframe this profile opens when nothing else names one -- no positional
; interface argument, no `interface_id` in a boot manifest. 84 is Lost City's
; gameframe and nothing else's, which is exactly why it belongs here and not in
; src/main.c: every other cache that fell through to the old literal opened
; whatever it happens to number 84.
[iface:boot]
id=84

; ---------------------------------------------------------------------------
; What this revision's CLIENT does -- as opposed to which id it does it to.
; ---------------------------------------------------------------------------
;
; This file is the profile for the whole 2004-era dat1 family: rev 254, rev 289
; and rev 377 all boot it. So anything that is true of the REVISION belongs
; here rather than in each of their three manifests, which is what these two
; sections are. A manifest `[features:boot]` still overrides -- manifest_rs377lc
; needs `mover=frame`, which is a statement about that world and not about this
; frame -- but nothing has to be repeated to stay in step.

; Client behaviour generation (src/features/features.h). `lostcity` is what a
; dat1 cache would have been derived as anyway; stated because a profile that
; says what it is beats one that is only ever inferred, and because the
; inference has exactly one dat1 answer while this family has three revisions
; in it.
[features]
era=lostcity

; ---------------------------------------------------------------------------
; The camera. This frame has no zoom, and that is not an omission.
; ---------------------------------------------------------------------------
;
; The 2004 client places the eye `pitch * 3 + 600` behind the player
; (Client-TS `camFollow`, called from the cycle with exactly that expression)
; and gives the player no way to change the 600. There is no wheel handler, no
; zoom setting, and no viewport-height interpolation -- the viewport is 512x334
; and cannot be anything else. `fixed:600` is that expression, and it is what
; stops this client offering a gesture the revision never had.
;
; controls= is the whole list, not an addition: arrow keys are the reference's
; own camera (keyHeld[1..4] -> orbit yaw/pitch velocity), and the middle button
; is this client's invention, so it is left out here.
;
; `fixed:` states more than the wheel. The later client's zoom is one mechanism
; (class159.method5357) driving BOTH the follow distance and the world
; projection scale, so a revision that says it has no zoom has said it has
; neither: the projection stays on the reference's constant 512 -- the bare
; `<< 9` in Client-TS dash3d/Model.ts -- instead of being recomputed from the
; viewport height. Recomputing it drew this frame at half magnification (a
; 335-high viewport lands on 256), which reads as an eye at twice the distance.
[camera]
zoom=fixed:600
controls=arrow_keys

