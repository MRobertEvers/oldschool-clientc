; maxlen and charset are this revision's, not the client's: a 254 username is
; 12 characters, and the charset is exactly what b12 has glyphs for -- a
; character the font cannot draw is one the server would be told about and the
; player could not see.
[component:login_username]
type=login_input
field=username
role=login_username
font=b12
color=0xffffff
prefix="Username: "
caret=@yel@|
caret_blink=40
maxlen=12
charset=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!"$%^&*()-_=+[{]};:'@#~,<.>/?\| 
w=200
h=15

[component:login_password]
