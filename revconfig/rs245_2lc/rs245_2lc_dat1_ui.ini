; --- screen 2: the credential form ----------------------------------------
; Two message lines on this era; a line left empty draws nothing rather than
; reserving its row.

[component:login_msg0]
type=login_message
index=0
font=b12
color=0xffff00
center=true
shadowed=true
w=1
