; ===========================================================================
; Title screen  [layout:title]
;
; Its own layout group, baked as its own tree (App_OpenTitleScreen) and refused
; by the gameframe's bake. Two trees rather than one with hidden branches,
; because these widgets repaint every frame -- a caret blinks -- and an
; always-dirty subtree left hidden inside the gameframe would defeat the emit
; retention gate for the whole in-game session.
;
; Every number is the reference's own (Client-TS titleScreenDraw / messageBox):
; the 765x503 panel, the 360x200 box at (202,171), a button sprite drawn at
; (centre-73, centre-20) with its label centred on (centre, centre+5).
;
; What is deliberately NOT copied is the hit testing. Client-TS draws from the
; box origin but hit-tests from the screen centre, and the two line up only
; because 765/2 happens to equal 202+180. Here a button's clickable area IS its
; layout box, so they cannot drift.
; ===========================================================================

[component:title_root]
type=rs_layer
w=765
h=503

; The backdrop: the cache's own photograph, half a screen mirrored into a
; whole one by the jpeg_panel decoder.
[component:title_backdrop]
type=sprite
sprite=title_background
w=765
h=503

[component:title_logo]
type=sprite
sprite=logo

; The two braziers. The fire is simulated host-side and arrives as a scene
; sprite; these say which side each is and where it burns. Hard against the
; panel edges, which is where the backdrop paints the braziers.
[component:title_flames_left]
type=title_flames
field=left
; Client-TS drawFlames: the fire's place inside the column, not the column's.
flame_bias=-22
flame_sway=-1
flame_run=128
flame_row=9
w=128
h=265

[component:title_flames_right]
type=title_flames
field=right
; Client-TS drawFlames: the fire's place inside the column, not the column's.
flame_bias=24
flame_sway=1
flame_run=103
flame_row=9
w=128
h=265

; The 360x200 panel every screen draws inside. Everything below is placed in
; its coordinates, which is why they match the reference line for line.
[component:title_box]
type=rs_layer
w=360
h=200

[component:title_box_bg]
type=sprite
sprite=titlebox

; --- one group per screen; C hides the ones that are not current -----------
[component:title_menu_group]
type=rs_layer
role=title_menu_group
w=360
h=200

[component:title_form_group]
type=rs_layer
role=title_form_group
w=360
h=200

; The form's buttons, in a layer of their own so the client can withdraw them
; while a submitted login is dialling (APP_SCREEN_CONNECTING): the form stays
; up -- its message lines carry "Connecting to server..." -- but Login and
; Cancel have nothing meaningful to do mid-handshake.
[component:title_form_buttons]
type=rs_layer
role=title_form_buttons
w=360
h=200

[component:title_info_group]
type=rs_layer
role=title_info_group
w=360
h=200

[component:title_progress_group]
type=rs_layer
role=title_progress_group
w=360
h=200

