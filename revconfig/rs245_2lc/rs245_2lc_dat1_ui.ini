; ===========================================================================
; What a login rejection means, in words.
;
; The reply CODE is protocol and lives in net/; these sentences are
; presentation and differ per revision, which is the split revconfig exists
; for. The wording is Client-TS's own (Client.ts `login()`), so a player sees
; what this revision's players saw.
;
; `screen` is the behavioural half: most codes leave the form up, but a couple
; belong on the info page. -1 (the default) leaves the screen alone.
;
; `default` answers any code not listed. `connect_failed` is the transport's
; own case -- a socket that never reached a server to be refused by it.
; ===========================================================================

