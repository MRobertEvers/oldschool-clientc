; Sidebar tab IFace mappings (LostCity_Server reference)
; Source: tabs.constant + login.rs2 initalltabs + interface.pack
; Tab 7 is unused (no server constant, no default if_settab).
;
; tabno | Name              | IFace (wire ID) | interface name
; ------|-------------------|-----------------|------------------
;     0 | Combat (unarmed)  | 5855            | combat_unarmed
;     1 | Stats             | 3917            | stats
;     2 | Quest journal     | 638             | questlist
;     3 | Inventory         | 3213            | inventory
;     4 | Equipment         | 1644            | wornitems
;     5 | Prayer            | 5608            | prayer
;     6 | Magic             | 1151            | magic
;     7 | (unused)          | -1              | —
;     8 | Friends           | 5065            | friends
;     9 | Ignore            | 5715            | ignore
;    10 | Logout            | 2449            | logout
;    11 | Options           | 904             | options
;    12 | Player controls   | 147             | controls
;    13 | Music             | 962             | music
;
; Tab 0 is dynamic by weapon at runtime (IF_SETTAB); static default is combat_unarmed.

; The gameframe this profile opens when nothing else names one -- no positional
; interface argument, no `interface_id` in a boot manifest. 84 is Lost City's
; gameframe and nothing else's, which is exactly why it belongs here and not in
; src/main.c: every other cache that fell through to the old literal opened
; whatever it happens to number 84.
[iface:boot]
id=84

; ---------------------------------------------------------------------------
; Semantic roles -- which NODE a name means on this frame.
; ---------------------------------------------------------------------------
;
; The `[iface:…]` sections above answer "which id is that interface"; these
; answer "which component is that ELEMENT", which is the question a plugin
; asks and the one no id can be written for by hand. @see ui/uitree_role.h.
;
; Only what cannot be said more directly lives here. The report button states
; its own role on its `[component:…]` section, because this profile built it;
; and the placeable regions (`viewport`, `minimap`, `safe`, …) need no binding
; at all, because they are the layout vocabulary and resolve through it.

; The logout panel is sidebar tab 10 -- interface 2449 mounted in the tab. By
; the tab NUMBER and not by that id: the mount is what a plugin means by "the
; logout screen is up", and it is also the node whose visibility follows the
; selected tab, which the id inside it does not.
[role:logout_screen]
match=slot(sidebar, 10)

; The Report abuse button, by the same name the OldSchool profile gives it, so
; a plugin that dresses it says `report_button` on both lanes and stops caring
; which one it booted on. Here it is the fourth filter button of the chat
; strip -- a frame-slot member, spelled through the filter's own name rather
; than its position, because a position is whatever order this revision
; happened to build in. A plugin arranging the frame (gameframe-layout) then
; declares this member's plate as a part under this name, and a plugin
; claiming the name takes over that plate.
[role:report_button]
match=slot(chat_buttons, report)

; ---------------------------------------------------------------------------
; The sidebar, named.
; ---------------------------------------------------------------------------
;
; Two families for two different things, because a player means two different
; things by "the inventory":
;
;   tab_<name>    the STONE you click. Stated directly on the
;                 [component:sideicon_…] sections above as `role=`, because
;                 this profile builds them.
;   panel_<name>  the interface MOUNTED behind that stone, found by the tab
;                 number through the sidebar's own numbering.
;
; The tab numbers are the whole content of these lines, and that is the point:
; "inventory is tab 3" is a fact about this REVISION, and it used to live as a
; bare 3 in whatever C or Lua wanted it. A plugin now asks for
; `panel_inventory` and never learns the number.
;
; Tab 7 has no entry because this revision has no tab 7 -- no server constant
; and no default if_settab -- and a role bound to it would be a name that can
; never resolve.

[role:panel_combat]
match=slot(sidebar, 0)

[role:panel_stats]
match=slot(sidebar, 1)

[role:panel_quests]
match=slot(sidebar, 2)

[role:panel_inventory]
match=slot(sidebar, 3)

