; No crop. compass.dat is 51x51 and the client never trims it: the rotated blit
; pivots on the sprite's own centre pixel (25,25) and the 33x33 compass widget
; box is what windows it (Client.ts minimapDraw plots 33x33 about 25,25). A crop
; here moves that pivot and clips the source, and at any yaw but north the
; corners of the box sample outside the window -- pixels the reference takes
; from the rest of the sprite.
[sprite:compass]
table=configs
archive=media
container=jagfile
index=index.dat
filename=compass.dat
format=pix32
atlas_index=0

