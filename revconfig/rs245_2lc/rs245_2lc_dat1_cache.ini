; -------------------------------------------------------------------------
; Sequences.
; -------------------------------------------------------------------------

; The standard human ready animation. Poses the design/local-player preview
; (clientCode 327/328) at frame 0 and holds it -- the reference poses the
; composite once (model.animate(SeqType.list[readyanim].frames[0])) and only
; spins modelYAn after that. Undeclared leaves the preview in its bind pose,
; which is what a wrong id looks like anyway. 808 is human_ready in every
; rs2-lineage cache, this one included.
[seq:human_readyanim]
id=808

; -------------------------------------------------------------------------
; Interfaces the CLIENT opens by itself, with no server packet naming them.
;
; The reference finds these by scanning every loaded interface for a component
; whose clientCode matches, then taking that component's layer. This client
; loads interfaces as per-id packs and has nothing to scan, so the answer the
; scan would give is stated here instead -- which is the same deal every other
; `[iface:...]` in this tree gets: the client knows what the interface is FOR,
; the profile knows which id it IS.
; -------------------------------------------------------------------------

; The welcome screen, on LAST_LOGIN_INFO. Two of them, and which one opens is
; not a preference -- they hold different rows:
;
;   welcome_screen         last-login line (clientCode 650) + unread count.
;   welcome_screen_notice  the same two, plus the three-line paragraph
;                          (clientCodes 652/653/654) that carries either the
;                          recovery-questions notice or the members-on-a-
;                          free-world warning.
;
; So the second one opens whenever there is a paragraph to show, and the first
; when there is not. RS_ClientCode_Tick fills every row in either.
[iface:welcome_screen]
id=5993

[iface:welcome_screen_notice]
id=6073

; -------------------------------------------------------------------------
; Vars the CLIENT reads by name.
;
; Same deal as the `[iface:...]` bindings: the client knows what a thing is
; FOR, the profile knows which id it IS. Both are read by the minimap-orbs
; plugin, which draws the hitpoints / run / special-attack orbs on a gameframe
; whose cache has none -- it cannot hardcode either number without being pinned
; to one revision. This file declared NEITHER until now, so on rev-254 the
; plugin fell back to a literal for both.
;
; Every id below was read off cache.rs254_zuk rather than copied from the
; rev-289 profile, because a dat1 interface id is flat and the two caches are
; free to disagree.
; -------------------------------------------------------------------------

; Special attack energy, 0..1000. Verified on this cache: interface 425 holds
; the weapon tab's special-attack bar (layer 7474), whose ten model segments
; 7476..7485 each carry `if1script cmp=3 operand=<N>99 code=5 300 0` -- a
; ten-step 0..1000 fill driven by varp 300 and nothing else.
[varp:special_attack_energy]
id=300

; The run toggle: nonzero while running. Decides whether the run orb wears the
; gold disc and the running boot or the grey disc and the standing one.
;
; Verified on this cache from the two buttons below, which are `buttontype=5`
; (select) with `if1script cmp=1 operand=<0|1> code=5 173 0`: the selected one
; is whichever matches varp 173, so 173 IS the run flag here.
[varp:run_mode]
id=173

; -------------------------------------------------------------------------
; Buttons the minimap-orbs plugin presses.
;
; An orb is a button in the reference, so it is one here -- but which component
; the gameframe puts that job on is a property of THIS world, and there is no
; name in any cache for "the thing the run orb should press". Stated here, like
; every other id the client has to know by number.
;
; LostCity's controls tab (interface 147) states run as a CHOICE rather than a
; switch: on this cache component 152 is the WALK stone (`cmp=1 operand=0`) and
; 153 the RUN stone (`cmp=1 operand=1`), both `button=5` on varp 173, and
; pressing the one already selected does nothing. So the orb is told both and
; presses whichever is not current. The pair sits at x=9 and x=53 y=44, 36x36,
; under the 'Move speed' / 'Walk' / 'Run' labels (components 158/160/159).
;
; No `orb_spec_button`: interface 425's special-attack bar is a READOUT -- its
; ten segments and its 'S P E C I A L  A T T A C K' caption all carry
; `button=0` -- so there is nothing on this cache for the spec orb to press,
; and the orb offers no verb rather than pressing something at random.
; -------------------------------------------------------------------------

[iface:orb_run_on]
id=153

[iface:orb_run_off]
id=152

; Semantic action bindings used by replacement gameframes/orbs. Keep the
; iface names above for older API/plugin compatibility; new code resolves and
; presses these live nodes atomically through ui.invoke_base.
[role:action_frame_orb_run_enable]
match=id(153)

[role:action_frame_orb_run_disable]
match=id(152)

; -------------------------------------------------------------------------
; No `[varbit:…]` sections, and that is a statement about the ERA rather than
; an omission.
;
; A dat1 cache has no varbit table at all: the 2004 protocol moves whole varps,
; and every conditional this cache expresses is an `if1script` reading a varp
; directly (`code=5 <varp> 0`, as the two run stones above do). So there is no
; id for this file to bind, and undeclared is already the right answer --
; `RevConfigRefs_Get(refs, "varbit", <anything>)` returns -1, every caller
; reads -1 as "this revision does not have that", and the feature switches off.
;
; The trap this heads off is adding one anyway by copying a dat2 profile's
; number across: a varbit id from OldSchool names nothing here, and the client
; would read whichever varp happens to be numbered the same.
; -------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Title screen art.
;
; These live in the title-and-fonts jagfile rather than the media one, which is
; what `archive=title` selects; that archive is already decoded by the time
; these load, because the four fonts come out of it and load first.
;
; group=title keeps them out of the gameframe's bake. The login screen's art is
; several hundred KB that an in-game session has no use for, and the reverse is
; equally true -- a title bake has no business pulling the whole in-game atlas.
; ---------------------------------------------------------------------------

[sprite:titlebox]
table=configs
archive=title
container=jagfile
index=index.dat
filename=titlebox.dat
format=pix8
atlas_index=0
group=title

[sprite:titlebutton]
table=configs
archive=title
container=jagfile
index=index.dat
filename=titlebutton.dat
format=pix8
atlas_index=0
group=title

