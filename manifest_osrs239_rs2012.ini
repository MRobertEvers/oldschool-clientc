; RS2012 QBD/Tormented Demons client lane, paired with the embedded mock230.
;
;   make -C src mock230-cache-rs2012 mock230-scripts mock230-servpack
;   ./run-live.sh manifest_osrs239_rs2012.ini testc test
;
; This manifest is intentionally separate from the ordinary OSRS239 profiles:
; the imported npc/loc/model ids exist only in the composed cache below. The
; embed handoff in main.c gives mock230 this same resolved cache path, so the
; world and client/JS5 cannot accidentally read different namespaces.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239.rs2012

[net:boot]
rev=osrs239
transport=embed
host=localhost
port=43595
client_version=239
user=testc
pass=test
; Enter the release-profile private arena immediately after login.
cheat=rs2012qbdmanifest
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=161

[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:layout:root]
c=gameframe
=
c=overlay

[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
chatbox_line_height=14

[features:boot]
era=osrs
ground_click_nearest=box10_rect
;
; The rest of the table this manifest does not state, commented out at the
; value the era already gives it — uncommenting one as written changes nothing,
; so each line is an edit point rather than a change. Keep the value alone on
; the line: bm_parse_int rejects trailing text, so `painter_draw_distance=40 ;
; wider` is a parse error, not a value. Full descriptions in
; src/features/features.h.
;
; Painter radius in tiles, 25..90 (deob class112.method3959). The osrs table
; says 32; Client-TS is fixed at 25.
;painter_draw_distance=32
; Permissive extension, off in every era table on purpose: 1 = when the box
; above finds no reachable tile, walk to the flooded tile nearest the click
; anyway instead of doing nothing.
;ground_click_unbounded=0
; Permissive extension: 1 = a click that hit no ground triangle at all (sky,
; the void ringing an instance's floor, a plane the filter refused) resolves to
; the scene tile nearest the cursor instead of walking nowhere.
;ground_click_offmap=0
