; Which canonical name each RSProt prot answers to: [server] PROT = PKT_NAME_<value>,
; [client] PROT = PKTOUT_NAME_<value>.
;
; One map for every revision, because a prot's NAME is stable across the
; revisions that carry it: where its layout moved, RSProt renamed it (_V1, _V2,
; ...), and the revision's codec for the name -- not this map -- knows the layout.
; tools/rev_exec_gen.py reads it to write each revision's executor
; (src/net/rev/osrs<N>/osrs<N>_exec.c).
;
; Several prots of one revision may share a canonical name (CAM_TARGET_V3 and
; _V4 at 238+, REBUILD_NORMAL_V1 and _V2 at 237): the name says what the packet
; DOES, and the executor decodes by prot. A prot with no row frames and drops.
; A row's name must have an adapter for the prot's message in
; src/net/proto/proto_adapt.h, or a message with no fields.

