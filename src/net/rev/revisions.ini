; The client's supported revisions, and what each carries that RSProt's prot
; table does not say. tools/rev_exec_gen.py writes one executor per section
; (src/net/rev/<section>/<section>_exec.c); a revision is supported by adding
; its section here and its table to 3rd/rsprot/spec/tables/.
;
;   appearance  the PLAYER_INFO appearance block's shape (pkt_player_appearance.h):
;               v4 two-byte model ids; v5 four-byte (237); v6 the obj
;               customisation self-delimiting by count (241). RSProx
;               PlayerInfoClient.decodeAppearance.
;   npc_info    the NPC_INFO_SMALL / _LARGE version the canonical arms decode
;               (240 carries v5 and v6 of both; the other has no arm).
;   login       the login driver (src/net/login/): RSProx's ClientLoginHandler
;               block at every revision here, with the client version the
;               revision states.

