<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: torirs: http://torirs.local https://torirs.local; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'">
  <title>ToriRS Plugin Chrome</title>
  <link rel="stylesheet" type="text/css" href="legacy-ie8.css">
</head>
<body>
  <table id="tpc-shell" class="tpc-shell tpc-collapsed" data-tpc-legacy="1" cellspacing="0" cellpadding="0" border="0" role="presentation">
    <tbody id="tpc-shell-body"><tr id="tpc-shell-row">
      <td id="tpc-pane-cell" class="tpc-pane-cell">
        <div id="tpc-pane" class="tpc-pane tpc-no-tabs">
          <div id="tpc-frame-tl" class="tpc-frame tpc-frame-tl"></div>
          <div id="tpc-frame-t" class="tpc-frame tpc-frame-t"></div>
          <div id="tpc-frame-tr" class="tpc-frame tpc-frame-tr"></div>
          <div id="tpc-frame-l" class="tpc-frame tpc-frame-l"></div>
          <div id="tpc-frame-r" class="tpc-frame tpc-frame-r"></div>
          <div id="tpc-frame-bl" class="tpc-frame tpc-frame-bl"></div>
          <div id="tpc-frame-b" class="tpc-frame tpc-frame-b"></div>
          <div id="tpc-frame-br" class="tpc-frame tpc-frame-br"></div>
          <table class="tpc-header" cellspacing="0" cellpadding="0" border="0" role="presentation">
            <tr><td><h1 id="tpc-title">Plugins</h1></td><td class="tpc-close-cell"><button id="tpc-close" type="button" title="Close plugin page">X</button></td></tr>
          </table>
          <div id="tpc-tabs" class="tpc-tabs"></div>
          <div id="tpc-content" class="tpc-content"></div>
        </div>
      </td>
      <td id="tpc-rail-cell" class="tpc-rail-cell">
        <div id="tpc-rail" class="tpc-rail">
          <div id="tpc-railframe-tl" class="tpc-frame tpc-frame-tl"></div>
          <div id="tpc-railframe-t" class="tpc-frame tpc-frame-t"></div>
          <div id="tpc-railframe-tr" class="tpc-frame tpc-frame-tr"></div>
          <div id="tpc-railframe-l" class="tpc-frame tpc-frame-l"></div>
          <div id="tpc-railframe-r" class="tpc-frame tpc-frame-r"></div>
          <div id="tpc-railframe-bl" class="tpc-frame tpc-frame-bl"></div>
          <div id="tpc-railframe-b" class="tpc-frame tpc-frame-b"></div>
          <div id="tpc-railframe-br" class="tpc-frame tpc-frame-br"></div>
          <div id="tpc-rail-list" class="tpc-rail-list"></div>
        </div>
      </td>
    </tr></tbody>
  </table>
  <div id="tpc-status" class="tpc-status"></div>
  <script type="text/javascript" src="codec-es3.js"></script>
  <script type="text/javascript" src="runtime-ie8.js"></script>
</body>
</html>
