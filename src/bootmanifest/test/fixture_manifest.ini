; Fixture for test-bootmanifest. Loaded with path "bootmanifest/test/..." so
; relative values join against "bootmanifest/test".
[cache:boot]
epoch=dat2
game=oldschool
revision=233
quirks=none
dir=some/cache
spawn=12,34

[net:boot]
rev=xrsps233
transport=ws
host=example.com
port=1234
ws_host=ws.example.com
ws_port=8080
client_version=233
scripts=compiled/scripts
rsa_exp=deadbeef
rsa_mod=cafef00d
jag_crc=0,1,2,3,4,5,6,7,8

[client:args]
arg=--offline
arg=--window
arg=1024x768
arg=--user
arg=Jane Doe
arg=--pass
arg=p;#&=, "quoted"
arg=--revconfig
arg=C:\Program Files\ui.ini

[js5:boot]
enabled=true
host=js5.example.com
port=43594
fallback_port=443
revision=233

[ui:boot]
logic=cs2
chrome=cache
revconfig_ui=/abs/ui.ini
revconfig_cache=rel/cache.ini
interface_id=161

[action:unlock_camera]
t=camera_unlock

[action:toggle_paint]
t=paint_toggle

[action:increase_paint]
t=paint_more
a=step=1

[action:spawn_test_npc]
t=spawn_npc
a=id=7343

[action:spawn_test_obj]
t=spawn_obj
a=id=1265

[action:spawn_test_spotanim]
t=spawn_spotanim
a=id=74,height=92,delay=0

[action:spawn_test_projectile]
t=spawn_projectile
a=model=3081,seq=659

[action:show_debug_overlay]
t=debug_overlay

[debug:hotkeys]
u=unlock_camera
i=toggle_paint
comma=increase_paint
8=spawn_test_npc
7=spawn_test_obj
5=spawn_test_spotanim
0=spawn_test_projectile
p=show_debug_overlay

[render:light]
actor_ambient=64
actor_attenuation=850
actor_light=-30,-50,-30
scene_ambient=64
scene_attenuation=768
scene_light=-50,-10,-50
npc_type_ambient_contrast=1
player_head_ambient=128

[features:boot]
era=server_routed
ground_click_nearest=box10_rect
ground_click_unbounded=1
ground_click_offmap=1
painter_draw_distance=90
