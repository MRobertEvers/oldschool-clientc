; Fixture: an [action:] whose t= no side-app answers. The loader no longer
; knows the names (the side-apps register them when the client starts), so
; the load succeeds and carries every declared t= -- bound or not -- into the
; config, where the boot refuses each one nobody answers. An empty t= can be
; no side-app's and still fails the load (fixture_action_empty_target.ini).
[cache:boot]
epoch=dat1
game=rs2
revision=254
quirks=none
source=ondemand
dir=some/cache

[net:boot]
rev=lc289
transport=tcp
host=example.com
port=43594

[action:bound_bad]
t=no_such_target
a=x=1

[action:unbound_bad]
t=also_no_such_target

[action:show_debug_overlay]
t=debug_overlay

[debug:hotkeys]
f1=bound_bad
f2=show_debug_overlay
