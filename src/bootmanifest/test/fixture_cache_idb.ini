; Fixture: a web world naming an IndexedDB database instead of a directory.
;
; `idb:<name>` is a cache LOCATION that is not a path. It must survive parsing
; unchanged -- not joined onto the manifest's directory, and not mistaken for a
; relative path by a native build that cannot use it.
[cache:boot]
epoch=dat1
game=rs2
revision=254
quirks=none
source=ondemand
dir=idb:torirs_cache/rs2/my-world

[net:boot]
rev=lc289
transport=tcp
host=example.com
port=43594
