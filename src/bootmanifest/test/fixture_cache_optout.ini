; Fixture: an ondemand world that states dir= EMPTY.
;
; That is the opt-out -- "stream every boot, write nothing down" -- and it has
; to survive the default, which only fills in silence. An empty value that fell
; through to the default would take away the only way to say this.
[cache:boot]
epoch=dat1
game=rs2
revision=254
quirks=none
source=ondemand
dir=

[net:boot]
rev=lc289
transport=tcp
host=example.com
port=43594
