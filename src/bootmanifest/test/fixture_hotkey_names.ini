; Fixture: [debug:hotkeys] key names are LibToriRS_KeyCodeFromName's -- the
; editor's hotkeys file and TORIRS_SIM_HOTKEY spell keys the same way. The
; keys added for the map editor (f1, lbracket, grave), the spellings older
; manifests use (enter, page_up, page_down), and case does not matter.
[cache:boot]
epoch=dat1
game=rs2
revision=254
quirks=none
source=ondemand
dir=some/cache

[net:boot]
rev=lc289
transport=tcp
host=example.com
port=43594

[action:show_debug_overlay]
t=debug_overlay

[debug:hotkeys]
f1=show_debug_overlay
lbracket=show_debug_overlay
grave=show_debug_overlay
enter=show_debug_overlay
page_up=show_debug_overlay
page_down=show_debug_overlay
F12=show_debug_overlay
pageup=show_debug_overlay
