; Fixture: an ondemand world that says nothing about WHERE to hydrate.
;
; The cache directory must then default to <home>/torirs_cache/<game>/<world>,
; which for this file is <home>/torirs_cache/rs2/fixture_cache_default -- the
; shape the 239 client uses (~/jagexcache/oldschool/LIVE) under our name.
; Before that default existed this manifest re-streamed its cache every launch.
[cache:boot]
epoch=dat1
game=rs2
revision=254
quirks=none
source=ondemand

[net:boot]
rev=lc289
transport=tcp
host=example.com
port=43594
