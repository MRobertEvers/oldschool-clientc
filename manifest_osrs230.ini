; Boot manifest: OSRS revision 230 (real Jagex protocol — TCP + ISAAC + RSA),
; against the local mock server (src/build/mock230). See rsprot (230 decoder)
; and docs/MULTI_GENERATIONAL_PARITY.md.
;
;   make -C src mock230 && src/build/mock230 &
;   src/torirs --manifest manifest_osrs230.ini --user testc --pass test
;
; Map (lX_Z) archives are still XTEA-encrypted at OldSchool 230 (the gate is
; revision >= 237). This cache ships xteas.json in the array form
; {archive,group,key[4]} that RSCache_XteaConfigLoadKeys reads.

[cache:boot]
epoch=dat2
game=oldschool
revision=230
quirks=none
dir=cache.osrs230

[net:boot]
rev=osrs230
transport=tcp
host=localhost
port=43595
client_version=230
; RSA public key matching the mock server's private key (mock decrypts the
; login block). E=10001; N is the mock's 1024-bit modulus.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[ui:boot]
logic=cs2
chrome=cache
interface_id=161
