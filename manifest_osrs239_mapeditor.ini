; Boot manifest: the world map editor, OSRS revision 239.
;
; ===========================================================================
; RUNNING IT — three modes, one manifest. The only line that differs between
; them is `panel=` in [editor:boot] below.
; ===========================================================================
;
; 1. NATIVE, panel in the same window          (panel=inprocess, the default)
;
;      make -C src
;      src/torirs --manifest manifest_osrs239_mapeditor.ini
;
;    The command panel is rows in the renderer's own window, drawn by
;    ToriRSChrome. Nothing outside this process is involved: no server, no
;    browser, no second binary. This is the mode to use unless you want the
;    world view to have the whole screen.
;
; 2. WEB, single tab                            (panel=inprocess)
;
;      make -C src servers && make -C src web
;      src/build/io_server --manifest manifest_osrs239_mapeditor.ini
;      # then open http://localhost:8088/
;
;    One process, not two: io_server serves build-web/ as static files
;    (`/` -> index.html) as well as answering the client's cache reads on
;    POST /io, so there is no second HTTP server to start. `--root` and
;    `--port` override the defaults if you need them.
;
;    That is the `web` lane, where every cache read is a POST to io_server.
;    The `web-idb` lane instead gives the browser its own cache over JS5 and
;    additionally needs js5_server — see docs/WEB_SERVERS.md for which lane
;    wants which server, and why the two are separate processes.
;
;    The same in-window panel, in the browser. The wasm client draws the
;    panel over its own canvas exactly as the native build does.
;
; 3. WEB, two tabs                              (panel=tab)
;
;      # edit the panel= line below to `tab`, then build and serve as in (2)
;
;    The canvas tab keeps the whole viewport and the panel opens as a second
;    tab running web/panel.html, talking to it over web/torirs_channel.js.
;    Worth the extra tab for the thing no in-page split can give you: the OS
;    hands the keyboard to whichever tab has focus, so typing a height into
;    the panel cannot fly the camera and WASD in the world cannot land in a
;    text field. The page can also open a second *canvas* tab on the same
;    channel (window.torirsOpenCanvasTab) for a second view of the world.
;
;    Allow popups for the origin, or the panel tab is blocked and you get an
;    editor with no chrome.
;
; `panel=tab` on a NATIVE boot fails at load with the reason rather than
; starting an editor whose panel silently never appears. A native second
; window would be a second process (src/platform/platform_sdl2.c holds exactly
; one window); that binding is designed but not built yet.
;
; This is an EDITOR boot, and the thing that makes it one is what it does not
; say: there is no [net:boot] section, so App_Init's networking phase never
; runs, `app->net_enabled` stays 0, and no socket, transport or packet decoder
; is constructed. The world still loads — the offline trigger in app.c fires as
; soon as the tree has a world viewport and there is no server to wait for —
; and the editor becomes the second writer of world state through the same
; seams the packet layer would have used.
;
; Build it WITHOUT EMBED_SERVER=1. The embedded mock server is a different
; answer to a different question (play the game with no network); an editor
; wants no server at all, embedded or otherwise.
;
; What the editor edits is the CONTENT TREE, not the baked cache. Squares are
; read from `maps/m<x>_<z>.jm2` / `.jl2`, seeded into the provider before the
; world load runs, and saved back as text. The bake below is therefore not in
; the editing loop: the editor cannot show you a stale square, because it never
; reads the bake for a square the content tree carries.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239
; Lumbridge. The editor opens here and loads the neighbours around it.
spawn=50,50

; ---------------------------------------------------------------------------
; The editor
; ---------------------------------------------------------------------------
;
; `content_dir` is what turns the editor on — it edits a content tree, so a
; tree is not one of its options, it is the thing it operates on.
;
; `repo_root` additionally allows baking. Baking is never a side effect of
; saving: saving writes the text sources and stops there, and the cache the
; game reads is rebuilt only when the user asks for it. Drop this line for a
; session that should not be able to bake at all.
[editor:boot]
content_dir=OSRS-Content/osrs239-content
repo_root=.
; Where the command panel is drawn: `inprocess` or `tab`. This is the one line
; that picks between the three modes at the top of this file — see there for
; what each one needs and why you would want it.
panel=inprocess

; The chrome sizes itself to the DISPLAY, not to this file: the shell reads the
; window's pixel density and picks the ToriRSChrome face baked for it (1x, 2x or
; 3x), so the editor's panels are the same physical size on a Retina screen as
; on an ordinary one -- drawn at native resolution rather than stretched up
; from a smaller buffer. Two env vars override it:
;
;   TORIRS_CHROME_SCALE=2   pin the chrome size (work on 2x chrome from a 1x
;                           display; also what a screenshot test wants)
;   TORIRS_HIDPI=0          give up the HighDPI drawable and render at window
;                           points, for a machine where the software rasteriser
;                           cannot afford four times the pixels
;
[ui:boot]
logic=cs2
chrome=revconfig
interface_id=548
; The canvas TRACKS the window: resizing (fullscreen included) resizes the
; soft3d screen buffer itself, so nothing is stretched -- more window is more
; world. `fixed` instead pins the classic frame and scales it up.
windowmode=resizable
; The chrome follows the canvas: ~500 rows of canvas per chrome step, so a
; fullscreen canvas gets 2x/3x panels drawn at native size (the baked scaled
; faces -- never upscaled pixels). Also takes 1..4 to pin a size;
; TORIRS_CHROME_SCALE overrides either.
chrome_scale=dynamic

; A world viewport has to exist in the tree or the world never loads: the
; offline trigger is gated on `world_view_valid`, which a CONTENT_WORLD (1337)
; node is what sets. TORIRS_WORLD_NODE_DEBUG=1 reports whether one was found.
[revconfig:component:world]
type=world

[revconfig:component:overlay]
type=debug_overlay

; Where projected world primitives land: loc highlight outlines, health bars,
; hitsplats. Without this component the overlay pass has nowhere to draw and
; every highlight silently renders nothing — which looks exactly like a broken
; highlight rather than a missing surface.
[revconfig:component:entity_overlay]
type=entity_overlay

[revconfig:component:cross]
type=cross
w=16
h=16

[revconfig:component:hovertext]
type=hovertext
font=496

[revconfig:component:minimenu]
type=minimenu
font=496

[revconfig:layout:root]
c=world
=
c=overlay
=
c=entity_overlay
=
c=cross
=
c=hovertext
=
c=minimenu

; ---------------------------------------------------------------------------
; Editing controls
; ---------------------------------------------------------------------------
;
; The loc editor panel is the editor's selection UI — it already knows how to
; pick a loc, read its exact scene x/z/angle, nudge and rotate it. `9` opens it.
;
; The free camera is the other half: an editor that can only look where the
; follow camera points cannot inspect what it is editing. WASD/RF flight
; (app_world_camera_keys, app.c) works as soon as these bindings exist, in
; or out of lock; `camera_unlock` additionally frees the arrow-key rotate,
; which otherwise drives the (nonexistent, offline) follow camera.
[action:loc_editor_toggle]
t=loc_editor_toggle

[action:camera_unlock]
t=camera_unlock

[action:map_editor_toggle]
t=map_editor_toggle

[action:camera_forward]
t=camera_forward

[action:camera_back]
t=camera_back

[action:camera_left]
t=camera_left

[action:camera_right]
t=camera_right

[action:camera_up]
t=camera_up

[action:camera_down]
t=camera_down

[debug:hotkeys]
9=loc_editor_toggle
8=map_editor_toggle
u=camera_unlock
w=camera_forward
s=camera_back
a=camera_left
d=camera_right
r=camera_up
f=camera_down

; ---------------------------------------------------------------------------
; Client-behaviour era
; ---------------------------------------------------------------------------
;
; Derived from the cache identity above (dat2 + oldschool -> `osrs`). Stated
; here only as an edit point; uncommenting as written changes nothing.
[features:boot]
;era=osrs
