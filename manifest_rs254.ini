; Boot manifest: old-gen LostCity rev 254 (Engine-TS) over TCP + ISAAC.
;
; One file collapsing the whole boot parameterization. Load with
;   ./src/torirs --manifest manifest_rs254.ini --user asdf --pass a
; Any explicit CLI flag overrides the matching manifest value.
;
; Relative path values (dir=, revconfig_ui=, revconfig_cache=) resolve against
; THIS file's directory; absolute paths pass through unchanged.

[cache:boot]
epoch=dat1
game=rs2
revision=254
quirks=none
dir=cache.rs254_zuk

[action:spawn_manifest_npc]
t=spawn_npc
a=id=1162

[debug:hotkeys]
8=spawn_manifest_npc

[net:boot]
rev=lc254
transport=tcp
host=localhost
port=43594
; Where a browser reaches the same server. A page has no TCP — the web build's
; sockets are WebSockets — and LostCity keeps its WebSocket on the *web* port
; (`/` upgrades there; 43594 is raw TCP only). WEB_PORT defaults to 80 on
; macOS/Windows and 8888 on Linux, so run a non-default one with
; TORIRS_WS_PORT=8888, which overrides this without editing the file.
ws_host=localhost
ws_port=80
client_version=254
; Login credentials, so `--manifest <file>` is the whole invocation. The dev
; server auto-creates the account (and grants staffmod 4, which is what makes
; ::~zuk work). --user / --pass on the command line still win. Without either,
; the client sends "guest" with an empty password and is rejected.
user=matt5
pass=zuk
; Login-block RSA key (hex). The env vars TORIRS_RSA_EXP / TORIRS_RSA_MOD still
; win over these; these in turn win over the built-in default pair.
rsa_exp=81f390b2cf8ca7039ee507975951d5a0b15a87bf8b3f99c966834118c50fd94d
rsa_mod=88c38748a58228f7261cdc340b5691d7d0975dee0ecdb717609e6bf971eb3fe723ef9d130e4686813739768ad9472eb46d8bfcc042c1a5fcb05e931f632eea5d
; 9 comma-separated big-endian int32 jag-archive CRCs (server-instance
; specific; `curl http://<host>/crc`). Env TORIRS_JAG_CRC wins, so run-live.sh
; keeps fetching them live. Left unset = zeros, and a CRC-checking server
; answers a zeroed login block with reply 6 ("client out of date").
;
; These are for the Zuk build of cache.rs254_zuk. They change every time the
; server's cache is rebuilt, so re-derive after a `bun run build` with either
;   curl -s http://localhost:8899/crc | xxd     (server up)
;   tools/jag_crc.py cache.rs254_zuk            (server down)
jag_crc=0,-945108033,540302689,531876099,2144669031,-2009763294,-1840622973,-87627495,392114586

[ui:boot]
logic=cs1
chrome=revconfig
revconfig_ui=v0/osrs/revconfig/configs/rev_245_2/rev_245_2_dat1_ui.ini
revconfig_cache=v0/osrs/revconfig/configs/rev_245_2/rev_245_2_dat1_cache.ini

; ---------------------------------------------------------------------------
; Client-behaviour era
; ---------------------------------------------------------------------------
;
; This manifest states nothing here, so the era is derived from the cache
; identity above: dat1 -> `lostcity`, the 2004 behaviour this tree was
; originally ported against. Every key is listed commented out at the value
; that derivation gives it, so uncommenting one as written changes nothing —
; each line is an edit point, not a change. Keep the value alone on the line:
; bm_parse_int rejects trailing text, so `painter_draw_distance=40 ; wider` is
; a parse error, not a value. Full descriptions in src/features/features.h.
[features:boot]
; lostcity | osrs | server_routed. Worth stating only when the *server*
; diverges from what the cache implies; a dat1 boot against the LostCity-era
; protocol does not.
;era=lostcity
; Unreachable ground/minimap click: ring3 (Client-TS's 3x3 ring, first tile
; with the lowest step count wins) | box10_rect (official OSRS, 21x21 ranked by
; squared distance to the target rect) | none. This era routes on the *client*,
; so this key alone decides it.
;ground_click_nearest=ring3
; Painter radius in tiles, 25..90 (the modern OSRS preference). Client-TS is
; fixed at 25, which is what the lostcity table's unset slot resolves to; 0 is
; not a legal value here, so state 25 rather than the table's sentinel.
;painter_draw_distance=25
; Permissive extension, off in every era table on purpose: 1 = when the ring
; above finds no reachable tile, walk to the flooded tile nearest the click
; anyway instead of doing nothing.
;ground_click_unbounded=0
; Permissive extension: 1 = a click that hit no ground triangle at all (sky,
; the void ringing an instance's floor, a plane the filter refused) resolves to
; the scene tile nearest the cursor instead of walking nowhere.
;ground_click_offmap=0
