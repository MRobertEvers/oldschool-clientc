; Boot manifest: old-gen LostCity rev 254 (Engine-TS) over TCP + ISAAC.
;
; One file collapsing the whole boot parameterization. Load with
;   ./src/torirs --manifest manifest_rs254.ini --user asdf --pass a
; Any explicit CLI flag overrides the matching manifest value.
;
; Relative path values (dir=, revconfig_ui=, revconfig_cache=) resolve against
; THIS file's directory; absolute paths pass through unchanged.

[cache:boot]
kind=dat1
dir=cache254.lostcity

[net:boot]
rev=lc254
transport=tcp
host=localhost
port=43594
client_version=254
; Login-block RSA key (hex). The env vars TORIRS_RSA_EXP / TORIRS_RSA_MOD still
; win over these; these in turn win over the built-in default pair.
rsa_exp=81f390b2cf8ca7039ee507975951d5a0b15a87bf8b3f99c966834118c50fd94d
rsa_mod=88c38748a58228f7261cdc340b5691d7d0975dee0ecdb717609e6bf971eb3fe723ef9d130e4686813739768ad9472eb46d8bfcc042c1a5fcb05e931f632eea5d
; 9 comma-separated big-endian int32 jag-archive CRCs (server-instance
; specific; `curl http://<host>/crc`). Env TORIRS_JAG_CRC wins, so run-live.sh
; keeps fetching them live. Left unset here = zeros (CRC-checking servers
; reject a zeroed login block).
;jag_crc=0,0,0,0,0,0,0,0,0

[ui:boot]
logic=cs1
chrome=revconfig
revconfig_ui=v0/osrs/revconfig/configs/rev_245_2/rev_245_2_dat1_ui.ini
revconfig_cache=v0/osrs/revconfig/configs/rev_245_2/rev_245_2_dat1_cache.ini
