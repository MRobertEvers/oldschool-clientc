; The map editor against the SHARED ToriRSMapEd daemon.
;
; Several editor clients can attach to one torirsmaped and see each other's
; edits live; the DAEMON's content tree is then the one being edited, not this
; process's. The launcher starts that daemon and stops it with the run.
;
; This profile is the second worked example of the rule, and it arrived by
; accident: manifests/manifest_osrs239_mapeditor_tcp.ini was written as a
; whole-file copy of the mapeditor manifest differing in exactly the two lines
; overridden below. That copy can be deleted — this file says the same thing
; without a second set of comments to keep in sync.
[profile]
description=map editor against the shared torirsmaped daemon
world=manifests/manifest_osrs239_mapeditor.ini
client=native
flavor=opt
services=torirsmaped

[service:torirsmaped]
port=43610

[override:editor:boot]
server=tcp
port=43610
