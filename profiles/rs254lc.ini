; The LostCity rev-254 world (dat1), on the local cache.rs254_zuk.
;
; The offline-capable half of the dat1 pair. `lc289` is the other: same cache
; lineage, different server build, and its cache comes off the server rather
; than out of this checkout. The two are not interchangeable -- 289 renumbers
; every wire opcode -- so a mismatch fails at login, not at anything that names
; the real problem.
;
; NO SERVICES. Nothing in this repo can serve a dat1 world: `torirsserver` is
; an osrs230/osrs239 server, and starting it on 43594 would either lose the bind
; race to whatever is there or win it and answer with a world from the wrong
; cache lineage. Either run a LostCity_Server on branch 254, or pass --offline
; and read the cache alone:
;
;   ./launch run rs254lc -- --offline
;
; A live run also needs the manifest's `jag_crc=` to match that server's cache,
; which is what `lc289` exists to stop being a problem: it reads its checksums
; off the same server it reads its cache from.
[profile]
description=LostCity rev-254 (dat1) over TCP — local cache, offline-capable
world=manifests/manifest_rs254lc.ini
client=native
flavor=opt
services=
