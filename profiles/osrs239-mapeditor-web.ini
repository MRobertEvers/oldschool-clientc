; The world map editor in a browser tab: ONE command, ONE URL.
;
;   make -C src web                       # once: the page (build-web/)
;   ./launch run osrs239-mapeditor-web    # then open http://localhost:8088/
;
; The page is a client of the NATIVE torirsmaped daemon, always: a browser
; has no filesystem, so the in-page editor server could not save the content
; tree, hold its lock, build packs or RUN (owner, 2026-11-02). Three
; processes, all this launcher's to start and stop:
;
;   torirsmaped  the editor server: owns the content tree and its lock, the
;                document and undo, BUILD and RUN into the live lane
;                build/live/default (the same lane the desktop editor uses),
;                and launches the lane's game server, js5_server and an
;                io_server for the play tab (TORIRSMAPED_LIVE_IO_*, below)
;   js5_server   the page's cache (cache.osrs239, over JS5 on 43595)
;   io_server    serves the page on 8088, and proxies /maped/ to the daemon
;                (--maped-port): the page's link to it, on its own origin.
;                A bare GET / is sent to the editor's command line
;                (bare_url=1), so http://localhost:8088/ is the whole URL.
;
; In the tab: the editor and its dock; Pop out opens a tab per panel on the
; same daemon; RUN saves, builds the packs and the client cache, reloads (or
; launches) the lane and opens the play tab, logged in as the lane's account.
; build= makes the lane's server binaries (the daemon launches them).
[profile]
description=world map editor in the browser (torirsmaped daemon + io_server), one URL
world=manifests/manifest_osrs239_mapeditor.ini
client=web
flavor=opt
services=torirsmaped, js5_server, io_server
build=torirsmaped, torirsserver, js5-server

[service:torirsmaped]
port=43610
live_dir=build/live/default

[service:js5_server]
port=43595

[service:io_server]
port=8088
root=build-web
maped_port=43610
bare_url=1

; The lane's own io_server serves RUN's play tab (build-web/ again, booted on
; the lane's play manifest and cache): any value switches it on.
[env]
TORIRSMAPED_LIVE_IO_MANIFEST=manifests/manifest_osrs239.ini
