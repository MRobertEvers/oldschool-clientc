; The same world as `osrs239`, but against a STANDALONE server over TCP.
;
; This profile is why manifests/manifest_osrs239_net.ini no longer needs to
; exist. That file was a whole-file copy of manifest_osrs239.ini differing in
; three lines; here those three lines are the overrides below, and the world
; stays one file with one set of comments to maintain.
;
; The cache differs too, and deliberately: a standalone server reads the baked
; content cache, not the pristine one.
[profile]
description=osrs239 world against a standalone ToriRSServer over TCP
world=manifests/manifest_osrs239.ini
client=native
flavor=opt
services=torirsserver

[service:torirsserver]
port=43596

; Nested sections use the same suffix. This deliberately repeats the default
; port as a copyable example; changing it here affects Windows only.
[service:torirsserver@windows]
port=43596

[override:cache:boot]
dir=../cache.osrs239.baked

[override:net:boot]
transport=tcp
port=43596

; Manifest overrides can be platform-specific too. The matching key replaces
; the base port while transport=tcp remains inherited.
[override:net:boot@windows]
port=43596

[session]
user=testc
pass=test

[override:chrome@windows]
executor=gdi
