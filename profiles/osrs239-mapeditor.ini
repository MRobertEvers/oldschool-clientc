; The world map editor, panel drawn in the renderer's own window.
;
; An editor boot states no [net:boot], so no game server is dialled — but it is
; still a client/server session: ToriRSMapEd owns the document, the undo
; history and the content-tree lock. The manifest's `server=embed` keeps that
; in-process; override it to `tcp` (below, commented) to attach several editor
; clients to one torirsmaped daemon and see each other's edits live. The
; launcher starts that daemon when the manifest asks for it.
[profile]
description=world map editor, in-process panel and MapEd
world=manifests/manifest_osrs239_mapeditor.ini
client=native
flavor=opt
; ToriRSMapEd runs in-process while the manifest says server=embed. Switching
; that override on below also means adding torirsmaped here.
services=

; [override:editor:boot]
; server=tcp
; port=43610

[override:chrome@windows]
executor=gdi
