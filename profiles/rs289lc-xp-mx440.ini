; LostCity rev-289 on XP **box B** — the GeForce4 MX 440 machine.
;
; Separate from `rs289lc-xp` because the two XP boxes are not interchangeable
; and the renderer choice is the thing that differs. `rs289lc-xp` runs
; `--soft3d`, which is the safe answer on any box; this one names the hardware
; and takes the GPU path, because on THIS card that is 2.9x cheaper per frame.
;
; See docs/xp_boxes.md. Identify the box by ComputerName, CPU stepping and GPU
; — never by 10.10.10.2, which is the far end of the point-to-point link and
; answers for whichever machine is plugged into it.
;
; ---------------------------------------------------------------------------
; The hardware this is written for
; ---------------------------------------------------------------------------
;
;   ComputerName  EVERS-B91DCE302, IBM ThinkCentre 8195E3U
;   CPU           Pentium 4 Northwood 2.80 GHz, Family 15 Model 2 Stepping 9
;                 ONE core, no HT — every ms of client CPU is a ms of frame
;   GPU           NVIDIA GeForce4 MX 440 with AGP8X (NV18),
;                 PCI\VEN_10DE&DEV_0181&SUBSYS_90301462&REV_A2
;   VRAM          64 MiB (67,108,864 bytes)
;   desktop       1024x768 @ 32 bpp
;
; VRAM read off the machine 2026-08-31, and the method matters: the registry
; alone is AMBIGUOUS here. `Control\Video` carries three HardwareInformation.
; MemorySize values across two adapters — the MX 440 at 64 MiB and a stale ATI
; Radeon HD 2600 Pro AGP at 512 MiB left behind by a previous card. Reading the
; largest, or the first, gives 512 MiB for a machine that has 64.
;
; What disambiguates is `HARDWARE\DEVICEMAP\VIDEO`, whose `\Device\Video0`
; names {5EF3D5A7-…} — the MX 440's key — confirmed by EnumDisplayDevices
; reporting that adapter ACTIVE and PRIMARY. Both agree on 64 MiB.
;
; ---------------------------------------------------------------------------
; Why --d3d9-zbuffer on a DirectX 7 card
; ---------------------------------------------------------------------------
;
; NV18 is not a cut-down GeForce4 Ti. It is a GeForce2-lineage core with
; GeForce4's memory controller: hardware transform-and-lighting, and NO
; programmable vertex or pixel shaders. DirectX 7 feature level under a 9.0c
; runtime.
;
; That is not a problem for this client, because this client's D3D9 renderer is
; fixed-function throughout — SetTextureStageState, no shaders — so the card
; runs the path it was built for rather than emulating one it was not. The
; measurements below are the evidence, not the expectation: all three renderers
; were run on this box against a live LostCity server.
;
; Measured 2026-08-31, rs289lc in-world, 25 s settle then a 30 s window,
; windowed (not TORIRS_WIN32_HIDDEN), cpu = GetProcessTimes on the client:
;
;   renderer          fps      cpu (1 core)   ms cpu/frame
;   --soft3d          48.8       77.5%           15.88
;   --d3d9            49.4       31.1%            6.29
;   --d3d9-zbuffer    49.0       27.3%            5.57      <- this profile
;   Java client       24.8       59.6%           24.03      (reference, for scale)
;
; All three ToriRS arms hold the 50 fps cap, so fps is the PACER and the number
; that separates them is the cpu they burn to hold it. On a one-core box that
; headroom is the whole point: soft3d leaves 22%, this leaves 73%.
;
; A caveat worth keeping: the first run after clearing the on-demand hydrating
; cache measures cache hydration, not rendering — archive reads are blocking
; socket calls inside the frame thread, and it read 27.8 fps at 33% cpu, which
; is neither the cap nor saturation. Warm the cache before believing a number.

[profile]
description=LostCity rev-289 on XP box B (GeForce4 MX 440, 64 MiB) — D3D9 z-buffer
world=manifests/manifest_rs289lc.ini
client=native
flavor=opt
windows_lane=win32
services=

; The server and the cache both live on the dev host at the other end of the
; link. `ws_port` is the on-demand/jag HTTP port, not a websocket.
[override:net:boot]
transport=tcp
host=10.10.10.1
port=43594
ws_host=10.10.10.1
ws_port=80

[override:io:boot]
host=10.10.10.1
port=8099

; The win32 lane draws through platform_win32gdi.c and has no SDL2 in its
; import table at all, so the GDI executor is the only one that exists here.
[override:chrome]
executor=gdi
borderless=1

[args]
arg=--d3d9-zbuffer

[session]
user=xpmx440
pass=zuk
