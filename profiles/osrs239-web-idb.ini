; The osrs239 world in a browser, with the cache in IndexedDB.
;
; Three processes. The web-idb lane gives the page its own cache behind a dat2
; facade, filled over JS5 rather than answered per-read by io_server — which is
; the whole reason js5_server is on the list here and absent from the plain
; `osrs239-web` profile.
[profile]
description=osrs239 in the browser, IndexedDB cache over JS5
world=manifests/manifest_osrs239.ini
client=web-idb
flavor=opt
services=torirsserver, io_server, js5_server

[service:torirsserver]
port=43594

[service:io_server]
port=8088
root=build-web

[service:js5_server]
port=43595

; A browser cannot host the in-process server, so the world's transport=embed
; is wrong here and has to be said so explicitly. emscripten maps connect() to
; ws://, and ws_host/ws_port are the keys that name where a BROWSER reaches
; the same server — BootManifest_ApplyWebEndpoint reads them on web builds
; only, so stating them changes nothing for a native boot of the same world.
;
; Without this the page loads, primes its cache, and then prints "this build
; has no embedded server" — a client with chrome and no world.
[override:net:boot]
transport=ws
ws_host=localhost
ws_port=43594

[override:chrome]
executor=web

[session]
user=testc
pass=test
