; The LostCity rev-289 world (dat1), against a LostCity_Server you start
; yourself.
;
; Named for the server BUILD, not the cache lineage. `rs254` is the other world
; on that lineage -- a local rev-254 cache, offline-capable -- and the two are
; not interchangeable: 289 renumbers every wire opcode, moves the four fonts to
; a different glyph layout, and adds a bit to the new-npc record. Pointing this
; profile at a 254 server, or that one at a 289 server, fails at login with
; "client out of date" rather than anywhere informative.
;
; The cache is the SERVER'S (`[cache:boot] source=ondemand`): jag archives over
; its web port, everything else over the 2004 on-demand protocol on its game
; port. Nothing is read from this checkout, so there is no local copy to keep in
; step and no `jag_crc=` to go stale.
;
; NO SERVICES, and that is the point. The world belongs to a LostCity_Server
; checkout (`node start.js` -> Start Server, or `npm start` in its engine/),
; which owns 43594 for the game socket and 80 for the web endpoint. This repo's
; own `torirsserver` carries a game world AND a JS5 stream on one socket, so
; starting it here would either lose the bind race or win it and answer the
; client with a world from a completely different cache lineage.
;
; The launcher prints a one-line note when nothing is listening on the
; manifest's port. That is the reminder to start LostCity first; it never
; blocks.
[profile]
description=LostCity rev-289 over TCP — external server, cache read on demand
world=manifests/manifest_rs289lc.ini
client=native
flavor=opt,asan
services=

; ASan is a macOS/Linux flavor and cannot follow this world to Windows: that
; lane is MinGW, and GCC ships no sanitizer runtime for the target at all, so
; the flag compiles and then the link fails on a missing libsanitizer.spec.
; Windows runs the same world uninstrumented rather than not at all; the
; launcher refuses `--flavor ...,asan` there by name, so nothing here is
; silently downgraded.
[profile@windows]
flavor=opt

[override:chrome]
borderless=1

[override:chrome@windows]
executor=gdi
