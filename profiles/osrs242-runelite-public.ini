; The LIVE osrs242 world -- the NUC's, behind its sign-in gate -- under the
; real OldSchool client: RuneLite 1.13.6 with the recompiled 242 gamepack.
;
; Nothing is started or prepared locally. run-runelite.sh points the client's
; sockets at the world's WebSocket, and the ToriRS sidebar panel signs it in
; (Sign in opens Chrome at the gate's approval page; the sign-in form there is
; the browser's own, so its password filler fills it). This one goes through the
; public proxy (wss://torirs.mrobertevers.com/ws), so the panel signs in to the
; mrobertevers.com IaP first, then the gate.
[profile]
description=the live osrs242 world through the public proxy (IaP + gate), under RuneLite 1.13.6
world=manifests/manifest_osrs242.ini
client=runelite
flavor=opt
services=

[env]
TORIRS_RL_LIVE=public

; The client is seeded from the pristine cache and fetches the groups the
; live lane changes (run-runelite.sh, LIVE). The manifest itself names the
; sparse cache, which a machine that never hydrated it does not have.
[override:cache:boot]
dir=../cache.osrs242
