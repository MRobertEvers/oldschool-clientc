; The LostCity rev-289 world in a browser tab.
;
; The same world as `rs289lc`, reached through the web (wasm) client instead of
; a native window. One process is ours -- io_server -- and the game server is
; LostCity's, started by you.
;
; ## What each half serves
;
; The two are not interchangeable, and the split is forced rather than chosen:
;
;   LostCity   the world (the game socket) and the cache.
;   io_server  the page, the module, the boot files, and a PROXY to that cache.
;
; The cache reaches the page through io_server because it cannot reach it any
; other way. Half of a dat1 cache is the 2004 on-demand protocol on the game
; port -- raw TCP, which a browser has no way to speak -- and the other half is
; eight jag archives served over HTTP with no Access-Control-Allow-Origin, so a
; page on this server's origin gets an opaque response it cannot read a byte
; of. So io_server holds the on-demand client (`[cache:boot] source=ondemand`
; in the world below is what turns it on) and answers
; `GET /cache/dat1/<table>/<archive>` off it. Nothing about the protocol is
; reimplemented in JavaScript: the proxy runs the same C the native client runs.
;
; The GAME socket is not proxied. `transport=ws` points the client's own
; connection at LostCity's web port, where a browser can reach it -- `/`
; upgrades there, while 43594 is raw TCP only.
[profile]
description=LostCity rev-289 in the browser (io_server proxies the cache)
world=manifests/manifest_rs289lc.ini
client=web
flavor=opt
services=io_server

[service:io_server]
port=8088
root=build-web

; A page has no TCP. emscripten maps connect() to ws://, and ws_host/ws_port
; are the keys BootManifest_ApplyWebEndpoint reads on web builds -- so this
; says where the BROWSER dials without disturbing a native boot of the same
; world. io_server reads the same pair for its proxy, so the two halves cannot
; end up pointed at different servers.
[override:net:boot]
transport=ws
ws_host=localhost
ws_port=80
; The nine login-block jag CRCs.
;
; The native sibling of this world does not state them: its C on-demand client
; reads them off the server (`GET /crc`) as part of the boot, which is the
; whole reason `[net:boot] jag_crc` is absent upstream. That path does not
; exist on this lane -- the browser has no on-demand client of its own, only a
; proxy -- so the login block would go out zeroed, and a zeroed block is
; answered with reply 6, "client out of date".
;
; They must equal what the server serves. Re-derive after any LostCity repack:
;   curl -s http://localhost/crc      (the authority; the trailing tenth int is
;                                      a checksum of the other nine, not sent)
jag_crc=0,-564448443,1613166846,123011849,-1710005394,-903407683,915347346,455063218,-1491954823

; The base manifest asks for `sdl` -- the plugin panel in a second OS window,
; which is what a 765x503 gameframe has room for natively. A tab has no second
; OS window; `web` is the same ToriRSChrome model drawn into the page.
[override:chrome]
executor=web

[session]
user=matt7
pass=zuk
