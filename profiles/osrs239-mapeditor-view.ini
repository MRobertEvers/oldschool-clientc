; A VIEWER window of the shared editor session: the world through the free
; camera, a thin toolbar, no panels. It joins the torirsmaped daemon that
; `./launch run osrs239-mapeditor-tcp` started (port 43610) as a view of
; that run's Client 1, so edits made in the editor window show here as they
; land. Start that profile first; this one declares no service of its own on
; purpose -- a service here would make the launcher free the port, which
; kills the daemon the editor window is attached to.
;
; The camera pose is `--camera x,z,level,yaw,pitch,zoom` (tiles absolute,
; yaw 0..2047); pass another after the profile name to look elsewhere:
;
;   ./launch run osrs239-mapeditor-view --camera 3231,3231,0,1024,350,1200
;
; docs/MAPED_STATUS.md "How to run it" has the same recipe by hand.
[profile]
description=viewer window of the shared map editor session (start -mapeditor-tcp first)
world=manifests/manifest_osrs239_mapeditor.ini
client=native
flavor=opt
services=

[args]
arg=--editor-view
arg=--maped
arg=tcp://127.0.0.1:43610
arg=--maped-group
arg=1
arg=--camera
arg=3222,3218,0,1024,350,1200

[override:editor:boot]
server=tcp
port=43610
