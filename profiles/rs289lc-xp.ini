; The LostCity rev-289 world, played from the Windows XP box.
;
; Same world as `rs289lc`, and the same manifest -- what changes is WHERE the
; server is. The base manifest says `localhost` because the ordinary way to run
; this world is on the machine the LostCity server is on. From the XP box
; `localhost` is the XP box, nothing is listening there, and the client reports
;
;     Socket recv error: connection closed
;
; over and over while sitting on the login/design screen. That failure looks
; exactly like a client bug and is not one -- it is this profile being absent.
; Every benchmark job under docs/d3d9 names
; `build/manifests/rs289lc-xp.ini`, which is the file the launcher GENERATES
; from this profile, so without it those jobs measure a client that never
; logged in.
;
;     ./launch run rs289lc-xp
;
; ## Both ports move, not just the game one
;
; This world reads its cache off the server too (`source=ondemand` in the base
; manifest), and that read goes to the WEB port, not the game port. So a
; profile that redirected only `host`/`port` would connect to the game and then
; try to stream nine jag archives from an XP box that has no web server -- a
; different failure, further along, and harder to read. `ws_host`/`ws_port`
; move with them.
;
; ## Reaching the dev host from the box
;
; The box sees the development machine as 10.10.10.1 (docs/d3d9/profiles.md).
; Whether that is enough depends on how the LostCity server binds:
;
;   * binds 0.0.0.0 (node's default for `app.listen(port)`) -- nothing else to
;     do, this profile is sufficient;
;   * binds 127.0.0.1 only -- run `python docs/d3d9/tcp_forward_lc289.py` on the
;     dev host, which bridges 10.10.10.1:{43594,80} to loopback. That is the
;     same problem torirsserver has, and tcp_forward_43596.py is the same
;     answer for the osrs239 lane.
;
; `netstat -an | findstr 43594` on the dev host answers which: a LISTENING line
; on 0.0.0.0:43594 needs no forwarder, one on 127.0.0.1:43594 does.

[profile]
description=Windows XP SSE2 client against a LostCity rev-289 server on the dev host
world=manifests/manifest_rs289lc.ini
client=native
flavor=opt
; The XP lane: `make winxp` -> PLATFORM=win32 OPT=1 -> src/torirs.exe,
; the same file build_winxp.ps1 produces and the same one pushed to the
; box. Without this the launcher builds win64 and runs
; src/torirs_win64.exe, which starts and plays and is not the binary
; this profile is named after.
windows_lane=win32
; None, and that is inherited from the world rather than an oversight: the
; server belongs to a LostCity_Server checkout that this repo neither builds
; nor starts. See profiles/rs289lc.ini, which says the same at more length.
services=

; The whole content of this profile. Four keys, all of them "the server is over
; there" -- see the header for why the web pair has to move with the game pair.
[override:net:boot]
transport=tcp
host=10.10.10.1
port=43594
ws_host=10.10.10.1
ws_port=80

; GDI, matching the other XP profile. The XP box has no SDL renderer path worth
; using and borderless keeps the 765x503 canvas free of a caption bar that
; would otherwise push the bottom rows off a small desktop.
; No [override:cache:boot]. The hydration directory used to be stated here as
; `../cache.rs289lc.sparse`, a path relative to the composed manifest, which
; put the streamed cache inside whatever directory the client was deployed to
; -- and lost it whenever that directory was replaced. It now defaults to
; ~/torirs_cache/rs2/rs289lc-xp -- the shape the 239 client uses for its own
; cache -- which is the user's and survives a redeploy, so there is nothing
; left for this profile to say. State `dir=` here again
; only to put THIS world's cache somewhere else; state it empty to stream
; every boot and write nothing down.

; Where the client fetches what is not beside it.
;
; The box has the binary and nothing else -- no script/ tree, so no plugin
; manifest, no plugin scripts and no shipped plugin assets. A client in that
; state comes up holding only the statically linked C plugins, and says nothing
; about it: a missing plugin manifest is deliberately silent. What that looks
; like is a minimap with no orbs, a sidebar with no tabs, and no FPS counter --
; three symptoms that read as rendering faults and are not.
;
; So it asks the dev host, the same machine the world and the cache come from,
; and asks only when something needs a file: the manifest at boot, then each
; plugin script it names, then each asset AS THE PLUGIN THAT WANTS IT ASKS.
; Nothing is fetched up front.
;
; Serve it from the repository root:
;
;     src/build/io_server --boot-root . --port 8099
;
; TORIRS_IO_SERVER=host:port still overrides this for a one-off run.
[override:io:boot]
host=10.10.10.1
port=8099

[override:chrome]
executor=gdi
borderless=1

[args]
; Renderer options (enable exactly one):
; arg=--d3d9
; arg=--d3d9-zbuffer
; arg=--soft3d
arg=--soft3d

; Deliberately NOT stated: --window and --windowmode. The interface is
; UITREE_LAYOUT_ROOT_W x _H = 765x503 and the window is built from the layout
; root, so saying nothing gets the right size. Stating a larger size does not
; letterbox the canvas -- UITree_LayoutSetRootSize takes the stated size when
; the mode is not fixed -- it makes the client render a bigger canvas and clear
; and blit the difference every frame, which is a measurement artifact that
; looks like a renderer cost.

[session]
; The dev server auto-creates the account. Give each concurrent run its own
; name: the world holds a hard-killed character for a while, and logging back
; in inside that window returns reply 5 and silently measures the login screen.
user=xp289
pass=zuk
