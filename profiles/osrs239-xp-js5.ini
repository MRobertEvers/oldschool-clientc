; Windows XP SSE2 native client with all server-side work hosted on the development
; machine.  The target starts with an empty cache.osrs239.sparse directory and
; progressively hydrates it from the dedicated JS5 service.
[profile]
description=Windows XP SSE2 client against host game, IO, and progressive JS5 services
world=manifests/manifest_osrs239.ini
client=native
flavor=opt
; The XP lane -- src/torirs.exe, PLATFORM=win32 OPT=1. This profile has
; always described an XP client and, until windows_lane existed, always
; built and ran the win64 one: the launcher hardcoded that binary on
; Windows with no way for a profile to say otherwise.
windows_lane=win32
services=torirsserver, io_server, js5_server

[service:torirsserver]
port=43596

[service:io_server]
port=8088
root=build-web

[service:js5_server]
port=43595
cache=cache.osrs239
revision=239

[override:cache:boot]
dir=../cache.osrs239.sparse

[override:net:boot]
transport=tcp
host=10.10.10.1
port=43596

[override:js5:boot]
enabled=true
host=10.10.10.1
port=43595
fallback_port=0
revision=239

[args]
; Renderer options (enable exactly one):
; arg=--d3d9
; arg=--d3d9-zbuffer
; arg=--soft3d
arg=--soft3d

[session]
user=testc
pass=test

[env]
TORIRSSERVER_CACHE=cache.osrs239
