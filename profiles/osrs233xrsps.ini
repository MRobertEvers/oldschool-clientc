; An external xrsps checkout's rev-233 cache, over a WebSocket transport.
;
; The manifest points at an absolute path outside this repo and dials a server
; that checkout runs, so this profile starts nothing of its own. `./launch
; doctor xrsps` is the quick way to find out whether that cache is still where
; the manifest thinks it is.
[profile]
description=external xrsps rev-233 cache over WebSocket
world=manifests/manifest_osrs233xrsps.ini
client=native
flavor=opt
services=
