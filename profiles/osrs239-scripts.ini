; Watch a driver script play itself: the everyday osrs239 client with a
; Scripts tab that lists every automated script in the tree.
;
;   ./launch run osrs239-scripts
;
; then log in with any name, open the Scripts tab on the plugin rail, pick a
; suite (All / Quests / Raids), search, pick a row, Play. Play logs you out,
; makes a FRESH account from the test's own fixture, logs it in and plays the
; test at real speed; Stop ends it at its next step. A test file is read again
; on every Play, so an edit to test/quests/<id>.lua or test/raids/<id>.lua runs
; on the next Play without restarting. test/raids/README.md "Watch it" and
; docs/minigames/raid_loop/DRIVER_NOTES.md "Watching a test: the Scripts tab"
; say what a watched run is and is not.
;
; This is osrs239.ini (the same world, the same embedded server, the same
; native client and flavor) plus:
;   * [derived:tests]: the launcher writes script/tests/tests.ini, the scripts
;     manifest the tab asks for through the IO layer (as the plugin host asks
;     for plugins/plugins.ini), from every tests directory
;     (tools/raid_gate/prepare_scripts.py TEST_SUITES), on every launch;
;   * the plugin manifest gains the quest driver and the Scripts tab
;     (script/plugins/script_runner.ini restates plugins.ini's entries and adds
;     the two; the native plugins are untouched), with this profile's OWN
;     plugin preferences file, so nothing here touches the everyday client's;
;   * TORIRS_DRIVE_ON_DEMAND=1 installs api.drive in this ordinary client, idle
;     until the tab's Play starts a script;
;   * the embedded server grants staff level 2, which the scripts' setup cheats
;     (::give, ::setlevel, ::tele) need, and keeps this profile's accounts in
;     build/quest_gate/watch_saves, apart from the everyday saves/. Play writes
;     each fresh account's save there (api.drive.play).
;
; NOT a test run, and nothing here changes one: tools/quest_gate/run.py builds
; its own binary and environment (dummy video, render skip, a frame cap,
; TORIRS_CONTENT_TEST) and never reads a profile. Never add
; TORIRS_CONTENT_TEST here: its clock waits for a test mailbox that a watched
; client does not have. Never add TORIRS_MAX_FRAMES or TORIRS_RENDER_SKIP:
; this profile is a real window at real speed.
[profile]
description=Lumbridge, embedded server, native client with the Scripts tab (watch a driver script play)
world=manifests/manifest_osrs239.ini
client=native
flavor=opt
services=

; As osrs239.ini: the pristine cache, and the server linked into the client.
[override:cache:boot]
dir=../cache.osrs239

[override:net:boot]
transport=embed
port=43595

; The scripts manifest (tools/launcher/profiles.py run_profile_derived): written
; before the client starts, read by the tab as the script item tests/tests.ini.
[derived:tests]
out=script/tests/tests.ini
command=tools/raid_gate/prepare_scripts.py --out {out}

; THE WINDOW A WATCHED TEST IS SHOWN IN (raid seam25, watched_client_mouse_mapping).
; The owner, 2026-10-05: "the mouse coords are WAYYY OFF" in this profile's default
; window on a Retina Mac, fixed for him by exactly these three: the software renderer,
; a 765x503 window, and no HighDPI drawable. They are pinned here so the one command
; needs no arguments, and because they are the window every test was GRADED in:
; tools/quest_gate/run.py renders soft3d at 765x503, 1x. A watched run now looks like
; what the test saw. The platform's pointer mapping is proved correct at 1x and 2x,
; pane open and closed (make -C src test-sdl-pointer-map; DRIVER_NOTES "Watching a
; test"), so the GPU/HighDPI window is not what is wrong with the mapping code; what
; produced "way off" there was not reproduced headless and is listed as an open item.
; The Scripts page is the macOS browser pane beside the frame: the window grows by
; the page (it never covers the 765x503 game area) and gives the width back on close.
[args]
arg=--soft3d
arg=--window
arg=765x503

[env]
TORIRS_HIDPI=0
TORIRS_PLUGINS=1
; This profile's own plugin settings (which tab is open, Screenshot off, ...),
; never the checkout's plugin_prefs.ini that the everyday client writes.
TORIRS_PLUGIN_PREFS=build/quest_gate/watch_prefs/plugin_prefs.ini
; Resolved under script/, like plugins/plugins.ini, the default it replaces.
TORIRS_PLUGIN_MANIFEST=plugins/script_runner.ini
TORIRS_DRIVE_ON_DEMAND=1
TORIRSSERVER_STAFF_LEVEL=2
TORIRSSERVER_SAVES=build/quest_gate/watch_saves
TORIRSSERVER_HOME=3222,3218
; A new name would otherwise start on Tutorial Island (3094,3106), where the
; scripts' setup fails: measured, `setup.::wield twisted_bow FAIL ... not worn`
; on a brand-new account. The home tile here is how a world opts out of the
; tutorial (src/torirsserver/torirs_server_boot.c): the new character starts in
; Lumbridge with the opening kit. It matters only for the name YOU log in with
; (if the Character Creator opens, Confirm it; measured 2026-10-05, a new name
; here showed none and Play logged it out); every account Play makes starts
; from its test's fixture, which has no tutorial and no creator.
TORIRSSERVER_TUTORIAL_HOME=3222,3218
