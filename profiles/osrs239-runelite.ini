; The osrs239 world under the REAL OldSchool client.
;
; This frontend DELEGATES to run-runelite.sh rather than being assembled here,
; and the reason is worth stating: that script owns three pieces of jar surgery
; (RSA modulus, jav_config host allowlist, the recompiled deob gamepack) and
; already manages its own server and jav_config processes with its own
; pidfiles. Deriving those two services here as well would put two supervisors
; on the same two ports. The launcher contributes the name, the profile, and
; the content preparation; run-runelite.sh keeps the rest.
;
; Pinned to RuneLite 1.12.33 — 1.12.34+ ships a rev-240 client.
[profile]
description=osrs239 under RuneLite 1.12.33 (delegates to run-runelite.sh)
world=manifests/manifest_osrs239.ini
client=runelite
flavor=opt
; Empty on purpose: run-runelite.sh starts the game server and jav_config
; itself, with its own pidfiles. Declaring them here would put two supervisors
; on the same two ports.
services=

; The manifest now boots a standalone server against the sparse cache, so
; this profile states the shape it actually wants instead of inheriting it.
; Overrides are applied before the launcher decides EMBED_SERVER, so naming
; the transport here is what links the server into the client.
[override:cache:boot]
dir=../cache.osrs239

[override:net:boot]
transport=embed
port=43595
