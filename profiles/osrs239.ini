; Lumbridge on the stock rev-239 cache, against its own services.
;
; The everyday profile. The world runs as TWO processes beside the client:
;
;   torirsserver  the game world, over TCP — a real server the client logs
;                 into, which is what makes it inspectable (its log is the
;                 world's log, `launch logs osrs239` reads it) and what lets
;                 it outlive a client restart.
;   io_server     POST /io cache reads and GET /boot/, the IO sidecar the
;                 non-embedded frontends ask for their files.
;
; It used to be transport=embed with `services=` empty — the server linked
; into the client (EMBED_SERVER=1), no port to collide with and no second
; process to stop. That is still exactly what `osrs239-torirs` and the lane
; profiles do; this one launches the pair instead.
[profile]
description=Lumbridge, standalone game server + IO server, native client
world=manifests/manifest_osrs239.ini
client=native
flavor=opt
services=torirsserver, io_server

[service:torirsserver]
port=43596

[service:io_server]
port=8088

; The client talks to the service above rather than to a linked-in server.
; `transport` is the whole of the switch: stated here, the manifest stays one
; file (the same reason osrs239-net carries its three lines as overrides).
[override:net:boot]
transport=tcp
port=43596

; Any profile section can carry an @windows, @macos or @linux overlay. Only
; keys stated in the matching section replace the base; world/client/flavor
; below remain inherited. These descriptions make the active overlay visible
; in `launch show osrs239` without changing how the world runs.
[profile@windows]
description=Lumbridge, standalone game server + IO server, native Win64 client

[profile@macos]
description=Lumbridge, standalone game server + IO server, native macOS client

[profile@linux]
description=Lumbridge, standalone game server + IO server, native Linux client

; [session]
; user=testc
; pass=test

; The native Windows build supplies the GDI chrome executor. macOS and Linux
; inherit the manifest's normal CS2 executor.
[override:chrome@windows]
executor=gdi
borderless=1

; Repeated keys are replaced as a group. For example, this would give Windows
; its own client argument list while other hosts keep the base [args] list:
;
; [args@windows]
; arg=--soft3d

; The manifest now boots a standalone server against the sparse cache, so
; this profile states the shape it actually wants instead of inheriting it.
; Overrides are applied before the launcher decides EMBED_SERVER, so naming
; the transport here is what links the server into the client.
[override:cache:boot]
dir=../cache.osrs239

[override:net:boot]
transport=embed
port=43595
