; Lumbridge on the stock rev-239 cache, server in-process.
;
; The everyday profile: nothing composed, nothing gated, no sidecar. The
; manifest's transport=embed means the server is linked into the client
; (EMBED_SERVER=1), so there is no port to collide with and no second process
; to stop.
[profile]
description=Lumbridge, embedded server, native client
world=manifests/manifest_osrs239.ini
client=native
flavor=opt
; Nothing to start: the manifest is transport=embed, so the server is
; linked into the client itself.
services=

[session]
user=testc
pass=test
