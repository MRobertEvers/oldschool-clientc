; Lumbridge on the stock rev-239 cache, server in-process.
;
; The everyday profile: nothing composed, nothing gated, no sidecar. The
; manifest's transport=embed means the server is linked into the client
; (EMBED_SERVER=1), so there is no port to collide with and no second process
; to stop.
[profile]
description=Lumbridge, embedded server, native client
world=manifests/manifest_osrs239.ini
client=native
flavor=opt
; Nothing to start: the manifest is transport=embed, so the server is
; linked into the client itself.
services=

; Any profile section can carry an @windows, @macos or @linux overlay. Only
; keys stated in the matching section replace the base; world/client/flavor
; below remain inherited. These descriptions make the active overlay visible
; in `launch show osrs239` without changing how the world runs.
[profile@windows]
description=Lumbridge, embedded server, native Win64 client

[profile@macos]
description=Lumbridge, embedded server, native macOS client

[profile@linux]
description=Lumbridge, embedded server, native Linux client

[session]
user=testc
pass=test

; The native Windows build supplies the GDI chrome executor. macOS and Linux
; inherit the manifest's normal CS2 executor.
[override:chrome@windows]
executor=gdi
borderless=1

; Repeated keys are replaced as a group. For example, this would give Windows
; its own client argument list while other hosts keep the base [args] list:
;
; [args@windows]
; arg=--soft3d
