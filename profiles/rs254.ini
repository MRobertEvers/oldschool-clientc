; The LostCity rev-254 world (dat1), against a LostCity server over TCP.
;
; A different cache lineage entirely — dat1, game=rs2 — which is what makes
; this a separate WORLD and so a separate manifest, rather than a profile of
; the osrs239 one.
;
; The manifest dials localhost:43594. Declare no services to run against a
; LostCity server you started yourself; the torirsserver line below starts this
; repo's own on that port instead.
[profile]
description=LostCity rs254 (dat1) over TCP
world=manifests/manifest_rs254.ini
client=native
flavor=opt
services=torirsserver

[service:torirsserver]
port=43594

[override:chrome@windows]
executor=gdi
