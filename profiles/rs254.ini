; The LostCity world (dat1), against a LostCity server you started yourself.
;
; A different cache lineage entirely — dat1, game=rs2 — which is what makes
; this a separate WORLD and so a separate manifest, rather than a profile of
; the osrs239 one. The world reads its cache OFF that server rather than out of
; a directory here (`[cache:boot] source=ondemand`), so there is nothing local
; to keep in step with it.
;
; NO SERVICES. The world this profile dials belongs to a LostCity_Server
; checkout you start yourself (`node start.js` -> Start Server, or
; `npm start` in its engine/), which owns port 43594 for the game socket and
; port 80 for the web/JS5-CRC endpoint. This repo's own `torirsserver` — which
; carries the game world AND the JS5 stream on one socket — must not be
; started here: it is an osrs230/osrs239 server and would either lose the bind
; race against LostCity or win it and answer the client with a world from a
; completely different cache lineage.
;
; So `services=` is empty on purpose. The launcher prints a one-line note when
; nothing is listening on the manifest's port, which is the reminder to start
; LostCity first; it never blocks.
[profile]
description=LostCity (dat1) over TCP — external server, cache read on demand
world=manifests/manifest_lostcity.ini
client=native
flavor=opt
services=

[override:chrome@windows]
executor=gdi
