; The scene benchmark suite: fixed cameras over fixed geometry, timed.
;
;   ./launch bench osrs239-bench                      every scene, soft3d
;   ./launch bench osrs239-bench --scene grand-exchange --shots
;   ./launch bench osrs239-bench --renderer soft3d,d3d9
;   ./launch bench osrs239-bench --baseline build/bench/osrs239-bench/<stamp>
;
; The scenes themselves live in the world, not here: manifests/
; manifest_osrs239_bench.ini declares one `[bench:<name>]` block per camera.
; This file is a WAY OF RUNNING that world -- which build, at what optimisation,
; with which services (none).
;
; `./launch run osrs239-bench` also works and boots one client at the manifest
; spawn, which is how you go and look at a scene by hand after a number moves.

[profile]
description=soft3d scene benchmark suite, offline, no server
world=manifests/manifest_osrs239_bench.ini
client=native
; OPT, always. A benchmark run against a -O0 build measures the compiler's
; register allocator, and the ranking it produces between two kernels does not
; survive being compiled properly. `--flavor` overrides this for the one case it
; is worth doing -- reading an asan or memtrace report from a bench scene.
flavor=opt
; Nothing to start. The world names no transport and no host, so the client
; never constructs a net subsystem and there is no server for it to miss.
services=

[profile@windows]
description=soft3d scene benchmark suite, offline, no server, Win64 client

[profile@macos]
description=soft3d scene benchmark suite, offline, no server, macOS client

[profile@linux]
description=soft3d scene benchmark suite, offline, no server, Linux client

; No [session]. There is nothing to log in to, so a user and password here would
; be two strings that look like they matter.

; Arguments every bench client gets, on top of the per-run renderer, canvas and
; window-mode flags the runner supplies. Stated here rather than hardcoded in
; the runner so that `./launch run osrs239-bench` -- the by-hand look at a scene
; -- boots the same client the numbers came from.
[args]
; No server, no login, no js5 producer: the frame loop and nothing else.
arg=--offline
; The frame loop as fast as it will go. Under the 50 fps pace the client
; normally keeps, most of every frame is the pacing sleep, and a renderer that
; got 20% faster moves no number at all.
arg=--uncapped

; The Win64 lane's chrome executor, matching every other native Windows profile:
; the frame this suite times should be the frame this machine actually draws.
[override:chrome@windows]
executor=gdi
borderless=1
