; The osrs239 world against a STANDALONE ToriRSServer over TCP, reading the
; sparse (JS5-hydrated) cache instead of a baked one.
;
; The difference from `osrs239-net` is one line — `dir=` — and it is the line
; that matters when a bug only shows up off the embedded transport. `osrs239-net`
; points at `cache.osrs239.baked`, which is a *content bake*: a cache with the
; tree's edits packed onto the pristine one. This profile points at
; `cache.osrs239.sparse`, the directory the JS5 client hydrates group by group
; (see docs/JS5_INCREMENTAL_CACHE.md). A sparse cache holds only what some run
; has actually asked for, so it is the lane where "the client never requested
; this archive" and "the server never served it" are visible at all — and where
; a name-keyed lookup (compass, mapscene, mapdots: everything the client
; resolves through the sprites reference table rather than by id) can find a
; named archive that is not resident.
;
; JS5 is deliberately NOT enabled here. With a producer attached, a missing
; group is fetched and the hole closes before anything can observe it; without
; one, the read fails and the client says so. `osrs239-xp-js5` is the profile
; that hydrates this same directory — run that first to fill it, then this one
; to see what a client sees with exactly those bytes and nothing more.
[profile]
description=osrs239 over TCP against a standalone ToriRSServer, sparse cache, no JS5
world=manifests/manifest_osrs239.ini
client=native
flavor=opt
services=torirsserver

[service:torirsserver]
port=43596

; The server's own default is `cache.osrs239` (TORIRSSERVER_CACHE_DIR_DEFAULT),
; which is the *client's* pristine lineage and not what this profile boots.
; One process must not quietly use two caches: the embedded transport forces
; this in main.c, and a standalone deployment has to say it.
[env]
TORIRSSERVER_CACHE=cache.osrs239.sparse

[override:cache:boot]
dir=../cache.osrs239.sparse

[override:net:boot]
transport=tcp
host=localhost
port=43596

[session]
user=testc
pass=test

; The native Windows build supplies the GDI chrome executor, as in every other
; osrs239 native profile.
