; osrs239 under AddressSanitizer + UBSan.
;
; Reach for this when the symptom is a visual glitch rather than a crash: ASan
; turns "it corrupts something occasionally" into a stack trace at the write
; that did it. Its own objdir and its own binary, so the ordinary src/torirs is
; never clobbered and the next unsanitized run rebuilds nothing. Expect ~2x
; slower and a much larger RSS.
[profile]
description=osrs239 with ASan+UBSan (own objdir, src/torirs_asan)
world=manifests/manifest_osrs239.ini
client=native
flavor=opt,asan
; Nothing to start: the manifest is transport=embed, so the server is
; linked into the client itself.
services=

[session]
user=testc
pass=test

[override:chrome@windows]
executor=gdi
