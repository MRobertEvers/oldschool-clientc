; osrs239 under AddressSanitizer + UBSan.
;
; Reach for this when the symptom is a visual glitch rather than a crash: ASan
; turns "it corrupts something occasionally" into a stack trace at the write
; that did it. Its own objdir and its own binary, so the ordinary src/torirs is
; never clobbered and the next unsanitized run rebuilds nothing. Expect ~2x
; slower and a much larger RSS.
[profile] 
description=osrs239 with ASan+UBSan (own objdir, src/torirs_asan)
world=manifests/manifest_osrs239.ini
client=native
flavor=opt,asan
; Nothing to start: this profile overrides the transport to `embed` below,
; so the server is linked into the client itself.
services=

[session]
user=testc
pass=test

[override:args@windows]
args=--soft3d

; The manifest now boots a standalone server against the sparse cache, so
; this profile states the shape it actually wants instead of inheriting it.
; Overrides are applied before the launcher decides EMBED_SERVER, so naming
; the transport here is what links the server into the client.
[override:cache:boot]
dir=../cache.osrs239

[override:net:boot]
transport=embed
port=43595
