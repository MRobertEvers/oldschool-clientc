; The osrs239 world in a browser tab.
;
; Two processes, both this launcher's to start, watch and stop. A page has no
; host filesystem, so the in-process server is not an option here: the game
; server runs beside io_server and the page reaches it over a WebSocket, while
; its cache reads go to POST /io.
[profile]
description=osrs239 in the browser (io_server + native server)
world=manifests/manifest_osrs239.ini
client=web
flavor=opt
services=torirsserver, io_server

[service:torirsserver]
port=43594

[service:io_server]
port=8088
root=build-web

; The world manifest boots against `cache.osrs239.sparse`, and this lane must
; not follow it there. A sparse cache is a CLIENT's: the directory a native
; client hydrates group by group over JS5, holding only what some run has
; already asked for. Nothing on this lane is that client -- the page's cache
; is in the browser. io_server opens this directory at startup, to answer /io
; and to report which cache it is serving beside the client's own, and pointed
; at a sparse dir that no run has ever hydrated it refuses to start at all.
;
; `osrs239`, `osrs239-asan` and `osrs239-runelite` state the same override for
; the same reason.
[override:cache:boot]
dir=../cache.osrs239

; A browser cannot host the in-process server, so the world's transport=embed
; is wrong here and has to be said so explicitly. emscripten maps connect() to
; ws://, and ws_host/ws_port are the keys that name where a BROWSER reaches
; the same server — BootManifest_ApplyWebEndpoint reads them on web builds
; only, so stating them changes nothing for a native boot of the same world.
;
; Without this the page loads, primes its cache, and then prints "this build
; has no embedded server" — a client with chrome and no world.
[override:net:boot]
transport=ws
ws_host=localhost
ws_port=43594

; The SERVER's cache is the pristine one, always and explicitly.
;
; It serves this lane's archives over JS5 (game and JS5 share one socket), and
; a server can only serve what it has: a sparse directory is a client's record
; of what some earlier run happened to ask for. Stated here so that neither the
; manifest's `[cache:boot] dir=` nor a TORIRSSERVER_CACHE left in the
; environment can point it somewhere else.
[env]
TORIRSSERVER_CACHE=cache.osrs239
