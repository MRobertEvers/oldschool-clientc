; Headless dump of the world map interface (595).
;
; Boots iface 595 as the tree root under the SDL dummy driver, runs its onLoad
; CS2 scripts, writes a frame and exits — the shape every interface-work
; capture wants, and one that terminates on its own rather than hanging.
[profile]
description=headless world map (595) interface dump
world=manifests/manifest_osrs239_worldmap.ini
client=headless
flavor=opt
; Nothing to start: an interface dump states no [net:boot] at all, so no
; server is dialled and none is needed.
services=

[env]
TORIRS_MAX_FRAMES=120
TORIRS_EXIT_BMP=build/worldmap/wm.bmp
TORIRS_DUMP_TREE=1
TORIRS_DUMP_BOUNDS=1

; Platform env sections inherit every base variable above and add or replace
; only the variables they state. The native Win32 backend uses this one to
; keep a headless capture from briefly showing a window.
[env@windows]
TORIRS_WIN32_HIDDEN=1

[override:chrome@windows]
executor=gdi
