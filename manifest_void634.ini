; Boot manifest: RuneScape 643 (the RS2 branch), world render only.
;
;   src/torirs --manifest manifest_rs643.ini --offline
;
; Spawn is set below (`spawn=51,51`). cache.643 ships XTEA keys for 1,591 loc
; squares and 50,50 (Lumbridge) is not among them — an unkeyed square renders
; terrain with zero locs. TORIRS_WORLD_MAP still overrides the manifest spawn.
; ---------------------------------------------------------------------------
; STATUS: terrain, locs and textures all render.
; ---------------------------------------------------------------------------
;
; Working: map terrain, underlays/overlays, loc instances -> scene elements, and
; procedural textures on those locs. Camera, level mask and roof check are
; byte-identical to the OSRS control.
;
; Cache-wide, **all 1164 textures** decode, are fully supported by the evaluator
; and bake to pixels. Measure it yourself:
;
;   make -C src test-proctex-coverage
;
; Baking is NOT the same as drawing, though: only 284 of the 1164 materials are
; SD-drawable (`valid` byte = rs-map-viewer's TextureLoader.isSd), and the SD
; client DROPS the rest — a face whose material is HD-only lights from its
; (usually recoloured, darker) face colour, and a terrain overlay falls back to
; its own HSL. Missing that rule rendered whole squares as a blanket of glaring
; white gravel while every decoder validated byte-exactly — see "The SD gate"
; under B18 in 3rd/rscache/EXCEPTIONS.md. CacheProvider_TextureIsSd is the gate;
; texture ids also run past 255 (234 SD materials do), which the engine's
; texture pipeline now accommodates (TORIDRAW_TEXTURE_ID_CAPACITY).
;
; All 57282 loc and 13636 npc records also decode with exact consumption; both
; types used to lose records to OldSchool-only field reads (B19 in
; 3rd/rscache/EXCEPTIONS.md).
;
; Model resizes apply on every path, mirroring the reference loaders:
;   loc   opcodes 65/66/67 -> apply_transforms (LocModelLoader.getLocModelData)
;   npc   opcodes 97/98 -> app_world_build_model scale(w, h, w) (NpcModelLoader);
;         note the dat2 npc decoder calloc's its struct, so the ToriRS adaptor
;         maps an absent opcode's 0 to the reference default 128 — copying it
;         verbatim collapses every unscaled npc to a point
;   obj   opcodes 110/111/112 -> both scene-bridge obj model builds, before
;         recolour (ObjModelLoader)
;   spot  resizeh/resizev -> app_world_build_spotanim_model (already present)
;
; Separate from all of those: VERSION-13+ MODELS ARE STORED AT 4x. decodeV1 ends
; with `if (version >= 13) scaleDown(2)`, and 26,174 of cache.643's 65,014
; models qualify (40.3% — versions 14 and 15; the other 38,840 have no version
; byte and read as version 1). Without the shift those render 4x too large;
; single-tile gravel spanning three tiles was the tell. It is per model, not
; per cache, so the header flag must be read each time — `test_rs2_sweep <root>
; modelvers` is the census.
;
; The rscache decoder keeps the raw values on purpose (the shift drops two bits
; and byte-exact round-trip is its validation bar); the ToriRS adaptor applies
; the shift, keyed on RSCache_Model.format_version — which
; RSCache_ModelNewCopy/NewMerge must carry, because the dat2 model task adapts
; a COPY. Settled by decoding model 1139 through rs-map-viewer headlessly and
; comparing vertex-for-vertex (ours (164,-34,-172) vs theirs (41,-9,-43):
; exactly >> 2).
;
; The comparison harness for all of this is 3rd/rscache/build/test_rs2_sweep:
;   test_rs2_sweep <root>                 corpus decode sweep (loc/obj/npc)
;   test_rs2_sweep <root> loc <id>        one loc config, bytes + decoded fields
;   test_rs2_sweep <root> model <id>      one model's interpreted geometry
;   test_rs2_sweep <root> spawns <x> <z>  a square's spawn tally, prolific first
;   test_rs2_sweep <root> materials [id]  material flags / SD-vs-HD census
;   test_rs2_sweep <root> modelvers       ob3 format_version census per cache
; rs-map-viewer's own loaders run headless for ground truth:
;   cd ~/Documents/git_repos/rs-map-viewer && npx tsx <script>  (see
;   scripts/cache/export-textures.ts for the shape; caches/rs2-643_2011-04-13
;   is the same cache as cache.643)
;
; A refused texture is deliberate, not a bug: an unported operation contributes
; flat mid-grey, and a texture built partly from that looks real while being
; wrong. Refusing it falls back to flat shading, which reads as "not done yet".
; TORIRS_STRIP_TEXTURES=1 forces that fallback everywhere, which is still the
; quickest way to confirm geometry independently of textures.
;
; Background: 643 uses PROCEDURAL MATERIALS (table 26), not the sprite-backed
; textures of table 9 that OSRS uses. Per rs-map-viewer's
; Dat2CacheLoaderFactory.getTextureLoader there are three texture systems —
; SpriteTextureLoader (oldschool, or runescape < 474), ProceduralTextureLoader
; (rev >= 474 with a materials index, which is 643), and
; OldProceduralTextureLoader. A 643 texture is a *program*: a DAG of up to 255
; operations evaluated to pixels on demand, effectively a small texture-shader VM.
; Selection is automatic and profile-driven, so OSRS and dat1 are unaffected —
; they log `textures: sprite-backed system`.
;
; Diagnostics for this pipeline (all env-gated):
;   TORIRS_TERRAIN_DEBUG  shape-tile counts + heightmap range
;   TORIRS_SCENERY_DEBUG  per-drop-reason counts, level/shape histograms,
;                         per-loc model extents
;   TORIRS_PAINT_DEBUG    painter commands by kind + camera state
;   TORIRS_FRAME_DEBUG    draws issued to the raster vs dropped
;   TORIRS_PROCTEX_DEBUG  which textures are refused and *why* — the four causes
;                         (unresolved dependency, unported operation, no output
;                         operation, cyclic graph) all reach the caller as the
;                         same "render failed", so they are named separately
;   TORIRS_PROCTEX_TRACE  every operation as it decodes (type, fields, inputs)
;   RSCACHE_NPC_DEBUG     npc opcodes with no handler (off by default: the
;                         known-gap cache.osrs239 hits it 13,784 times)
;
; Off-line texture tools, for checking the evaluator without booting the client:
;   make -C src test-proctex-coverage   coverage + bake over every texture
;   PROCTEX_DUMP=<dir>                  every baked texture as a BMP
;   PROCTEX_MONTAGE=<dir>               one sheet per operation, tiling the
;                                       textures that use it — the check that
;                                       actually validates a port, since a
;                                       transposed index still yields a valid
;                                       image of the wrong thing
;   PROCTEX_HEXDUMP=<id>                one texture's raw record bytes
;
; Models now decode — header byte 4 is a bitmask (face-render-types in bit 0,
; then particles / billboards / a preceding version byte), and a complex texture
; face is 15 bytes rather than 19. Before that fix 1795 of 3000 sampled 643
; models laid out past the end of their own file; all 65,014 now round-trip
; byte-exactly. Derived from rs-map-viewer's ModelData.decodeV1.
;
; History of the gaps that used to stop a 643 world loading — all four resolved,
; kept because each one records a trap rather than just a fix:
;
;   1. RESOLVED. Several types are their own TOP-LEVEL TABLE in 643, not config
;      groups: loc -> 16, enum -> 17, npc -> 18, obj -> 19, seq -> 20,
;      spotanim -> 21, varbit -> 22. The archives that looked "missing" from
;      table 2 had simply moved out of it, and the fan-out is NOT uniform —
;      loc/obj shard 256 files per group, npc/seq 128. Now answered per profile
;      by RSCache_RecordAddressFor.
;
;   2. RESOLVED. Overlay (flo) decode aborted on an assert. 643 overlay has nine
;      opcodes OSRS lacks, and underlay opcode 2 is a u16 where OSRS reads a
;      byte. Now CODEC_FLO_RS2.
;
;   3. DISPROVEN — this was never LZMA. Table 5 archives failed because
;      cache.643's xteas.json carries no key for l50_50/m50_50, and
;      ArchiveDecryptDecompress *returns false* for a bad decrypt whereas an
;      unknown compression byte would have *asserted*. Nothing needs vendoring.
;      This is why the default square below is 40,55 and not Lumbridge.
;
;   4. RESOLVED (D20). Terrain tile widths were gated on the container, so 643
;      took OSRS's post-209 u16 layout and desynced every square: 120 of 15,376
;      tiles survived instead of ~4,200. The gate is the era, not the container.
;
; References. rs-map-viewer (~/Documents/git_repos/rs-map-viewer) is
; authoritative for rendering and is TypeScript, so it is the one to reach for:
; ModelData.decode, SceneBuilder.decodeTerrain/decodeLocs, LocType.decodeOpcode
; and Dat2CacheLoaderFactory.getTextureLoader each carry the era gates explicitly
; (`revision >= 209`, `>= 582`, `>= 670`, `>= 474`), which is what makes it
; usable. ~/Documents/git_repos/void is a 643-era server with clean named
; decoders; note it is Kotlin, so browsing it wakes the IDE's Java language
; server and Gradle daemons.
;
; ---------------------------------------------------------------------------
; Cache identity
; ---------------------------------------------------------------------------
;
; All four fields are load-bearing. game=rs2 puts revision=643 on the RS2
; lineage so OldSchool thresholds never see it; epoch=dat2 selects the js5
; container. See 3rd/rscache/README.md "The revision model".

[cache:boot]
epoch=dat2
game=rs2
revision=643
quirks=void_rs634_no_xteas
; 643 ships its own xteas.json — RS2 dat2 encrypts map squares from revision
; 414 (the OldSchool >= 237 plain-storage gate does not apply). Encrypted map
; squares can decrypt from the cache once gap (3) above is resolved.
dir=cache.void634
; Spawn square. NOT cosmetic — see the note at the top of this file: cache.643
; ships XTEA keys for 1591 loc squares and 50,50 (the client default) is not one
; of them, nor are 49,49 / 50,49 / 51,49 / 51,50. Terrain is unencrypted, so an
; unkeyed square renders ground with ZERO locs, which looks like a renderer fault
; rather than missing keys. 40,55 is keyed. TORIRS_WORLD_MAP still overrides this.
; spawn=51,51

[ui:boot]
logic=cs2
chrome=cache
; 643's gameframe root, unverified for this era. The world render does not
; depend on it, and 643's interface era is itself not wired up — see "643 era
; never wired up" in 3rd/rscache/EXCEPTIONS.md.
;
; CS2 numbering: rev 634 puts SWITCH at wire opcode 51 (OSRS moved it to 60 and
; reused 51 for GET_VARC_LONG). The cache layer keeps raw wire opcodes; the VM
; speaks the canonical (OSRS) numbering, and CS2VM2_ScriptCopyFromRSCache
; translates under the RS2-on-dat2 dialect (see engine/cs2_opcode_dialect.h).
interface_id=548

; ---------------------------------------------------------------------------
; The login IF_OPENSUB burst
; ---------------------------------------------------------------------------
;
; 548 is a frame of empty slots. Every panel in it arrives from the server, one
; IF_OPENSUB per slot, right after the player spawns — so an offline client shows
; chrome around nothing. These are the mounts Void's rev-634 server sends, and
; they are its data, not a guess:
;
;   game/src/main/kotlin/content/entity/player/modal/GameFrame.kts   `list` +
;       `openGamframe`, run from interfaceOpen("toplevel*")
;   engine/.../data/AccountManager.kt spawn()   opens "toplevel" (= 548) at login
;   data/entity/player/modal/**/*.ifaces.toml   interface name -> id + type
;   data/entity/player/modal/interface_types.toml   type -> fixedIndex, i.e. the
;       component of 548 that type mounts into in fixed (non-resizable) mode
;
; `left = right` is `component of 548` = `interface id`. Order matches
; GameFrame.kts's list, because mounting order is the server's.
[ui:gameframe]
