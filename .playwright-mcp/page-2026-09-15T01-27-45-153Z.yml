      - generic [ref=f42e47]: Contact Twinco Electric
      - heading "Request an Electrical Estimate" [level=1] [ref=f42e50]
      - paragraph [ref=f42e52]: Contact Twinco Electric to request an electrical estimate and tell us what you are planning, what you have noticed, and where the property is located. Twinco Electric will review your request and follow up during normal business hours.
    - generic [ref=f42e55]:
      - generic [ref=f42e56]:
        - heading "Contact Twinco Electric for an Electrical Estimate" [level=2] [ref=f42e58]
        - generic [ref=f42e59]:
          - paragraph [ref=f42e60]: Use the form below to contact Twinco Electric with as much detail as you can. Helpful details include the property type, affected rooms or equipment, symptoms, project goals, and any known panel or electrical-service information. For an EV charger, generator connection, hot tub, remodel, new appliance, or commercial equipment request, include the model or electrical requirements when available.
          - paragraph [ref=f42e61]: Photos are optional, and Twinco can ask for anything else needed when we contact you during follow-up. To support an accurate electrical estimate, mention access limitations, tenant or contractor coordination, known deadlines, and whether the property is occupied. Do not open an electrical panel or handle damaged equipment to collect information.
