        - generic [ref=f42e85]:
          - heading "What Happens After an Electrical Estimate Request" [level=3] [ref=f42e87]
          - generic [ref=f42e88]:
            - paragraph [ref=f42e89]: After an electrical estimate request is submitted, Twinco Electric reviews the information provided and contacts you to clarify the project and timing. The review helps determine whether the next step is a phone conversation, a site evaluation, or a more detailed planning discussion.
            - paragraph [ref=f42e90]: Project scope matters. A repair request may begin with symptoms such as tripping breakers, dead outlets, flickering lights, heat, or unusual sounds. Installation and upgrade requests may require information about equipment, the existing panel, available breaker space, service capacity, wiring routes, and access. Larger projects may also involve permit, inspection, or utility coordination depending on the work and jurisdiction.
            - paragraph [ref=f42e91]: An electrical estimate is based on the information and conditions available during evaluation. Concealed conditions, equipment changes, access limitations, or customer-requested scope changes can affect the final work required. Twinco Electric can explain what was evaluated, what assumptions apply, and which next steps fit the project.
        - generic [ref=f42e92]:
          - heading "Electrical Emergency?" [level=3] [ref=f42e94]
          - paragraph [ref=f42e96]:
            - text: This form is not monitored continuously. For fire, smoke, active sparking, or downed power lines, move to a safe location and call 911 or your electric utility. For general outage preparation and safety information, review
            - link "Ready.gov’s power outage guidance" [ref=f42e97] [cursor=pointer]:
              - /url: https://www.ready.gov/power-outages
            - text: .
    - generic [ref=f42e100]:
      - generic [ref=f42e101]:
        - heading "Serving the Greater Kansas City Metro" [level=2] [ref=f42e103]
        - generic [ref=f42e104]:
          - paragraph [ref=f42e105]: Twinco Electric serves homeowners and businesses across the metro, including communities throughout Clay, Jackson, and Platte counties. Electrical estimate requests may cover troubleshooting, panel replacement, service upgrades, EV chargers, generators, lighting, surge protection, remodel wiring, new construction, hot tubs and pool equipment, or commercial improvements. Start with the problem or goal even if you are unsure which service category applies.
          - paragraph [ref=f42e106]:
            - text: Before submitting, check that the form includes a working phone number and email address, the correct property location, and a clear description of the request. If another person manages site access, include that context in the project details. This information does not replace an on-site evaluation, but it helps Twinco understand the electrical estimate request and prepare useful follow-up questions. You can also review Twinco’s
            - link "residential electrical services" [ref=f42e107] [cursor=pointer]:
              - /url: /services/residential-electrician-services/
            - text: or
            - link "commercial electrical services" [ref=f42e108] [cursor=pointer]:
              - /url: /commercial-electrical-services/
            - text: before submitting.
        - link "View All Service Areas" [ref=f42e110] [cursor=pointer]:
          - /url: /service-areas/
