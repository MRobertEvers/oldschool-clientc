                - paragraph [ref=f192e1087]: A Wicked Slumber creeps through the land of Eldraine, turning Magic’s beloved fairy tale world into something more . . . twisted.
                - paragraph [ref=f192e1088]: Set out into the Wilds and tell your own unique story featuring classic fairy tale characters like you’ve never seen before.
            - generic [ref=f192e1090]:
              - heading "A Tale Only You Can Tell" [level=3] [ref=f192e1091]
              - generic [ref=f192e1092]:
                - generic [ref=f192e1093]:
                  - paragraph [ref=f192e1094]:
                    - 'img "Wilds Of Eldraine: Bundle" [ref=f192e1095]'
                  - heading "Fight for Your Fairy Tale Ending" [level=4] [ref=f192e1096]
                  - paragraph [ref=f192e1097]: Build decks around your favorite fairy tale characters and tropes with powerful tools like the new roles and bargain mechanics. And show off your skills in true storybook fashion with the much-anticipated return of adventure cards and sagas.
                - generic [ref=f192e1098]:
                  - paragraph [ref=f192e1099]:
                    - 'img "Wilds Of Eldraine: Bundle" [ref=f192e1100]'
                  - heading "Enchanting Special Treatments" [level=4] [ref=f192e1101]
                  - paragraph [ref=f192e1102]: Add some fairy tale magic to your collection with Enchanting Tales cards from throughout Magic’s history—get at least one in every Draft and Set Booster or at least three in every Collector Booster.
                  - paragraph [ref=f192e1103]: And bring Eldraine to life with full-art showcase lands that look straight out of a colorful popup book—find one in some Draft and Set Boosters or get one Traditional Foil in every Collector Booster.
                - generic [ref=f192e1104]:
                  - paragraph [ref=f192e1105]:
                    - 'img "Wilds Of Eldraine: Bundle" [ref=f192e1106]'
                  - heading "What is a Bundle?" [level=4] [ref=f192e1107]
                  - paragraph [ref=f192e1108]: Bundles let you experience the set with a box full of cards and accessories.
                  - paragraph [ref=f192e1109]: Get 8 Set Boosters—the best packs to open just for fun—40 Basic Land cards to build decks rooted in the landscape of the set’s world, an exclusive Spindown die to keep track of your life total as you play, and a special box to store it all!
            - 'img "Wilds Of Eldraine: Bundle" [ref=f192e1112]'
