        - generic [ref=f192e1115]:
          - heading "Product Description" [level=2] [ref=f192e1118]
          - paragraph [ref=f192e1120]: Your next adventure awaits! This Wilds of Eldraine Bundle contains 8 Wilds of Eldraine Set Boosters—the best boosters to open just for fun—plus 1 Traditional Foil card with Bundle-exclusive alternate-art, 40 Basic Land cards (20 Traditional Foils and 20 nonfoils), 1 oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each Set Booster contains 12 Magic cards, 1 Art Card, and 1 token/ad card, or card from “The List” (a special card from Magic's history—found in 25% of packs), with a combination of 1–5 card(s) of rarity Rare or higher and 3–7 Uncommon, 3–6 Common, and 1 Land cards. Every pack contains at least 1 special Borderless card of rarity Uncommon or higher. The Land card is a Full-Art Land in 33% of packs and is Traditional Foil in 20% of packs. A Foil-Stamped Signature Art Card replaces the Art Card in 10% of Set Boosters.
