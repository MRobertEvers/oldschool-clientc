        - generic [ref=f141e1117]:
          - heading "Product Description" [level=2] [ref=f141e1120]
          - paragraph [ref=f141e1122]: "The Strixhaven: School of Mages Bundle contains 10 Strixhaven Draft Boosters, 2 land packs with 40 basic lands from the Strixhaven setting (20 in foil and 20 nonfoil), 1 foil alt-art promo card, 1 oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each of the 10 Strixhaven Draft Boosters contain 15 Magic cards and 1 ad/token or Helper Card (for use with Double-Faced Cards). Each pack contains 1 Mystical Archive card (Uncommon, Rare, or Mythic Rare), 1 Lesson card (Common, Rare, or Mythic Rare), 1 Rare or Mythic Rare, 3 Uncommons, and 9 Commons. A traditional foil card of any rarity replaces a Common in 33% of Strixhaven Draft Boosters, and a foil Mystical Archive Mythic Rare can be found in <1% of packs."
