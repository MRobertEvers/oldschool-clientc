        - generic [ref=f141e1061]:
          - separator [ref=f141e1062]
          - heading "From the manufacturer" [level=2] [ref=f141e1063]
          - generic [ref=f141e1066]:
            - generic [ref=f141e1068]:
              - 'heading "Strixhaven: School of Mages" [level=3] [ref=f141e1069]'
              - img "Strixhaven, Magic :the Gathering, mtg, STX" [ref=f141e1070]
              - heading "Which College Will You Choose?" [level=3] [ref=f141e1071]
              - paragraph [ref=f141e1072]: Welcome to Strixhaven, the Multiverse's most prestigious university for the study of magic!
              - paragraph [ref=f141e1073]: Founded centuries ago by five spellcasting dragons—Strixhaven is divided into five colleges that reflect their founder's magical specialty and distinctive personality.
              - paragraph [ref=f141e1074]: "Silverquill (Black/White): Stylish wordsmiths who master the magic of words, from inspiring battle poetry to biting arcane insults."
              - paragraph [ref=f141e1075]: "Prismari (Red/Blue): Artsy elementalists wielding fire and ice with spells that are spectacles of raw creativity."
              - paragraph [ref=f141e1076]: "Witherbloom (Green/Black): Witchy biologists who brew herbal concoctions to control the essence of life and death."
              - paragraph [ref=f141e1077]: "Lorehold (Red/White): Adventurous historians who bring the spirits of the past to life and call forth magic from ancient tomes."
              - paragraph [ref=f141e1078]: "Quandrix (Blue/Green): Quirky math magicians who study patterns and fractals to command and multiply the forces of nature."
              - paragraph [ref=f141e1079]: Choose your college and join the duel between schools for some friendly (and a tiny bit deadly) magical competition.
            - generic [ref=f141e1081]:
              - heading "Delve into the Mystical Archive" [level=3] [ref=f141e1082]
              - img "Mystical Archive" [ref=f141e1083]
              - heading "One Mystical Archive Card in Every Pack" [level=3] [ref=f141e1084]
              - paragraph [ref=f141e1085]: The Library of Strixhaven, also known as the Biblioplex, forms the center of Strixhaven University. Doorless, arch-shaped entrances welcome inquisitive minds into a library filled with impossibly-long hallways, archive chambers tall enough to have their own weather, and even pools and moat-passages that must be crossed by boat.
              - paragraph [ref=f141e1086]: The most famous feature of Strixhaven's library is the Mystical Archive—a collection of instant and sorcery spells from throughout space and time.
              - paragraph [ref=f141e1087]: Every Strixhaven Draft Booster contains one card from the Mystical Archive with striking art and a special showcase frame.
            - generic [ref=f141e1089]:
              - heading "Magic's First Instant & Sorcery-Focused Set" [level=3] [ref=f141e1090]
              - img "Strixhaven, Magic :the Gathering, mtg, STX" [ref=f141e1091]
              - heading "Knowledge is Power" [level=3] [ref=f141e1092]
              - paragraph [ref=f141e1093]: Strixhaven draws promising young mages from across the Multiverse to study in its halls, eager to learn new spells and hone their skills.
              - paragraph [ref=f141e1094]: Learn While You Duel
              - paragraph [ref=f141e1095]: "Strixhaven: School of Mages introduces the learn mechanic, which allows you to either put a Lesson card you own into your hand from outside the game or discard a card to draw one."
              - paragraph [ref=f141e1096]: Every Strixhaven Draft Booster includes one Lesson card, so you can develop new skills and grow more powerful as you duel.
              - paragraph [ref=f141e1097]: Practice Magecraft
              - paragraph [ref=f141e1098]: Strixhaven's professors can often (too often) be heard praising the benefits of practice. And most students would begrudgingly admit that they're right.
              - paragraph [ref=f141e1099]: Strixhaven also introduces cards with the magecraft mechanic. These cards give you special bonuses whenever you cast or copy an instant or sorcery spell, whether it's life gain or a +1/+1 counter.
            - generic [ref=f141e1101]:
              - heading "40 Basic Lands" [level=3] [ref=f141e1102]
              - img "Strixhaven, Magic :the Gathering, mtg, STX, lands" [ref=f141e1103]
              - heading "Explore Strixhaven University" [level=3] [ref=f141e1104]
              - paragraph [ref=f141e1105]: Tour Strixhaven's Five College Campuses
              - paragraph [ref=f141e1106]: Lights glowing amidst the mossy trees of Witherbloom's bayou. Dramatic waterfalls and swirling rock formations unique to Prismari. And ancient ruins scattered across the campus of Lorehold.
              - paragraph [ref=f141e1107]: "Explore each college's campus grounds with lands featuring two different pieces of art for each of Strixhaven's five colleges. The Strixhaven: School of Mages Bundle includes two packs of basic lands, one pack of 20 foils and one pack of 20 nonfoils."
            - generic [ref=f141e1109]:
              - img "Strixhaven, Magic :the Gathering, mtg, STX" [ref=f141e1110]
              - 'heading "About Magic: The Gathering" [level=3] [ref=f141e1111]'
              - paragraph [ref=f141e1112]: "Magic: The Gathering fuses playing cards and trading cards: players face off with decks they’ve built by selecting cards from a larger pool."
              - paragraph [ref=f141e1113]: That customization means every game plays out a little differently and makes Magic the deepest strategy card game there is. At every step, players must draw on their critical thinking skills to calculate the perfect strategy, predict the oncoming attack, and outwit their opponent.
              - paragraph [ref=f141e1114]: And it's more than cards. It’s stories. It’s art. It’s a community twenty-five years in the making, with players, fans, and artists from all around the world united by a love of the game.
