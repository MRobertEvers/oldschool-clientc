          - generic [ref=f251e1057]:
            - generic [ref=f251e1059]:
              - img "VOW" [ref=f251e1060]
              - heading "Toast to the Terrifying Bride" [level=3] [ref=f251e1061]
              - paragraph [ref=f251e1062]: “Our kin cheer this endless night like it’s some recompense, handed freely to every upstart with a ruffled shirt and a thirst. It is not ‘our turn.’ It’s mine.”—Olivia Voldaren
              - paragraph [ref=f251e1063]: As an eternal night falls upon Innistrad, Olivia Voldaren prepares to marry and claim ultimate power over the vampire elite.
              - paragraph [ref=f251e1064]: The decorations are ready, the vows have been written, and the humans cower in terror.
              - paragraph [ref=f251e1065]: RSVP with your preferred entrée blood type, and let the wicked revelry begin!
            - generic [ref=f251e1067]:
              - img "VOW" [ref=f251e1068]
              - heading "Dress to Impress" [level=3] [ref=f251e1069]
              - paragraph [ref=f251e1070]: A full guestlist of Innistrad’s vampire elite have arrived in their finest attire, and it’s going to be one wicked party.
              - paragraph [ref=f251e1071]: Showcase Fang Frames
              - paragraph [ref=f251e1072]: Collect Vampire cards with opulent alternate art, showcase frames, and a mean bite. Each showcase Vampire card in Crimson Vow is bordered by a frame of ornate columns and sharp, fang-inspired corners.
              - paragraph [ref=f251e1073]: Showcase Fang Frame cards can be found in some Crimson Vow Draft, Set, and Collector Boosters.
              - paragraph [ref=f251e1074]: Eternal Night Lands & Legends Return
              - paragraph [ref=f251e1075]: "With black and white alternate-art inspired by classic horror films—showcase Eternal Night cards are back in Innistrad: Crimson Vow."
              - paragraph [ref=f251e1076]: Embrace the beauty of darkness with ten more Eternal Night Full-Art Basic Lands and a creepy collection of Eternal Night legendary cards.
              - paragraph [ref=f251e1077]: One showcase Eternal Night Basic Land can be found in every Crimson Vow Draft, Set, and Collector Booster. The Eternal Night Land is a traditional foil in every Collector Booster and in 15% of Set Boosters.
              - paragraph [ref=f251e1078]: Eternal Night legendary cards can also be found in some Draft, Set, and Collector Boosters.
            - generic [ref=f251e1080]:
              - img "VOW" [ref=f251e1081]
              - heading "Dracula Series Cards" [level=3] [ref=f251e1082]
              - paragraph [ref=f251e1083]: Fight off the creatures of the night with the legendary vampire hunter, Abraham Van Helsing. Or fill the skies with a brood of vampire tokens under the command of the prince of darkness himself.
              - paragraph [ref=f251e1084]: "A collection of cards from Innistrad: Crimson Vow have been reimagined with alternate-art inspired by the world and characters of Bram Stoker’s Dracula—including a Count Dracula planeswalker card!"
              - paragraph [ref=f251e1085]: With every Crimson Vow Draft Booster Box, Set Booster Box, and Collector Booster Box, you’ll get one traditional foil box topper card from the Dracula Series.
              - paragraph [ref=f251e1086]: Dracula Series cards also appear in Collector Boosters—with at least one Dracula Series card in every Crimson Vow Collector Booster, and the possibility of up to two more in foil.
            - generic [ref=f251e1088]:
              - img "VOW" [ref=f251e1089]
              - heading "Sinister Themes" [level=3] [ref=f251e1090]
              - paragraph [ref=f251e1091]: Flaunt your power and play with Crimson Vow’s horror themes with the introduction of “Blood,” “Cleave,” and “Training.”
              - paragraph [ref=f251e1092]: "Blood: Create Blood tokens, then sacrifice them for a refreshing drink that triggers powerful abilities."
              - paragraph [ref=f251e1093]: "Cleave: Make your spells even more powerful by cleaving out the rules text in brackets that dares try to limit your ambitions."
              - paragraph [ref=f251e1094]: "Training: Become stronger by seeking out a challenge—whenever a creature with Training attacks a more powerful creature, their own power and toughness will grow with a +1/+1 counter."
