          - paragraph [ref=f251e1253]: "The Innistrad: Crimson Vow Bundle contains 8 Innistrad: Crimson Vow Set Boosters—the best boosters to open just for fun—plus accessories, with 40 basic lands (20 traditional foils and 20 nonfoils), 1 traditional foil promo card with Bundle-exclusive alternate-art—Sigarda’s Summons, 1 exclusive oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each Innistrad: Crimson Vow Set Booster contains 12 Magic cards, 1 Art Card, and 1 token, ad card, Helper card, or special card from Magic's history (a card from \"The List\"), with a combination of 1–4 Rares and/or Mythic Rares, 2–7 Uncommons, 3–8 Commons, and 1 Eternal Night Full-Art Basic Land card in every pack."
