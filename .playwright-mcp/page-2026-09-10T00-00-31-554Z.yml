        - generic [ref=f270e1321]:
          - heading "Product Description" [level=2] [ref=f270e1324]
          - paragraph [ref=f270e1326]: The Brothers’ War Bundle contains 8 The Brothers’ War Set Boosters—the best boosters to open just for fun—plus accessories, with 1 Universes Beyond Transformers card, 1 Traditional Foil Retro-Frame promo card with Bundle-exclusive alternate art—Queen Kayla bin-Kroog, 40 basic lands (20 Traditional Foils and 20 nonfoils), 1 oversized Spindown life counter (red or green), 1 card storage box, and 2 reference cards. Each The Brothers’ War Set Booster contains 12 Magic cards, 1 Art Card, and 1 token/ad card or card from “The List” (a special card from Magic's history—found in 25% of packs), with a combination of 1–5 card(s) of rarity Rare or higher and 3–7 Uncommon, 3–6 Common, and 1 Land cards. Traditional Foil Land replaces basic land in 20% of Set Boosters. Foil-Stamped Signature Art Card replaces Art Card in 10% of packs. Transformers card in 10% of Set Boosters.
