          - generic [ref=f270e1085]:
            - generic [ref=f270e1087]:
              - img "BRO Set Key Art A+" [ref=f270e1088]
              - heading "Visit the Past. Save the Future." [level=3] [ref=f270e1089]
              - paragraph [ref=f270e1090]: "Travel back in time and witness history in the making! The Brothers’ War is a new look at one of Magic’s classic tales: a battle between two brothers that shaped the future of the entire Multiverse."
              - paragraph [ref=f270e1091]: Wield powerful historical artifacts like colossal war machines and intricate Schematic cards. Are the lessons of the past enough to save the future?
            - generic [ref=f270e1093]:
              - img "BRO Set Booster Breakdown A+" [ref=f270e1094]
              - heading "Mighty Mechs & Inventive Mechanics" [level=3] [ref=f270e1095]
              - paragraph [ref=f270e1096]: Enter intense battles of titanic proportions with an army of magical mechs. Innovate with the introduction of the powerstone and prototype mechanics, and enjoy the return of fan-favorite mechanics meld and unearth.
              - paragraph [ref=f270e1097]: Full-Art Mech Basic Lands
              - paragraph [ref=f270e1098]: "Fill your battlefield with beautiful full-art landscapes featuring hulking mechs. A Full-Art Mech Land can be found in:"
              - paragraph [ref=f270e1099]: "Collector Boosters: 1 Traditional Foil in every pack"
              - paragraph [ref=f270e1100]: "Set Boosters: 1 Traditional Foil or nonfoil in 27% of packs"
              - paragraph [ref=f270e1101]: "Draft Boosters: 1 nonfoil in 25% of packs"
            - generic [ref=f270e1103]:
              - img "BRO Transformers A+ 3" [ref=f270e1104]
              - heading "Transformers Cards" [level=3] [ref=f270e1105]
              - paragraph [ref=f270e1106]: Become More Than Meets the Eye with double-sided Transformers cards!
              - paragraph [ref=f270e1107]: Your favorite Autobots and Decepticons can be found in The Brothers’ War Collector Boosters, Bundles, Gift Bundles, and some Set Boosters. (Not available in Draft Boosters.)
              - paragraph [ref=f270e1108]: "Collector Boosters: 1 Traditional Foil or nonfoil in every pack"
              - paragraph [ref=f270e1109]: "Set Boosters: 1 nonfoil in 10% of packs*"
              - paragraph [ref=f270e1110]: "Bundle: 1 nonfoil with every Bundle, plus the opportunity to find more in the included Set Boosters*"
              - paragraph [ref=f270e1111]: "Gift Bundle: 2 in every Gift Bundle (at least 1 Traditional Foil), plus the opportunity to find more in the included Set Boosters* *Generation 1 versions only"
              - paragraph [ref=f270e1112]: Shattered Glass Transformers Cards—Collector Boosters Only
              - paragraph [ref=f270e1113]: Shatter your expectations in a Transformers alternate universe where the heroic Autobots are evil and the villainous Decepticons are good.
              - paragraph [ref=f270e1114]: A Traditional Foil or nonfoil Mythic Rare Transformers card with Shattered Glass alternate art can be found in 12% of Collector Boosters.
            - generic [ref=f270e1116]:
              - img "BRO Wurmcoil A+ 4" [ref=f270e1117]
              - heading "Retro-Frame Artifacts" [level=3] [ref=f270e1118]
              - paragraph [ref=f270e1119]: Rediscover powerful artifact cards from Magic’s history reprinted with retro frames. You may even find the original schematics, with Retro-Frame Artifact cards featuring alternate art that showcases the inventor’s sketches and designs.
              - paragraph [ref=f270e1120]: "Collector Boosters: 3–4 Retro-Frame Artifacts in every pack, including at least 1 Schematic card."
              - paragraph [ref=f270e1121]: "Draft and Set Boosters: at least 1 Retro-Frame Artifact in every pack. Schematic card in 16% of packs."
              - paragraph [ref=f270e1122]: Double Rainbow Foil Serialized Schematic Cards—Collector Boosters Only
              - paragraph [ref=f270e1123]: Every Schematic Artifact has a serialized version with a special Double Rainbow foil treatment, each marked with a number out of 500 created (for example, “#1 of 500”).
              - paragraph [ref=f270e1124]: Collector Boosters are the only boosters that may contain a Serialized Schematic card, with 1 appearing in less than 1% of boosters.
