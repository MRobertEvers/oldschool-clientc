        - generic [ref=f266e908]:
          - heading "Product Description" [level=2] [ref=f266e911]
          - paragraph [ref=f266e913]: The Modern Horizons 2 Bundle contains 10 Modern Horizons 2 Draft Boosters, 2 land packs with 40 basic lands (20 traditional foils and 20 nonfoils), 1 traditional foil alt-art promo card, 1 oversized Spindown life counter, and 1 card storage box. Each Modern Horizons 2 Draft Booster contains 15 Magic cards and 1 token or ad card, with a combination of 1–2 Rares and/or Mythic Rares, 3–4 Uncommons, and 10 Common cards. A traditional foil card of any rarity replaces a Common in 33% of Modern Horizons 2 Draft Boosters. Traditional foil Retro-Frame Fetch Land in less than 1% of boosters.
