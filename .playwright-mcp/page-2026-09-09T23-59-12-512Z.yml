      - generic [ref=f266e866]:
        - generic [ref=f266e868]:
          - separator [ref=f266e869]
          - heading "From the manufacturer" [level=2] [ref=f266e870]
          - generic [ref=f266e873]:
            - generic [ref=f266e875]:
              - img "Modern Horizons 2 Banner" [ref=f266e876]
              - heading "Broaden Your Horizons" [level=3] [ref=f266e877]
              - paragraph [ref=f266e878]: Modern Horizons returns with a treasure trove of tools for Modern and Commander players to build, tinker, and perfect the decks of their wildest dreams. Showcase hoarder, spreadsheet theory crafter, squirrel deck Commander fan—no matter what type of Magic player you are, Modern Horizons 2 has something for you.
              - paragraph [ref=f266e879]: Get your hands on powerful cards designed for Modern, plus 42 New-to-Modern reprints, showstopping artistic treatments, and enemy color Fetch Lands! Now go build something awesome.
            - generic [ref=f266e881]:
              - img "Modern Horizons 2 Banner" [ref=f266e882]
              - heading "1–2 Rares or Mythic Rares in Every Pack" [level=3] [ref=f266e883]
              - paragraph [ref=f266e884]: Take a deep dive into Magic’s history and lore with callbacks to iconic cards and the return of classic Magic artists.
              - paragraph [ref=f266e885]: With at least one Rare or Mythic Rare card in every Draft Booster, you may score enemy Fetch Lands, quirky commanders, and cards designed to add explosive synergy to your favorite decks.
              - paragraph [ref=f266e886]: Fan-favorite characters also emerge from beloved books and comics, including the first planeswalker card featuring the tragic hero, Dakkon Blackblade.
            - generic [ref=f266e888]:
              - img "Modern Horizons 2 Banner" [ref=f266e889]
              - heading "Sketch Cards, Retro Frames & Borderless Cards" [level=3] [ref=f266e890]
              - paragraph [ref=f266e891]: Crack open a pack that could contain a Retro-Frame Fetch Land—reprinted for Modern with the original Magic frame. Rediscover a beloved planeswalker with beautiful, borderless art that fills the card. Or get a peek behind the scenes with showcase cards featuring the artist’s original, work-in-progress sketches. On some Sketch cards, you’ll also witness Magic in the making with flavor text revealing the creative art prompt that inspired it all—whether it’s detailed art directions or a mood the artist aimed to capture in their work.
              - paragraph [ref=f266e892]: Every Draft Booster has a possibility of containing Retro-Frame, Borderless, or showcase Sketch cards, and may even contain more than one! All three can be found in nonfoil or traditional foil, with a maximum of one foil card of any rarity per booster (none guaranteed).
            - generic [ref=f266e894]:
              - img "Modern Horizons 2 Banner" [ref=f266e895]
              - heading "Bundle Exclusives" [level=3] [ref=f266e896]
              - paragraph [ref=f266e897]: Packed with Bundle-exclusive accessories, the Modern Horizons 2 Bundle includes forty basic lands (twenty regular and twenty traditional foil), plus a special Spindown life counter featuring the set symbol.
              - paragraph [ref=f266e898]: It also includes one Yusri, Fortune's Flame card in traditional foil. With brilliant colors and a mischievous smile, this special alternate-art version is found only in Modern Horizons 2 Bundles.
            - generic [ref=f266e900]:
              - img "Modern Horizons 2 Banner" [ref=f266e901]
              - 'heading "About Magic: The Gathering" [level=3] [ref=f266e902]'
              - paragraph [ref=f266e903]: "Magic: The Gathering fuses playing cards and trading cards: players face off with decks they’ve built by selecting cards from a larger pool."
              - paragraph [ref=f266e904]: That customization means every game plays out a little differently and makes Magic the deepest strategy card game there is. At every step, players must draw on their critical thinking skills to calculate the perfect strategy, predict the oncoming attack, and outwit their opponent.
              - paragraph [ref=f266e905]: And it's more than cards. It’s stories. It’s art. It’s a community twenty-five years in the making, with players, fans, and artists from all around the world united by a love of the game.
