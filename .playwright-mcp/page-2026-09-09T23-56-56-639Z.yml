        - generic [ref=f173e1431]:
          - heading "Product Description" [level=2] [ref=f173e1434]
          - paragraph [ref=f173e1436]: The Adventures in the Forgotten Realms Bundle contains 10 Adventures in the Forgotten Realms Draft Boosters, 1 traditional foil alt-art promo card—Treasure Chest, 3 oversized dungeon cards (Tomb of Annihilation, Dungeon of the Mad Mage, and Lost Mine of Phandelver), 40 basic lands (20 traditional foils and 20 nonfoils), 1 oversized d20, 1 card storage box, and 2 reference cards. Each Adventures in the Forgotten Realms Draft Booster contains 15 Magic cards and a token or ad card, with 1 Rare or Mythic Rare, 3 Uncommons, 10 Common cards, and 1 Land card. A traditional foil card of any rarity replaces a Common in 33% of Adventures in the Forgotten Realms Draft Boosters. Traditional foil Mythic Borderless Planeswalker in less than 1% of boosters.
