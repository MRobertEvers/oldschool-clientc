      - generic [ref=f173e1064]:
        - generic [ref=f173e1066]:
          - separator [ref=f173e1067]
          - generic [ref=f173e1068]:
            - generic [ref=f173e1069]:
              - heading "From the manufacturer" [level=2] [ref=f173e1070]
              - generic [ref=f173e1073]:
                - generic [ref=f173e1075]:
                  - img "AFR" [ref=f173e1076]
                  - heading "Magic Joins the Party" [level=3] [ref=f173e1077]
                  - paragraph [ref=f173e1078]: "Magic: The Gathering and Dungeons & Dragons have partied up for a card set made in nerd heaven."
                  - paragraph [ref=f173e1079]: Delve into dungeons. Fill your battlefield with dragons. Cast iconic spells like Wish and Power Word Kill. Fight alongside the famous Drizzt Do’Urden or sign a contract with the infamous archfiend, Asmodeus.
                  - paragraph [ref=f173e1080]: Full of beloved D&D characters, monsters, and magic items—explore the storied D&D world of the Forgotten Realms in the deepest strategy card game there is.
                - generic [ref=f173e1082]:
                  - img "AFR" [ref=f173e1083]
                  - heading "Alt-Art Borderless Dragons" [level=3] [ref=f173e1084]
                  - paragraph [ref=f173e1085]: What’s Dungeons & Dragons without dragons? There's something special for every dragon in Adventures in the Forgotten Realms.
                  - paragraph [ref=f173e1086]: Whether it’s a sly green dragon, the legendary white dragon, Icingdeath, or Tiamat, the queen of evil dragons herself—every dragon card in the main set can be found with either regular or borderless art.
                  - paragraph [ref=f173e1087]: Bursting from their frames, borderless cards feature alternate art that fills the card, giving each dragon room to spread their wings and unleash their fearsome breath weapon.
                  - paragraph [ref=f173e1088]: Just hope it’s not on you.
                - generic [ref=f173e1090]:
                  - img "AFR" [ref=f173e1091]
                  - heading "Showcase Cards That Celebrate D&D History" [level=3] [ref=f173e1092]
                  - paragraph [ref=f173e1093]: Adventures in the Forgotten Realms also introduces two showcase card styles full of old-school D&D—Rulebook cards and Module lands.
                  - paragraph [ref=f173e1094]: Classic Monster Manual-Style Art
                  - paragraph [ref=f173e1095]: Beholders, owlbears, gelatinous cubes, and even the dreaded Tarrasque—collect Rulebook cards featuring the most beloved and feared monsters in Dungeons & Dragons with special alternate-art drawn in the style of classic D&D monster manuals.
                  - paragraph [ref=f173e1096]: Adventure Module-Style Lands
                  - paragraph [ref=f173e1097]: Packs may also include showcase land cards styled after D&D adventure module covers from the late ’70s and early ’80s. With bold, colorful alternate art—and guidance on appropriate character level—go on a Forgotten Realms adventure with a Rare, Uncommon, or Common Module land.
                - generic [ref=f173e1099]:
                  - img "AFR" [ref=f173e1100]
                  - heading "Venture into the Dungeon" [level=3] [ref=f173e1101]
                  - paragraph [ref=f173e1102]: Explore famous dungeons in search of treasure and glory. Adventures in the Forgotten Realms introduces a dungeon-delving keyword and three dungeons that seasoned D&D adventurers may recognize—Tomb of Annihilation, Dungeon of the Mad Mage, and Lost Mine of Phandelver.
                  - paragraph [ref=f173e1103]: When a card tells you to “venture into the dungeon,” you’ll use a special Dungeon card to mark your path. Choose which room to explore next, triggering that room’s effect as you enter.
                  - paragraph [ref=f173e1104]: Do you step into the Goblin Lair to create a 1/1 red Goblin creature token? Or explore the mine tunnels to create a Treasure token? Not only will you get perks for exploring, but some cards have abilities that reward your dungeon crawls.
                  - paragraph [ref=f173e1105]: Flavorful Card Abilities
                  - paragraph [ref=f173e1106]: Buff a creature with Bardic Inspiration. Gain life with a cleric’s Cure Wounds ability. Lend a helping hand with Clever Conjurer’s Mage Hand. Or leverage the Grim Wanderer’s Tragic Backstory to bring him onto the battlefield after a creature dies.
                  - paragraph [ref=f173e1107]: "Play Magic: The Gathering with cards full of playful references and flavorful Dungeons & Dragons-inspired abilities."
