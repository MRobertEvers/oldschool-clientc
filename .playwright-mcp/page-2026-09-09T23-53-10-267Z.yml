          - separator [ref=f78e1157]
          - heading "From the manufacturer" [level=2] [ref=f78e1158]
          - generic [ref=f78e1161]:
            - generic [ref=f78e1163]:
              - img "MTG Midnight Hunt" [ref=f78e1164]
              - heading "The Hunt Begins" [level=3] [ref=f78e1165]
              - paragraph [ref=f78e1166]: "The dark approaches with Innistrad: Midnight Hunt, the first of two full card set releases returning to the iconic gothic horror plane."
              - paragraph [ref=f78e1167]: It's time for the Harvesttide Festival, where the besieged humans of Innistrad hope to ward off the coming dark. Far beyond the village walls, werewolves and other horrors roam free.
              - paragraph [ref=f78e1168]: As the days get ever shorter, will you fight the creatures that lurk in the shadows... or become one?
            - generic [ref=f78e1170]:
              - img "MTG Midnight Hunt" [ref=f78e1171]
              - heading "Double-Faced Werewolf Cards" [level=3] [ref=f78e1172]
              - paragraph [ref=f78e1173]: Never trust a first impression on the plane of Innistrad—any creature you meet may have another, darker side.
              - paragraph [ref=f78e1174]: "Whether it’s werewolves or the humans determined to keep fighting them—even after death—Innistrad: Midnight Hunt is full of double-faced cards."
              - paragraph [ref=f78e1175]: All of the werewolf creature cards in Midnight Hunt are double-faced cards, plus a double-faced planeswalker card for legendary local werewolf, Arlinn.
              - paragraph [ref=f78e1176]: On one side, you’ll meet the werewolf’s human form, but flip the card over and you’ll unleash the beast that lies within.
            - generic [ref=f78e1178]:
              - img "MID Midnight Hunt" [ref=f78e1179]
              - heading "Showcase Cards—Harvesttide & Classic Horror" [level=3] [ref=f78e1180]
              - paragraph [ref=f78e1181]: Showcase Eternal Night Cards
              - paragraph [ref=f78e1182]: Collect cards with black and white art inspired by classic horror films.
              - paragraph [ref=f78e1183]: "All Innistrad: Midnight Hunt Draft, Set, and Collector Boosters contain one Showcase Full-Art Eternal Night Basic Land with stylized black and white art and a special high gloss treatment that makes their pin lines and mana symbols shine."
              - paragraph [ref=f78e1184]: You may also find Showcase Eternal Night legendary creatures in some Draft, Set, and Collector Boosters!
              - paragraph [ref=f78e1185]: Showcase Equinox Cards
              - paragraph [ref=f78e1186]: Showcase Equinox cards feature frames draped with decorations for the Harvesttide festival, and ornate linework colored to perfectly complement their striking alternate-art.
              - paragraph [ref=f78e1187]: Every Werewolf and Warlock card in the set has both a regular and Equinox version. Collector Boosters contain at least three of these showcase Equinox cards in every pack, and may contain up to five. Equinox Werewolf and Equinox Warlock cards can also be found in some Draft and Set Boosters.
            - generic [ref=f78e1189]:
              - img "Midnight Hunt MTG" [ref=f78e1190]
              - heading "Horror-Themed Mechanics" [level=3] [ref=f78e1191]
              - paragraph [ref=f78e1192]: "Sink your teeth into Innistrad: Midnight Hunt’s gothic themes with horror-inspired mechanics."
              - paragraph [ref=f78e1193]: "Daybound/Nightbound: Werewolves look just like any other human during the day, but as the moon rises, you’ll see them transform."
              - paragraph [ref=f78e1194]: Cards with the Daybound/Nightbound mechanic are double-sided cards with one side that surfaces in the Day and another side that takes over at Night.
              - paragraph [ref=f78e1195]: Whether it’s Day or Night depends on how many spells a player has cast on their turn—cast none, and it becomes Night next turn. Cast at least two, and next turn the sun will rise on a new Day.
              - paragraph [ref=f78e1196]: "Coven: Gather your coven to battle the darkness together—the “coven” keyword grants benefits for controlling three or more creatures with different powers at the start of combat on your turn."
              - paragraph [ref=f78e1197]: "Disturb: With their home in such danger, even Innistrad’s dead can’t rest. Double-sided creature cards with “disturb” can be cast from your graveyard for their disturb cost—returning to the battlefield transformed into Spirits."
              - paragraph [ref=f78e1198]: "Decayed: Summon waves of decayed zombies that fall apart in battle—a creature with “decayed” cannot block and, when it attacks, must be sacrificed at the end of combat."
