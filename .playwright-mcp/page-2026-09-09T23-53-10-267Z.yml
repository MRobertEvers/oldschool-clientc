        - generic [ref=f78e1506]:
          - heading "Product Description" [level=2] [ref=f78e1509]
          - paragraph [ref=f78e1511]: "The Innistrad: Midnight Hunt Bundle is the first Magic Bundle to include Set Boosters—the best boosters to open just for fun. Each box contains 8 Innistrad: Midnight Hunt Set Boosters plus exclusive accessories, with 40 basic lands (20 traditional foils and 20 nonfoils), 1 traditional foil alt-art promo card—Triskaidekaphile, 1 oversized glow-in-the dark Spindown life counter, 1 card storage box, and 2 reference cards. Each Set Booster contains 12 Magic cards, 1 Art Card, and 1 token, ad card, Helper card, or special card from Magic's history (a card from \"The List\"), with a combination of 1–4 Rares or Mythic Rares, 2–7 Uncommons, 3–8 Commons, and 1 Eternal Night Full-Art Basic Land card in every pack."
