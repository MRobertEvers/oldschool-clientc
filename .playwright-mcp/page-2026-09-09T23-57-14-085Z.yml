      - generic [ref=f199e1160]:
        - generic [ref=f199e1162]:
          - separator [ref=f199e1163]
          - heading "From the manufacturer" [level=2] [ref=f199e1164]
          - generic [ref=f199e1167]:
            - 'img "The Lost Caverns of Ixalan: Collector" [ref=f199e1170]'
            - generic [ref=f199e1172]:
              - heading "Behold Ancient Wonders" [level=3] [ref=f199e1173]
              - generic [ref=f199e1174]:
                - generic [ref=f199e1175]:
                  - paragraph [ref=f199e1176]:
                    - 'img "The Lost Caverns of Ixalan: Collector" [ref=f199e1177]'
                  - heading "Mesoamerican-Inspired Art" [level=4] [ref=f199e1178]
                  - paragraph [ref=f199e1179]: Full of dazzling treasures discovered in the depths of Ixalan, in some Collector Boosters you may find Borderless Oltec cards inspired by modern-day Mesoamerican art, murals that tell the story of Ixalan’s ancient history with Legends of Ixalan Showcase cards, or behold the almighty Gods of Ixalan Showcase cards!
                - generic [ref=f199e1180]:
                  - paragraph [ref=f199e1181]:
                    - 'img "The Lost Caverns of Ixalan: Collector" [ref=f199e1182]'
                  - heading "Mine Cosmium Neon Ink" [level=4] [ref=f199e1183]
                  - paragraph [ref=f199e1184]: Exclusively in Collector Boosters, you may even unearth a Borderless card with bold lines of neon ink infused with cosmium, a mineral of immense power found only in Ixalan’s core. Found in less than 1% of packs, these cards come charged with neon yellow, blue, purple, red, green, or special 3-color ink.
                - generic [ref=f199e1185]:
                  - paragraph [ref=f199e1186]:
                    - 'img "The Lost Caverns of Ixalan: Collector" [ref=f199e1187]'
                  - heading "Excavate Jurassic World Cards" [level=4] [ref=f199e1188]
                  - paragraph [ref=f199e1189]: There is more to these caverns than history tells, and life, uh, finds a way. Featuring iconic Jurassic World characters and ferocious dinosaurs, a Borderless Jurassic World Collection card can be found in every The Lost Caverns of Ixalan Collector Booster.
