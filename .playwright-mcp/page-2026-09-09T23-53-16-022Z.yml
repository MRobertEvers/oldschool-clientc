      - generic [ref=f82e933]:
        - generic [ref=f82e935]:
          - separator [ref=f82e936]
          - heading "From the manufacturer" [level=2] [ref=f82e937]
          - generic [ref=f82e940]:
            - generic [ref=f82e942]:
              - img "BRO Set Key Art A+" [ref=f82e943]
              - heading "Visit the Past. Save the Future." [level=3] [ref=f82e944]
              - paragraph [ref=f82e945]: "Travel back in time and witness history in the making! The Brothers’ War is a new look at one of Magic’s classic tales: a battle between two brothers that shaped the future of the entire Multiverse."
              - paragraph [ref=f82e946]: Wield powerful historical artifacts like colossal war machines and intricate Schematic cards. Are the lessons of the past enough to save the future?
            - generic [ref=f82e948]:
              - img "BRO Set Booster Breakdown A+" [ref=f82e949]
              - heading "Mighty Mechs & Inventive Mechanics" [level=3] [ref=f82e950]
              - paragraph [ref=f82e951]: Enter intense battles of titanic proportions with an army of magical mechs. Innovate with the introduction of the powerstone and prototype mechanics, and enjoy the return of fan-favorite mechanics meld and unearth.
              - paragraph [ref=f82e952]: Full-Art Mech Basic Lands
              - paragraph [ref=f82e953]: "Fill your battlefield with beautiful full-art landscapes featuring hulking mechs. A Full-Art Mech Land can be found in:"
              - paragraph [ref=f82e954]: "Collector Boosters: 1 Traditional Foil in every pack"
              - paragraph [ref=f82e955]: "Set Boosters: 1 Traditional Foil or nonfoil in 27% of packs"
              - paragraph [ref=f82e956]: "Draft Boosters: 1 nonfoil in 25% of packs"
            - generic [ref=f82e958]:
              - img "BRO Transformers A+ 3" [ref=f82e959]
              - heading "Transformers Cards" [level=3] [ref=f82e960]
              - paragraph [ref=f82e961]: Become More Than Meets the Eye with double-sided Transformers cards!
              - paragraph [ref=f82e962]: Your favorite Autobots and Decepticons can be found in The Brothers’ War Collector Boosters, Bundles, Gift Bundles, and some Set Boosters. (Not available in Draft Boosters.)
              - paragraph [ref=f82e963]: "Collector Boosters: 1 Traditional Foil or nonfoil in every pack"
              - paragraph [ref=f82e964]: "Set Boosters: 1 nonfoil in 10% of packs*"
              - paragraph [ref=f82e965]: "Bundle: 1 nonfoil with every Bundle, plus the opportunity to find more in the included Set Boosters*"
              - paragraph [ref=f82e966]: "Gift Bundle: 2 in every Gift Bundle (at least 1 Traditional Foil), plus the opportunity to find more in the included Set Boosters* *Generation 1 versions only"
              - paragraph [ref=f82e967]: Shattered Glass Transformers Cards—Collector Boosters Only
              - paragraph [ref=f82e968]: Shatter your expectations in a Transformers alternate universe where the heroic Autobots are evil and the villainous Decepticons are good.
              - paragraph [ref=f82e969]: A Traditional Foil or nonfoil Mythic Rare Transformers card with Shattered Glass alternate art can be found in 12% of Collector Boosters.
            - generic [ref=f82e971]:
              - img "BRO Wurmcoil A+ 4" [ref=f82e972]
              - heading "Retro-Frame Artifacts" [level=3] [ref=f82e973]
              - paragraph [ref=f82e974]: Rediscover powerful artifact cards from Magic’s history reprinted with retro frames. You may even find the original schematics, with Retro-Frame Artifact cards featuring alternate art that showcases the inventor’s sketches and designs.
              - paragraph [ref=f82e975]: "Collector Boosters: 3–4 Retro-Frame Artifacts in every pack, including at least 1 Schematic card."
              - paragraph [ref=f82e976]: "Draft and Set Boosters: at least 1 Retro-Frame Artifact in every pack. Schematic card in 16% of packs."
              - paragraph [ref=f82e977]: Double Rainbow Foil Serialized Schematic Cards—Collector Boosters Only
              - paragraph [ref=f82e978]: Every Schematic Artifact has a serialized version with a special Double Rainbow foil treatment, each marked with a number out of 500 created (for example, “#1 of 500”).
              - paragraph [ref=f82e979]: Collector Boosters are the only boosters that may contain a Serialized Schematic card, with 1 appearing in less than 1% of boosters.
