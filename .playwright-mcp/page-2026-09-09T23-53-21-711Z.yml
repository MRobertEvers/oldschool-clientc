        - generic [ref=f91e1045]:
          - heading "Product Description" [level=2] [ref=f91e1048]
          - paragraph [ref=f91e1050]: The Streets of New Capenna Bundle contains 8 Streets of New Capenna Set Boosters—the best boosters to open just for fun—plus exclusive accessories, with 40 basic lands (20 traditional foils and 20 nonfoils), 1 Traditional Foil promo card with Bundle-exclusive alternate art—Mysterious Limousine, 1 oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each Set Booster contains 12 Magic cards, 1 Art Card, and 1 token, ad card, counter punchout card, or special card from Magic's history (a card from "The List"). In every pack you’ll find a combination of 1–4 card(s) of rarity Rare or higher and 3–7 Uncommon, 3–7 Common, and 1 Land cards, including 1 Traditional or Gilded Foil card. Metropolis Full-Art Land in 33% of packs. Land is Traditional Foil in 21% of packs (traditional foil Metropolis land in 7% of packs).
