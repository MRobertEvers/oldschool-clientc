                - heading "The First Steps After the Last Stand" [level=3] [ref=f263e923]
                - paragraph [ref=f263e924]: The battle may be won, but the Multiverse will never be the same again. Many surviving Planeswalkers have lost their spark, though the paths between worlds are now open to all.
