        - generic [ref=f94e1090]:
          - heading "Product Description" [level=2] [ref=f94e1093]
          - paragraph [ref=f94e1095]: "The Kamigawa: Neon Dynasty Bundle contains 8 Kamigawa: Neon Dynasty Set Boosters—the best boosters to open just for fun—plus exclusive accessories, with 40 basic lands (20 traditional foils and 20 nonfoils), 1 traditional foil promo card with Bundle-exclusive alternate art—Invoke Despair, 1 oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each Kamigawa: Neon Dynasty Set Booster contains 12 Magic cards, 1 Art Card, and 1 token, ad card, Helper card, or special card from Magic's history (a card from \"The List\"), with a combination of 1–4 cards of rarity Rare or higher, 2–7 Uncommons, 3–8 Common cards, and 1 Land card in every pack. One non–Art Card and non–Land card of any rarity is traditional foil, and the Land card is traditional foil in 21% of packs."
