      - generic [ref=f94e897]:
        - generic [ref=f94e899]:
          - separator [ref=f94e900]
          - heading "From the manufacturer" [level=2] [ref=f94e901]
          - generic [ref=f94e904]:
            - generic [ref=f94e906]:
              - img "Neon Dynasty" [ref=f94e907]
              - heading "The Future is Now" [level=3] [ref=f94e908]
              - paragraph [ref=f94e909]: Over a millennium has passed since we last visited Kamigawa. Cutting-edge mortal technology complements—and threatens—the ancient spirits that still roam the plane. Call upon crafty ninjas, tell incredible sagas that spring to life, and reconfigure your creatures into powerful weapons. This is both Kamigawa and Magic like you’ve never seen them before!
            - generic [ref=f94e911]:
              - img "NEO Set Booster" [ref=f94e912]
              - paragraph [ref=f94e913]: Ukiyo-e Lands
              - paragraph [ref=f94e914]: "With beautiful full-art inspired by wood-block printing and land types written in Japanese kanji—Kamigawa: Neon Dynasty introduces Ukiyo-e Basic Lands."
              - paragraph [ref=f94e915]: You can find at least one Ukiyo-e Land in 33% of Draft Boosters and 45% of Set Boosters, with the possibility of getting a traditional foil. Collector Boosters contain one traditional foil Ukiyo-e Land in every pack.
              - paragraph [ref=f94e916]: Showcase Frames—Ninja & Samurai
              - paragraph [ref=f94e917]: "Look sharp and fight sharper. Every ninja and samurai card in Kamigawa: Neon Dynasty can be found with a special showcase treatment featuring striking alternate art in a ninja or samurai showcase frame—including one ninja Planeswalker, Kaito Shizuki, and one samurai Planeswalker, the Wandering Emperor!"
              - paragraph [ref=f94e918]: Every Collector Booster contains at least two Showcase Ninja cards and at least two Showcase Samurai cards. Showcase Samurai and Ninja cards can also be found in some Draft and Set Boosters.
            - generic [ref=f94e920]:
              - img "NEO Draft Booster" [ref=f94e921]
              - heading "Light It Up" [level=3] [ref=f94e922]
              - paragraph [ref=f94e923]: Showcase Soft Glow Frames
              - paragraph [ref=f94e924]: Collect cards that light up your deck with Showcase Soft Glow frames inspired by the glowing neon signs that line the city streets of Kamigawa. Showcase Soft Glow cards can be found in some Draft, Set, and Collector Boosters.
              - paragraph [ref=f94e925]: Neon Ink Foils—A Collector Booster Exclusive
              - paragraph [ref=f94e926]: "Kamigawa: Neon Dynasty introduces another foil type to Magic: The Gathering—Neon Ink Foil cards."
              - paragraph [ref=f94e927]: In some Collector Boosters you may find a Neon Ink Foil card with its art and frame highlighted in fluorescent red, blue, or green ink.
              - paragraph [ref=f94e928]: "PLEASE NOTE: While full of neon-lit streets, bright colors, and shining foils, none of the cards in Kamigawa: Neon Dynasty glow in the dark."
            - generic [ref=f94e930]:
              - img "NEO" [ref=f94e931]
              - heading "Cybernetically Enhance Your Creatures" [level=3] [ref=f94e932]
              - paragraph [ref=f94e933]: The Future of Artifacts Has Arrived
              - paragraph [ref=f94e934]: Power up your deck with a trove of futuristic artifacts and enhance your creatures with special artifact creatures that turn into Equipment with the reconfigure mechanic.
              - paragraph [ref=f94e935]: Sagas That Come to Life
              - paragraph [ref=f94e936]: "Kamigawa: Neon Dynasty also introduces double-faced Saga cards. Once their tale is told, these stories come to life—flipping and returning to the battlefield as a creature card."
