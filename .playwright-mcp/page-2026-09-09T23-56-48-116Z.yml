          - paragraph [ref=f158e995]: The Kaldheim Bundle contains 10 Kaldheim Draft Booster Packs, 2 land packs with 40 basic lands from the Kaldheim setting (20 in foil and 20 non-foil), 1 alternate-art promo card, 1 oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each of the 10 Kaldheim Draft Booster Packs contain 15 Magic cards and 1 ad/token, or MDFC Helper—with 1 Rare or Mythic Rare, 3 Uncommons, 10 Commons, and 1 Snow Land (basic or tapped dual). 1 in 3 Kaldheim Draft Boosters contains a foil.
