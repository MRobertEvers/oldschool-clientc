              - paragraph [ref=f158e957]: Battle through the brutal Viking world of Kaldheim in Magic’s most metal set ever. Draugr and demons, giants and shapeshifters—show your opponents what legends are made of with two powerful mechanics making their debut, Foretell and Boast. And unleash the power of Kaldheim’s icy expanse with the return of Snow Lands and Saga cards. Prove your worth to Magic’s new pantheon of Norse-inspired gods and save the World Tree from chaos.
            - generic [ref=f158e959]:
              - 'img "Snow lands, Magic: the Gathering, Kaldheim" [ref=f158e960]'
              - paragraph [ref=f158e961]: "\"This is a tale to make all Kaldheim tremble…\"—Birgi, God of Storytelling"
              - paragraph [ref=f158e962]: Explore the icy expanse of Kaldheim with the return of snow lands and powerful snow mechanics. Get ten snow lands—one in every Draft Booster Pack, each with a beautiful snow-dusted frame—and activate special abilities in snow cards throughout the set.
              - paragraph [ref=f158e963]: Saga cards also return to share gripping stories from across the Ten Realms. The frigid battlefields, brutal landscapes, and gnarly creatures of those tales fill the set.
            - generic [ref=f158e965]:
              - 'img "Magic: the Gathering, Magic: The Gathering, Kaldheim" [ref=f158e966]'
              - paragraph [ref=f158e967]: "Your legend has been foretold! Kaldheim introduces two mechanics to Magic: The Gathering."
              - paragraph [ref=f158e968]: Boast
              - paragraph [ref=f158e969]: "\"That was nothing. I once took down a frost giant with a spoon!\"—Dwarven Goldmaw Champion"
              - paragraph [ref=f158e970]: In Kaldheim, boasting is both common and encouraged. Rowdy warriors goad each other into outlandish tests of strength and skill, bragging about their deeds as they perform bigger and better feats . . . or claim to.
              - paragraph [ref=f158e971]: After a creature attacks, you can activate their "boast" ability once that turn—adding even more flair to the tavern story that's sure to follow.
              - paragraph [ref=f158e972]: Foretell
              - paragraph [ref=f158e973]: A storm cloud on the horizon, a group of six ravens flying south, the rumbling of the ground . . . the denizens of Kaldheim believe that the natural world is filled with signs of what's to come, if only you know how to understand them.
              - paragraph [ref=f158e974]: During your turn, you can pay mana to exile a card with the "foretell" ability from your hand, face down. You can then cast it on a later turn for its foretell cost.
              - paragraph [ref=f158e975]: Keep your opponent guessing, spread out your mana costs, wait for the perfect time to cast that counterspell, and bluff your way to victory. Only you know the prophecy of what's to come.
            - generic [ref=f158e977]:
              - img "Magic the gathering, kaldheim" [ref=f158e978]
              - paragraph [ref=f158e979]: "\"The world was born from a seed, and that seed grew into the World Tree, and everything else grew from it. Its leaves were every color imaginable, and as its branches spread out, they became worlds themselves.\"—The First Saga"
              - paragraph [ref=f158e980]: This Bundle includes forty basic land cards to add some Viking flair to your decks—20 in foil, 20 non-foil—beautifully illustrated with the icy expanse of Kaldheim, from runes carved into the stones of a sweeping plain to the shimmer of cosmic light across the World Tree.
            - generic [ref=f158e982]:
              - 'img "Magic the Gathering, Magic: the Gathering" [ref=f158e983]'
              - 'heading "About Magic: The Gathering" [level=3] [ref=f158e984]'
              - paragraph [ref=f158e985]: "Magic: The Gathering fuses playing cards and trading cards: players face off with decks they’ve built by selecting cards from a larger pool."
              - paragraph [ref=f158e986]: That customization means every game plays out a little differently, and makes Magic the deepest strategy card game there is. At every step, players must draw on their critical thinking skills to calculate the perfect strategy, predict the oncoming attack, and outwit their opponent.
              - paragraph [ref=f158e987]: And it's more than cards. It’s stories. It’s art. It’s a community twenty-five years in the making, with players, fans, and artists from all around the world united by a love of the game.
