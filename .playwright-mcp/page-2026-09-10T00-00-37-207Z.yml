        - generic [ref=f276e961]:
          - heading "Product Description" [level=2] [ref=f276e964]
          - paragraph [ref=f276e966]: The Dominaria United Bundle contains 8 Dominaria United Set Boosters—the best boosters to open just for fun—plus exclusive accessories, with 40 basic lands (20 traditional foils and 20 nonfoils), 1 Traditional Foil promo card with Bundle-exclusive alternate art, 1 oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each Dominaria United Set Booster contains 12 Magic cards, 1 Art Card, and 1 token/ad card or card from “The List” (a special card from Magic's history—found in 25% of packs), with a combination of 1–4 card(s) of rarity Rare or higher and 4–7 Uncommon, 3–6 Common, and 1 Land cards in every pack. Traditional Foil Land replaces Land card in 21% of Set Boosters. Foil-Stamped Signature Art Card replaces Art Card in 10% of Set Boosters.
