              - heading "Return to Where It All Began" [level=3] [ref=f276e761]
              - paragraph [ref=f276e762]: "To kick off Magic: The Gathering’s 30th anniversary celebration, Dominaria United returns to the plane that started it all and begins an immersive, year-long story that fans will be talking about for years to come. Four sets. One enemy. The Phyrexians are here, and the fate of the multiverse is at stake."
            - generic [ref=f276e764]:
              - img "DMU Booster A+ 2" [ref=f276e765]
              - heading "Legendary Set. Legendary Cards." [level=3] [ref=f276e766]
              - paragraph [ref=f276e767]: Dominaria is an ancient plane filled with countless cultures, legends, and forgotten treasures.
              - paragraph [ref=f276e768]: Reunite with your favorite heroes with at least one Legendary Creature card in every Dominaria United Draft, Set, and Collector Booster.
              - paragraph [ref=f276e769]: "Lost Legends—Collector Boosters Only:"
              - paragraph [ref=f276e770]: In three percent of Dominaria United Collector Boosters you may also find a card pulled from actual, long-lost booster packs from the beloved 1994 set, Legends.
              - paragraph [ref=f276e771]: "Legends Retold Box Topper Cards:"
              - paragraph [ref=f276e772]: Every full Draft, Set, and Collector Booster Box also comes with a Box Topper containing 1 Traditional Foil Legendary Creature or Planeswalker card that puts a new spin on a classic tale, with designs inspired by the original 1994 Legends characters. These cards can also be found in some Dominaria United Collector Boosters.
