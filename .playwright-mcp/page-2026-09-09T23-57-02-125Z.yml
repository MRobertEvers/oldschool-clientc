      - generic [ref=f184e847]:
        - generic [ref=f184e849]:
          - separator [ref=f184e850]
          - heading "From the manufacturer" [level=2] [ref=f184e851]
          - generic [ref=f184e854]:
            - generic [ref=f184e856]:
              - heading "Every World. Every Hero. One Last Stand." [level=3] [ref=f184e857]
              - img "March of the Machine" [ref=f184e858]
              - paragraph [ref=f184e859]: Planes across the Multiverse have fallen to the Phyrexian invasion. Hope isdwindling and the spark of individuality and rebellion is nothing but an ember. With corrupted Planeswalkers and the remaining heroes nearly overwhelmed, the fate of all hinges on one last stand.
            - generic [ref=f184e861]:
              - heading "Multiverse Legends" [level=3] [ref=f184e862]
              - img "March of the Machine" [ref=f184e863]
              - paragraph [ref=f184e864]: March of the Machine brings a whole Multiverse of Legendary creatures together for the final battle. Multiverse Legend cards are Legendary Creature reprints, each with a showcase frame styled after the plane that creature is from. Eleven showcase frame styles return for the planes of Theros, Kaldheim, Zendikar, Kamigawa, New Capenna, Dominaria, New Phyrexia, Eldraine, Innistrad, Amonkhet, and Arcavios (home of Strixhaven University), and five new frames are introduced for Kaladesh, Tarkir, Ravnica, Ikoria, and Ixalan!
              - paragraph [ref=f184e865]: At least 1 Multiverse Legend card can be found in every March of the Machine Draft and Set Booster. Collector Boosters contain 3 foil Multiverse Legends in every pack, including at least 1 with a special foil treatment (Halo Foil nonserialized, Foil-Etched nonserialized, or Double Rainbow Foil Serialized card).
            - generic [ref=f184e867]:
              - heading "Halo Foils & Serialized Cards" [level=3] [ref=f184e868]
              - img "March of the Machine" [ref=f184e869]
              - paragraph [ref=f184e870]: Get the finest cards in the Multiverse with Collector Booster-exclusive special treatments!
              - paragraph [ref=f184e871]: "Halo Foils: March of the Machine introduces Halo Foil cards that shine with a gorgeous rippling rainbow pattern. A Halo Foil Rare or Mythic Rare card can be found in 10% of Collector Boosters."
              - paragraph [ref=f184e872]: "Serialized Cards: Collector Boosters are also the only March of the Machine packs that may contain Serialized cards—a Double Rainbow Foil Serialized Multiverse Legend or Serialized Alt-Art Borderless Praetor card can be found in less than 1% of packs."
            - generic [ref=f184e874]:
              - heading "Introducing the Battle Card Type" [level=3] [ref=f184e875]
              - img "March of the Machine" [ref=f184e876]
              - paragraph [ref=f184e877]: "March of the Machine introduces an all new card type: Battle! Each card represents the invasion of a different plane in the Multiverse. Battle it out with your friends and, if you win, the card will transform into a tactical advantage."
