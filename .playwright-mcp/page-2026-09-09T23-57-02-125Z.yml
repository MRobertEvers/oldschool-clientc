          - heading "Product Description" [level=2] [ref=f184e1202]
          - paragraph [ref=f184e1204]: The March of the Machine Bundle contains 8 March of the Machine Set Boosters—the best boosters to open just for fun—plus accessories, with 1 traditional foil alternate-art promo card—Ghalta and Mavren, 40 basic lands (20 traditional foils and 20 nonfoils), 1 oversized Spindown life counter, 1 card storage box, and 2 reference cards. Each Set Booster contains 12 Magic cards, 1 Art Card, and 1 token/ad card, Helper card, or card from “The List” (a special card from Magic's history—found in 25% of packs). Every pack includes a combination of 1–5 card(s) of rarity Rare or higher, and 3–8 Uncommon, 2–7 Common, and 1 Land cards. 1 non–Art Card and non–Land card of any rarity is foil. Traditional Foil Borderless Mythic Planeswalker in <1% of boosters. Foil-Stamped Signature Art Card replaces Art Card in 10% of boosters.
