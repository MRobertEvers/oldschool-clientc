; Boot manifest: straight into the Inferno Zuk instance, server embedded.
;
; manifest_osrs230_embed.ini plus two things: the login credentials and a
; `[net:boot] cheat=zuk`, so the whole invocation is
;
;   make -C src torirs EMBED_SERVER=1
;   src/torirs --manifest manifest_osrs230_zuk.ini
;
; The cheat is the mock server's `::zuk` — it teleports the account into the
; Inferno instance (map square 35_83, region 9043), the scene of the
; "orange wedge" investigation (docs/ORANGE_WEDGE.md). TORIRS_NET_CHEAT still
; overrides, so a run can substitute a different destination without editing
; this file.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239.baked

[net:boot]
rev=osrs230
transport=embed
; Inert — kept so a diff against manifest_osrs230_embed.ini is small.
host=localhost
port=43595
client_version=230
user=testc
pass=test
; Sent once right after login. No leading "::".
cheat=zuk
; RSA public key matching the mock server's private key (mock decrypts the
; login block). E=10001; N is the mock's 1024-bit modulus.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[ui:boot]
logic=cs2
chrome=cache
interface_id=161

; See manifest_osrs230_embed.ini for the chatbox story.
[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
chatbox_line_height=14
