; Combined lane: the RS2012 QBD/Tormented Demon content AND 2009scape
; Summoning, in one client session.
;
;   make -C src mock230-cache-rs2012-summoning mock230-scripts-summoning mock230-servpack
;   ./run-live.sh manifest_osrs239_rs2012_summoning.ini testc test
;
; (run-live.sh bakes both halves itself when the tree is newer than the cache,
; so the make line is only needed for a manual/CI build.)
;
; Both `ported/` lanes are excluded from the ordinary content walk, so each one
; reaches a client through exactly one route: its own bake. Neither lane's cache
; carries the other's records, which is why this manifest cannot simply name one
; of them. `cache.osrs239.rs2012-summoning` is the composition — the QBD/TD bake
; first, then the Summoning bake with that result as its base, so the Summoning
; overlay lands on top of the imported rev-727 npc/loc/model ids rather than
; replacing them (src/Makefile, mock230-cache-rs2012-summoning).
;
; The server half needs no composition: mock230-scripts-summoning already packs
; both lanes' symbol tables and component roots, so one script build serves the
; two. It is the feature-ON build (`build_summoning`), which is why `scripts=`
; is stated below — every other QBD manifest takes sscompile's default output.

[cache:boot]
epoch=dat2
game=oldschool
revision=239
quirks=none
dir=cache.osrs239.rs2012-summoning

[net:boot]
rev=osrs239
transport=embed
host=localhost
port=43595
client_version=239
; The feature-on script pack. The default (`.../build`) compiles the same
; sources with ^summoning_enabled = 0, and every Summoning entry point below
; returns immediately against it.
scripts=OSRS-Content/osrs239-content/server/scripts/build_summoning
user=testc
pass=test
; Summoning is provisioned at login; the QBD arena is NOT entered at login.
; Auto-entry is what manifest_osrs239_rs2012.ini is for, and forcing it here
; would put every session inside the instance before it could touch an obelisk.
; Type the same cheats in chat instead, once the kit is in hand:
;
;   ::rs2012qbdmanifest   the release-profile private QBD arena
;   ::rs2012tdbypass      the Tormented Demon QA bypass (grants no quest state)
;
; `setlevel summoning 99` also fills the point pool: summoning points are the
; current level against the base (summoning_points.rs2, oploc2), and setlevel
; raises both. Steel titan is the level-99 familiar this lane exists to fight
; the dragon with, so it is the one provisioned with its scrolls.
cheat=summoning_unlock;setlevel summoning 99;summoning_pouch;summoning_dreadfowl_pouch;summoning_spirit_terrorbird_pouch;summoning_steel_titan_pouch;summoning_clockwork_cat;summoning_infuse_supplies
; RSA public key matching the embedded mock server's private key.
rsa_exp=10001
rsa_mod=c30fcbc01e071ff224ea1a6508052d1140f87abaf8f40f7004efa59926708e5d99e2bc832fdca8276482dd0d690f644156850f47886f8032b3e9aa52508d24e8c9b7c50b8d8b8716fb8c3993bb6ce15e2124883edb7aaa7241a8b530f806c61cd1345879413fc105980a4f5fcdb3f0d743b14b16228b4d1496c83d3755a78a19

[action:spawn_whisperer]
t=spawn_npc
a=id=27200

[debug:hotkeys]
8=spawn_whisperer

[ui:boot]
logic=cs2
chrome=revconfig
interface_id=161

; Gameframe and developer overlay as separate root siblings, exactly as both
; parent lanes declare them. The Summoning UI is not this overlay: it is an
; overlay-owned cache interface that CS2 mounts inside wornitems:universe.
[revconfig:component:gameframe]
type=rs_iface

[revconfig:component:overlay]
type=debug_overlay

[revconfig:layout:root]
c=gameframe
=
c=overlay

[ui:chatbox]
chatbox_interface=162
chatbox_messages=58
chatbox_first_line=59
chatbox_line_count=500
chatbox_line_height=14

[features:boot]
era=osrs
ground_click_nearest=box10_rect
;
; The rest of the table this manifest does not state, commented out at the
; value the era already gives it — uncommenting one as written changes nothing,
; so each line is an edit point rather than a change. Keep the value alone on
; the line: bm_parse_int rejects trailing text, so `painter_draw_distance=40 ;
; wider` is a parse error, not a value. Full descriptions in
; src/features/features.h.
;
; Painter radius in tiles, 25..90 (deob class112.method3959). The osrs table
; says 32; Client-TS is fixed at 25.
;painter_draw_distance=32
; Permissive extension, off in every era table on purpose: 1 = when the box
; above finds no reachable tile, walk to the flooded tile nearest the click
; anyway instead of doing nothing.
;ground_click_unbounded=0
; Permissive extension: 1 = a click that hit no ground triangle at all (sky,
; the void ringing an instance's floor, a plane the filter refused) resolves to
; the scene tile nearest the cursor instead of walking nowhere.
;ground_click_offmap=0

; The Summoning lane's own manifest adds `--soft3d`. This one does not: the QBD
; arena is the heaviest scene either lane draws and it is developed on the
; ordinary renderer. Add it here if a familiar model turns up a GL-only defect.
;[client:args]
;arg=--soft3d
